<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Elite v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #bloqueio, #modal-saida, #pagina-detalhes { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        #pagina-detalhes { background: #f3f4f6; flex-direction: column; justify-content: flex-start; overflow-y: auto; padding: 0; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 30px; padding: 25px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800 font-sans">

    <div id="bloqueio">
        <div class="modal-content text-center">
            <h2 class="text-xl font-bold mb-4 uppercase text-blue-700">Licença Expirada</h2>
            <input type="password" id="senha-licenca" placeholder="Senha 0907" class="border-2 p-4 rounded-xl w-full mb-4 text-center">
            <button onclick="verificarSenha()" class="bg-blue-600 text-white w-full py-4 rounded-xl font-bold uppercase">Ativar App</button>
        </div>
    </div>

    <div id="pagina-detalhes">
        <header class="bg-blue-700 text-white p-5 w-full flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-4">
                <button onclick="fecharDetalhes()" class="text-xl">←</button>
                <h1 class="text-lg font-black uppercase italic">Comprovante de Serviço</h1>
            </div>
            <button onclick="gerarPDF()" class="bg-green-500 text-[10px] px-4 py-2 rounded-lg font-black uppercase">Baixar PDF</button>
        </header>
        
        <div id="conteudo-pdf" class="p-5 w-full max-w-xl space-y-4 bg-gray-50">
            <div id="detalhe-fotos-grid" class="grid grid-cols-2 gap-2"></div>
            
            <div class="bg-white p-6 rounded-3xl shadow-sm space-y-4 border border-gray-100">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Placa</label><p id="detalhe-placa" class="font-black text-xl"></p></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Cliente</label><p id="detalhe-cliente" class="font-bold"></p></div>
                </div>
                <div><label class="text-[10px] font-bold text-gray-400 uppercase">Modelo/Marca</label><p id="detalhe-modelo" class="font-bold text-blue-600 uppercase"></p></div>
                <div class="grid grid-cols-2 gap-4 border-t pt-4">
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Entrada</label><p id="detalhe-entrada" class="font-bold text-gray-600"></p></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Saída</label><p id="detalhe-saida" class="font-bold text-gray-600"></p></div>
                </div>
                <div class="border-t pt-4">
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Serviço Realizado</label>
                    <p id="detalhe-servico" class="font-bold text-green-600 italic uppercase"></p>
                </div>
            </div>
        </div>
        <div class="p-5 w-full max-w-xl">
            <button id="btn-excluir-relatorio" class="w-full bg-red-50 text-red-600 font-black p-4 rounded-2xl uppercase text-xs">Excluir Registro</button>
        </div>
    </div>

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-2xl">
        <div class="flex justify-between items-center text-center">
            <div>
                <h1 id="app-nome-display" class="text-xl font-black italic uppercase leading-none">PÁTIO PRO</h1>
                <span id="dias-restantes" class="text-[9px] font-bold opacity-70 uppercase italic tracking-widest">VERIFICANDO...</span>
            </div>
            <span id="contador" class="bg-blue-900 px-3 py-1 rounded-full text-[10px] font-bold uppercase italic">0 NO PÁTIO</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-100">
                <form id="form-entrada" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <div class="flex justify-between items-center">
                        <h2 id="titulo-form" class="text-xs font-black uppercase text-blue-700">Novo Registro</h2>
                        <button type="button" onclick="cancelarEdicao()" id="btn-cancelar-edit" class="hidden text-red-500 text-[10px] font-bold uppercase">Cancelar</button>
                    </div>
                    
                    <input type="text" id="input-data-entrada" placeholder="Data" required class="w-full bg-gray-50 border-2 p-3 rounded-2xl font-bold text-center uppercase">
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-black text-xl uppercase text-center">
                    <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase">
                    <input type="text" id="cliente" placeholder="NOME DO CLIENTE" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase">
                    
                    <div id="container-previa" class="hidden grid grid-cols-3 gap-2"></div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex flex-col items-center justify-center border-2 border-blue-200 p-4 rounded-2xl text-blue-600 cursor-pointer bg-blue-50">
                            <span class="font-bold text-[10px] uppercase">📸 Foto</span>
                            <input type="file" id="foto-camera" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(this)">
                        </label>
                        <button type="submit" id="btn-submit" class="bg-blue-600 text-white font-black rounded-2xl shadow-lg uppercase text-xs">Registrar</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-relatorio" class="tab-content">
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-20 z-50">
        <button onclick="mudarAba('entrada')" id="btn-nav-entrada" class="nav-button active flex flex-col items-center flex-1 p-2"><span class="text-xl">➕</span><span class="text-[8px] font-bold uppercase">Entrada</span></button>
        <button onclick="mudarAba('patio')" id="btn-nav-patio" class="nav-button flex flex-col items-center flex-1 p-2"><span class="text-xl">🚗</span><span class="text-[8px] font-bold uppercase">Pátio</span></button>
        <button onclick="mudarAba('relatorio')" id="btn-nav-relatorio" class="nav-button flex flex-col items-center flex-1 p-2"><span class="text-xl">📋</span><span class="text-[8px] font-bold uppercase">Relatório</span></button>
    </nav>

    <script>
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO" };
        let fotosTemporarias = [];
        const SENHA_MESTRA = "0907";

        document.getElementById('input-data-entrada').value = new Date().toLocaleDateString('pt-BR');

        // --- Lógica de Fotos ---
        async function processarFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxW = 400;
                        canvas.width = maxW;
                        canvas.height = img.height * (maxW / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.5);
                        fotosTemporarias.push(base64);
                        renderizarPrevias();
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function renderizarPrevias() {
            const container = document.getElementById('container-previa');
            container.innerHTML = '';
            fotosTemporarias.forEach((f, i) => {
                container.innerHTML += `
                    <div class="relative h-20 bg-gray-100 rounded-lg overflow-hidden">
                        <img src="${f}" class="w-full h-full object-cover">
                        <button type="button" onclick="removerFotoTemp(${i})" class="absolute top-0 right-0 bg-red-500 text-white text-[8px] px-1 font-bold">X</button>
                    </div>`;
            });
            container.classList.toggle('hidden', fotosTemporarias.length === 0);
        }

        function removerFotoTemp(i) {
            fotosTemporarias.splice(i, 1);
            renderizarPrevias();
        }

        // --- CRUD ---
        document.getElementById('form-entrada').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const dados = {
                id: id ? Number(id) : Date.now(),
                placa: document.getElementById('placa').value.toUpperCase(),
                modelo: document.getElementById('modelo').value.toUpperCase(),
                cliente: document.getElementById('cliente').value.toUpperCase(),
                fotos: [...fotosTemporarias],
                entrada: document.getElementById('input-data-entrada').value,
                dataRaw: id ? (patio.find(v => v.id == id).dataRaw) : new Date().toISOString(),
                status: id ? (patio.find(v => v.id == id).status) : "Diagnóstico"
            };

            if(id) {
                const idx = patio.findIndex(v => v.id == id);
                patio[idx] = dados;
            } else {
                patio.unshift(dados);
            }

            localStorage.setItem('patio_data', JSON.stringify(patio));
            location.reload();
        });

        window.editarVeiculo = (id) => {
            const v = patio.find(v => v.id == id);
            document.getElementById('edit-id').value = v.id;
            document.getElementById('placa').value = v.placa;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('cliente').value = v.cliente;
            document.getElementById('input-data-entrada').value = v.entrada;
            fotosTemporarias = [...(v.fotos || [])];
            renderizarPrevias();
            document.getElementById('titulo-form').innerText = "Editando Veículo";
            document.getElementById('btn-cancelar-edit').classList.remove('hidden');
            document.getElementById('btn-submit').innerText = "Salvar Alterações";
            mudarAba('entrada');
        };

        window.cancelarEdicao = () => location.reload();

        // --- Auxiliares ---
        function calcularDias(dataISO) {
            const inicio = new Date(dataISO);
            const hoje = new Date();
            const diff = Math.floor((hoje - inicio) / (1000 * 60 * 60 * 24));
            return diff === 0 ? "Chegou hoje" : diff + " dias no pátio";
        }

        function renderizarPátio() {
            const c = document.getElementById('lista-veiculos'); c.innerHTML = '';
            document.getElementById('contador').innerText = patio.length + " NO PÁTIO";
            patio.forEach(v => {
                c.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex gap-4 items-center">
                    <img src="${v.fotos[0] || ''}" class="w-16 h-16 rounded-2xl object-cover bg-gray-200">
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-start">
                            <span class="font-black text-lg text-gray-800">${v.placa}</span>
                            <span class="text-[8px] font-black text-orange-500 uppercase">${v.status}</span>
                        </div>
                        <div class="text-[9px] text-gray-400 font-bold uppercase truncate">${v.modelo}</div>
                        <div class="text-[9px] text-blue-600 font-bold italic mt-1">${calcularDias(v.dataRaw)}</div>
                        <div class="flex gap-2 mt-2">
                            <button onclick="editarVeiculo(${v.id})" class="flex-1 text-[8px] font-black bg-gray-100 text-gray-600 p-2 rounded-lg uppercase italic">Editar/Fotos</button>
                            <button onclick="abrirModalSaida(${v.id})" class="flex-1 text-[8px] font-black bg-green-600 text-white p-2 rounded-lg uppercase">Dar Saída</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        // --- PDF e Detalhes ---
        window.abrirDetalhes = (id) => {
            const v = historico.find(v => v.id == id);
            const grid = document.getElementById('detalhe-fotos-grid');
            grid.innerHTML = '';
            v.fotos.forEach(f => grid.innerHTML += `<img src="${f}" class="w-full h-32 object-cover rounded-xl shadow-sm">`);
            
            document.getElementById('detalhe-placa').innerText = v.placa;
            document.getElementById('detalhe-cliente').innerText = v.cliente;
            document.getElementById('detalhe-modelo').innerText = v.modelo;
            document.getElementById('detalhe-entrada').innerText = v.entrada;
            document.getElementById('detalhe-saida').innerText = v.saida;
            document.getElementById('detalhe-servico').innerText = v.servico;
            
            document.getElementById('btn-excluir-relatorio').onclick = () => {
                if(confirm("Excluir definitivo?")) {
                    historico = historico.filter(h => h.id != id);
                    localStorage.setItem('patio_historico', JSON.stringify(historico));
                    fecharDetalhes(); mudarAba('relatorio');
                }
            };
            document.getElementById('pagina-detalhes').style.display = 'flex';
        };

        window.gerarPDF = async () => {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('conteudo-pdf');
            const canvas = await html2canvas(element, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`Comprovante_${document.getElementById('detalhe-placa').innerText}.pdf`);
        };

        // --- Funções de Navegação Reutilizadas ---
        window.mudarAba = (aba) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            document.getElementById('btn-nav-' + aba).classList.add('active');
            if(aba === 'relatorio') renderizarRelatorio();
            if(aba === 'patio') renderizarPátio();
        };

        function renderizarRelatorio() {
            const r = document.getElementById('lista-relatorio'); r.innerHTML = '';
            historico.forEach(v => {
                r.innerHTML += `
                <div onclick="abrirDetalhes(${v.id})" class="bg-white p-4 rounded-3xl border flex gap-4 items-center shadow-sm">
                    <img src="${v.fotos[0] || ''}" class="w-14 h-14 rounded-xl object-cover">
                    <div class="flex-1">
                        <div class="font-black text-sm uppercase">${v.placa}</div>
                        <p class="text-[9px] text-green-600 font-bold uppercase mt-1">✓ ${v.servico}</p>
                    </div>
                    <span class="text-[18px]">📄</span>
                </div>`;
            });
        }

        window.fecharDetalhes = () => document.getElementById('pagina-detalhes').style.display = 'none';
        
        // Inicialização básica (reutilizando sua lógica de licença)
        function verificarLicenca() {
            let data = localStorage.getItem('data_ativacao') || Date.now();
            localStorage.setItem('data_ativacao', data);
            const decorrido = Date.now() - parseInt(data);
            if (decorrido > (30 * 24 * 60 * 60 * 1000)) document.getElementById('bloqueio').style.display = 'flex';
            else document.getElementById('bloqueio').style.display = 'none';
        }

        verificarLicenca();
        renderizarPátio();
    </script>
</body>
</html>
