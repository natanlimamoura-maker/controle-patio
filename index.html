<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALCANTARA'S DIESEL LTDA - Gestão Integrada</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/delivery-truck.png">

    <!-- TailWind CSS, Supabase SDK & Biblioteca PDF -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #dc2626; background: #fef2f2; border-radius: 15px; }
        #modal-saida, #modal-transacao, #modal-estoque { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        #toast-container { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 10000; pointer-events: none; }
        .toast { background: #333; color: white; padding: 12px 25px; border-radius: 50px; margin-top: 10px; font-weight: 800; font-size: 11px; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: opacity 0.5s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-28 text-gray-800 font-sans">

    <div id="toast-container"></div>

    <!-- Input Invisível para foto extra do veículo no Pátio -->
    <input type="file" id="input-foto-extra-patio" accept="image/*" capture="environment" class="hidden" onchange="processarFotoExtraPatio(this)">

    <!-- CABEÇALHO -->
    <header class="bg-red-600 text-white p-6 shadow-xl sticky top-0 z-50 rounded-b-[40px] flex justify-between items-end h-32">
        <div>
            <h1 class="text-xl font-black italic uppercase tracking-tighter leading-none" id="titulo-modulo">CONTROLE DE PÁTIO</h1>
            <span class="text-[9px] font-bold opacity-80 uppercase tracking-widest italic leading-none">ALCANTARA'S DIESEL LTDA</span>
        </div>
        <div class="text-right">
            <span id="contador-patio" class="bg-black/30 px-4 py-2 rounded-2xl text-[10px] font-black uppercase italic">0 NO PÁTIO</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <!-- ABA ENTRADA -->
        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-[35px] shadow-xl border border-gray-100">
                <form id="form-entrada" class="space-y-4">
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-5 rounded-3xl font-black text-2xl text-center uppercase focus:border-red-600 outline-none">
                    <input type="text" id="modelo" placeholder="MODELO DO VEÍCULO" required class="w-full bg-gray-50 border-2 border-transparent p-5 rounded-2xl font-bold uppercase outline-none focus:border-red-600">
                    <input type="text" id="cliente" placeholder="NOME DO CLIENTE" required class="w-full bg-gray-50 border-2 border-transparent p-5 rounded-2xl font-bold uppercase outline-none focus:border-red-600">
                    
                    <div id="container-previa" class="hidden grid grid-cols-3 gap-2 py-2"></div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex flex-col items-center justify-center border-2 border-dashed border-red-200 p-5 rounded-3xl text-red-600 bg-red-50 cursor-pointer">
                            <span class="text-2xl">📸</span>
                            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarFotoPatio(this)">
                        </label>
                        <button type="submit" class="bg-red-600 text-white font-black rounded-3xl uppercase shadow-lg active:scale-95">Salvar Entrada</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ABA PÁTIO -->
        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <!-- ABA FINANCEIRO -->
        <section id="aba-financeiro" class="tab-content">
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-emerald-100">
                    <span class="text-[9px] font-black text-emerald-600 uppercase tracking-wider block mb-1">Receitas</span>
                    <span id="total-receitas" class="text-xl font-black text-emerald-600">R$ 0,00</span>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-red-100">
                    <span class="text-[9px] font-black text-red-600 uppercase tracking-wider block mb-1">Despesas</span>
                    <span id="total-despesas" class="text-xl font-black text-red-600">R$ 0,00</span>
                </div>
            </div>

            <button onclick="abrirModalTransacao()" class="w-full bg-black text-white p-5 rounded-3xl font-black uppercase text-xs mb-6 shadow-lg active:scale-95 flex items-center justify-center gap-2">
                <span>➕</span> Nova Transação
            </button>

            <div class="bg-white p-6 rounded-[35px] shadow-xl border">
                <h3 class="font-black text-xs uppercase text-gray-400 mb-4 tracking-wider">Últimas Movimentações</h3>
                <div id="lista-transacoes" class="space-y-3"></div>
            </div>
        </section>

        <!-- ABA ESTOQUE -->
        <section id="aba-estoque" class="tab-content">
            <button onclick="abrirModalEstoque()" class="w-full bg-red-600 text-white p-5 rounded-3xl font-black uppercase text-xs mb-6 shadow-lg active:scale-95 flex items-center justify-center gap-2">
                <span>📦</span> Cadastrar Item no Estoque
            </button>

            <div id="lista-estoque" class="space-y-3"></div>
        </section>

        <!-- ABA HISTÓRICO -->
        <section id="aba-relatorio" class="tab-content">
            <div class="bg-white p-4 rounded-3xl shadow-sm border-2 mb-4">
                <input type="text" id="busca-historico" onkeyup="renderizarRelatorio()" placeholder="🔍 BUSCAR PLACA OU CLIENTE" class="w-full p-4 rounded-2xl bg-gray-50 font-black uppercase text-center outline-none">
            </div>
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>
    </main>

    <!-- MODAIS -->
    <div id="modal-saida">
        <div class="bg-white p-8 rounded-[40px] w-full max-w-sm m-4 text-center shadow-2xl">
            <h3 class="font-black text-red-600 uppercase italic mb-4 text-xl">Concluir Serviço</h3>
            <input type="hidden" id="saida-id-temp">
            <textarea id="input-servico-final" placeholder="DESCRIÇÃO DO SERVIÇO / PEÇAS TROCADAS..." class="w-full bg-gray-100 p-4 rounded-2xl mb-3 font-bold uppercase outline-none h-24 text-xs resize-none border-2 focus:border-red-600"></textarea>
            <input type="number" id="input-valor-servico" step="0.01" placeholder="VALOR COBRADO (R$)" class="w-full bg-gray-100 p-4 rounded-2xl mb-6 font-black text-center text-lg outline-none border-2 focus:border-emerald-600">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fecharModal('modal-saida')" class="bg-gray-200 p-4 rounded-2xl font-black uppercase text-[10px]">Voltar</button>
                <button onclick="confirmarSaidaFinal()" class="bg-emerald-600 text-white p-4 rounded-2xl font-black uppercase text-[10px] shadow-lg">Lançar & Dar Saída</button>
            </div>
        </div>
    </div>

    <div id="modal-transacao">
        <div class="bg-white p-8 rounded-[40px] w-full max-w-sm m-4">
            <h3 class="font-black text-black uppercase italic mb-4 text-center text-xl">Nova Transação</h3>
            <select id="trans-tipo" class="w-full p-4 bg-gray-100 rounded-2xl font-black mb-3 border-2 outline-none">
                <option value="RECEITA">RECEITA (ENTRADA)</option>
                <option value="DESPESA">DESPESA (SAÍDA)</option>
            </select>
            <input type="text" id="trans-descricao" placeholder="DESCRIÇÃO" class="w-full p-4 bg-gray-100 rounded-2xl font-bold uppercase mb-3 border-2 outline-none">
            <input type="number" id="trans-valor" step="0.01" placeholder="VALOR (R$)" class="w-full p-4 bg-gray-100 rounded-2xl font-black mb-6 border-2 outline-none text-center">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fecharModal('modal-transacao')" class="bg-gray-200 p-4 rounded-2xl font-black uppercase text-[10px]">Cancelar</button>
                <button onclick="salvarTransacaoManual()" class="bg-black text-white p-4 rounded-2xl font-black uppercase text-[10px]">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="modal-estoque">
        <div class="bg-white p-8 rounded-[40px] w-full max-w-sm m-4">
            <h3 class="font-black text-black uppercase italic mb-4 text-center text-xl">Novo Item no Estoque</h3>
            
            <div class="flex items-center gap-3 mb-3">
                <label class="flex-1 flex items-center justify-center border-2 border-dashed border-red-200 p-3 rounded-2xl text-red-600 bg-red-50 cursor-pointer font-black text-xs uppercase">
                    📸 Tirar/Escolher Foto
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarFotoEstoque(this)">
                </label>
                <img id="previa-foto-estoque" class="w-12 h-12 rounded-xl object-cover border hidden">
            </div>

            <input type="text" id="est-codigo" placeholder="CÓDIGO / REF" class="w-full p-3 bg-gray-100 rounded-2xl font-bold uppercase mb-2 border-2 outline-none text-xs">
            <input type="text" id="est-nome" placeholder="NOME DA PEÇA" class="w-full p-3 bg-gray-100 rounded-2xl font-bold uppercase mb-2 border-2 outline-none text-xs">
            <input type="number" id="est-qtd" placeholder="QUANTIDADE" class="w-full p-3 bg-gray-100 rounded-2xl font-bold uppercase mb-2 border-2 outline-none text-xs">
            <input type="number" id="est-custo" step="0.01" placeholder="PREÇO DE CUSTO (R$)" class="w-full p-3 bg-gray-100 rounded-2xl font-bold uppercase mb-2 border-2 outline-none text-xs">
            <input type="number" id="est-venda" step="0.01" placeholder="PREÇO DE VENDA (R$)" class="w-full p-3 bg-gray-100 rounded-2xl font-bold uppercase mb-4 border-2 outline-none text-xs">
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fecharModal('modal-estoque')" class="bg-gray-200 p-4 rounded-2xl font-black uppercase text-[10px]">Cancelar</button>
                <button onclick="salvarItemEstoque()" class="bg-red-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Salvar Peça</button>
            </div>
        </div>
    </div>

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-24 z-50 rounded-t-[40px] shadow-2xl">
        <button onclick="mudarAba('entrada', 'CONTROLE DE PÁTIO')" class="nav-button active flex flex-col items-center flex-1"><span>➕</span><span class="text-[9px] font-black mt-1 uppercase">Entrada</span></button>
        <button onclick="mudarAba('patio', 'VEÍCULOS NO PÁTIO')" class="nav-button flex flex-col items-center flex-1"><span>🚗</span><span class="text-[9px] font-black mt-1 uppercase">Pátio</span></button>
        <button onclick="mudarAba('financeiro', 'FINANCEIRO')" class="nav-button flex flex-col items-center flex-1"><span>💰</span><span class="text-[9px] font-black mt-1 uppercase">Financeiro</span></button>
        <button onclick="mudarAba('estoque', 'ESTOQUE DE PEÇAS')" class="nav-button flex flex-col items-center flex-1"><span>📦</span><span class="text-[9px] font-black mt-1 uppercase">Estoque</span></button>
        <button onclick="mudarAba('relatorio', 'HISTÓRICO DE SERVIÇOS')" class="nav-button flex flex-col items-center flex-1"><span>📋</span><span class="text-[9px] font-black mt-1 uppercase">Histórico</span></button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
