<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>PÁTIO PRO v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ef4444; }
        body { background-color: #050505; color: #f4f4f5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .page-transition { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        input, select, textarea { background: #111 !important; border: 1px solid #222 !important; color: white !important; outline: none; }
        .menu-card { background: linear-gradient(145deg, #111, #080808); border: 1px solid #222; transition: all 0.2s; }
        .menu-card:active { transform: scale(0.95); background: #1a1a1a; }
        .btn-voltar { font-size: 10px; font-weight: 900; color: #555; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-40 bg-[#050505]/90 backdrop-blur-lg border-b border-white/5 flex justify-between items-center">
        <div id="header-voltar" class="hidden">
            <button onclick="irParaMenu()" class="btn-voltar flex items-center gap-2">
                <span class="text-lg">←</span> VOLTAR
            </button>
        </div>
        <div id="header-logo">
            <h1 class="text-xl font-black tracking-tighter italic uppercase leading-none">PÁTIO<span class="text-red-500">PRO</span></h1>
        </div>
        <div id="contador" class="bg-red-600/10 border border-red-500/20 text-red-500 text-[10px] font-black px-4 py-2 rounded-full">0 VEÍCULOS</div>
    </header>

    <main class="p-5 max-w-lg mx-auto">
        
        <section id="aba-menu" class="page-transition space-y-6 pt-4">
            <div class="glass p-8 rounded-[2.5rem] text-center mb-8 border-b-4 border-red-600">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.3em] mb-2">Bem-vindo ao Painel</p>
                <h2 class="text-3xl font-black italic uppercase leading-none">CONTROLE DE<br><span class="text-red-500">FLUXO</span></h2>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="trocarAba('entrada')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center">
                    <span class="text-3xl mb-3">➕</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Nova Entrada</span>
                </button>
                <button onclick="trocarAba('patio')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center">
                    <span class="text-3xl mb-3">🚛</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Ver Pátio</span>
                </button>
                <button onclick="trocarAba('historico')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center">
                    <span class="text-3xl mb-3">📜</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Relatórios</span>
                </button>
                <button onclick="alert('Funcionalidade em breve!')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center opacity-40">
                    <span class="text-3xl mb-3">⚙️</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Ajustes</span>
                </button>
            </div>
        </section>

        <section id="aba-patio" class="hidden page-transition space-y-4">
            <div class="mb-4">
                <input id="buscaPlaca" type="text" onkeyup="renderizar()" placeholder="PESQUISAR PLACA..." class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
            </div>
            <div id="lista-patio" class="space-y-4"></div>
        </section>

        <section id="aba-entrada" class="hidden page-transition">
            <div class="glass p-6 rounded-[2rem] space-y-6">
                <h2 id="titulo-form" class="text-lg font-black uppercase italic text-center text-red-500">Cadastro de Veículo</h2>
                <div class="space-y-4">
                    <input id="placa" type="text" placeholder="PLACA" class="w-full p-4 rounded-2xl font-black text-xl text-red-500 uppercase">
                    <input id="modelo" type="text" placeholder="MODELO DO VEÍCULO" class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
                    <input id="nomeCliente" type="text" placeholder="NOME DO CLIENTE" class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
                    <input id="dataEntrada" type="date" class="w-full p-4 rounded-2xl text-xs font-bold">
                </div>

                <div class="pt-2 relative">
                    <input id="fotoInput" type="file" accept="image/*" class="hidden">
                    
                    <button id="btn-remover-foto" onclick="removerFoto()" class="hidden absolute top-4 right-4 z-20 bg-red-600 text-white p-2 rounded-full text-[8px] font-black shadow-lg uppercase">Remover ✕</button>

                    <label id="label-foto" for="fotoInput" class="flex flex-col items-center justify-center p-10 border-2 border-dashed border-zinc-800 rounded-3xl bg-black/40 relative">
                        <div id="loading-foto" class="hidden absolute inset-0 bg-black/90 flex items-center justify-center rounded-3xl z-10"><span class="text-red-500 font-black text-[10px] animate-pulse">PROCESSANDO...</span></div>
                        <span class="text-4xl mb-2">📸</span>
                        <span class="text-[9px] font-black uppercase text-zinc-500">Foto (Câmera ou Galeria)</span>
                    </label>
                    <canvas id="canvasPreview" class="hidden mt-4 mx-auto border border-white/5 rounded-2xl shadow-2xl"></canvas>
                </div>

                <button id="btn-salvar" onclick="salvarRegistro()" class="w-full bg-red-600 text-white font-black py-5 rounded-2xl uppercase text-xs tracking-widest shadow-xl active:scale-95 transition-all">Confirmar Registro</button>
            </div>
        </section>

        <section id="aba-historico" class="hidden page-transition space-y-3">
            <h2 class="text-xs font-black text-zinc-500 uppercase tracking-widest mb-4">Arquivos de Saída</h2>
            <div id="lista-historico" class="space-y-3"></div>
        </section>
    </main>

    <div id="modal-saida" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-[60]">
        <div class="glass p-8 rounded-[3rem] w-full max-w-sm">
            <h3 class="font-black text-xl mb-6 text-center italic text-red-500 uppercase">Finalizar Serviço</h3>
            <textarea id="servicoRealizado" class="w-full p-5 rounded-2xl h-40 text-sm font-medium mb-6 uppercase border-white/10" placeholder="DESCREVA O SERVIÇO..."></textarea>
            <div class="flex flex-col gap-3">
                <button onclick="confirmarSaida()" class="w-full bg-red-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg">Concluir Agora</button>
                <button onclick="fecharModal()" class="w-full text-zinc-500 font-bold text-[10px] uppercase p-2">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('controle_patio_db')) || [];
        let fotoFinal = "";
        let idSelecionado = null;
        let modoEdicao = false;
        let idEdicao = null;

        // SELEÇÃO E COMPRESSÃO DE IMAGEM
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading-foto').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvasPreview');
                    const ctx = canvas.getContext('2d');
                    let max = 800, w = img.width, h = img.height;
                    if (w > h) { if (w > max) { h *= max / w; w = max; } }
                    else { if (h > max) { w *= max / h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    fotoFinal = canvas.toDataURL('image/jpeg', 0.5);
                    
                    document.getElementById('loading-foto').classList.add('hidden');
                    canvas.classList.remove('hidden');
                    document.getElementById('label-foto').classList.add('hidden');
                    document.getElementById('btn-remover-foto').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function removerFoto() {
            fotoFinal = "";
            document.getElementById('fotoInput').value = "";
            document.getElementById('canvasPreview').classList.add('hidden');
            document.getElementById('label-foto').classList.remove('hidden');
            document.getElementById('btn-remover-foto').classList.add('hidden');
        }

        function salvarRegistro() {
            const placa = document.getElementById('placa').value.toUpperCase();
            if(!placa || !fotoFinal) return alert("Erro: Preencha Placa e Foto!");

            const dados = {
                id: modoEdicao ? idEdicao : Date.now(),
                cliente: document.getElementById('nomeCliente').value,
                modelo: document.getElementById('modelo').value,
                placa: placa,
                dataEntrada: document.getElementById('dataEntrada').value,
                foto: fotoFinal,
                status: modoEdicao ? db.find(x => x.id === idEdicao).status : 'Diagnóstico',
                ativo: true
            };

            if(modoEdicao) {
                const idx = db.findIndex(x => x.id === idEdicao);
                db[idx] = dados;
            } else {
                db.push(dados);
            }

            localStorage.setItem('controle_patio_db', JSON.stringify(db));
            location.reload();
        }

        function irParaMenu() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('aba-menu').classList.remove('hidden');
            document.getElementById('header-voltar').classList.add('hidden');
            document.getElementById('header-logo').classList.remove('hidden');
            modoEdicao = false;
        }

        function trocarAba(aba) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('aba-' + aba).classList.remove('hidden');
            document.getElementById('header-voltar').classList.remove('hidden');
            document.getElementById('header-logo').classList.add('hidden');
            renderizar();
        }

        function renderizar() {
            const busca = document.getElementById('buscaPlaca').value.toUpperCase();
            const containerPatio = document.getElementById('lista-patio');
            const containerHist = document.getElementById('lista-historico');
            containerPatio.innerHTML = ""; containerHist.innerHTML = "";
            let contador = 0;

            db.slice().reverse().forEach(v => {
                if (busca !== "" && !v.placa.includes(busca)) return;

                if(v.ativo) {
                    contador++;
                    containerPatio.innerHTML += `
                        <div class="glass rounded-[2rem] overflow-hidden page-transition border-l-4 border-red-600">
                            <div class="flex p-4 gap-4">
                                <img src="${v.foto}" class="w-20 h-20 object-cover rounded-2xl">
                                <div class="flex-1">
                                    <div class="flex justify-between">
                                        <h3 class="text-xl font-black italic text-white uppercase">${v.placa}</h3>
                                        <div class="flex gap-3">
                                            <button onclick="prepararEdicao(${v.id})" class="text-zinc-500">✏️</button>
                                            <button onclick="excluirRegistro(${v.id})" class="text-zinc-500">🗑️</button>
                                        </div>
                                    </div>
                                    <p class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mb-2">${v.modelo || 'VEÍCULO'}</p>
                                    <select onchange="atualizarStatus(${v.id}, this.value)" class="w-full bg-black border border-white/5 rounded-lg p-2 text-[9px] font-black text-red-500 uppercase">
                                        <option value="Diagnóstico" ${v.status=='Diagnóstico'?'selected':''}>Diagnóstico</option>
                                        <option value="Desmontagem" ${v.status=='Desmontagem'?'selected':''}>Desmontagem</option>
                                        <option value="Montagem" ${v.status=='Montagem'?'selected':''}>Montagem</option>
                                        <option value="Finalizado" ${v.status=='Finalizado'?'selected':''}>Finalizado</option>
                                    </select>
                                </div>
                            </div>
                            <button onclick="abrirSaida(${v.id})" class="w-full bg-white/5 text-zinc-500 py-3 text-[9px] font-black uppercase tracking-widest">Registrar Saída</button>
                        </div>
                    `;
                } else {
                    containerHist.innerHTML += `
                        <div class="glass p-5 rounded-2xl flex justify-between items-center opacity-60">
                            <div><p class="font-black text-white italic text-sm uppercase">${v.placa}</p><p class="text-[8px] text-zinc-500 font-bold">SAÍDA: ${v.dataSaida}</p></div>
                            <button onclick="excluirRegistro(${v.id})" class="text-lg">🗑️</button>
                        </div>
                    `;
                }
            });
            document.getElementById('contador').innerText = `${contador} VEÍCULOS`;
        }

        function prepararEdicao(id) {
            const v = db.find(x => x.id === id);
            modoEdicao = true; idEdicao = id;
            document.getElementById('titulo-form').innerText = "Editar Veículo";
            document.getElementById('placa').value = v.placa;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('nomeCliente').value = v.cliente;
            document.getElementById('dataEntrada').value = v.dataEntrada;
            fotoFinal = v.foto;
            
            const canvas = document.getElementById('canvasPreview');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = () => { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); canvas.classList.remove('hidden'); };
            img.src = v.foto;
            
            document.getElementById('label-foto').classList.add('hidden');
            document.getElementById('btn-remover-foto').classList.remove('hidden');
            trocarAba('entrada');
        }

        function excluirRegistro(id) {
            if(confirm("Apagar registro permanentemente?")) {
                db = db.filter(x => x.id !== id);
                localStorage.setItem('controle_patio_db', JSON.stringify(db));
                renderizar();
            }
        }

        function atualizarStatus(id, s) { const i = db.findIndex(x => x.id === id); db[i].status = s; localStorage.setItem('controle_patio_db', JSON.stringify(db)); }
        function abrirSaida(id) { idSelecionado = id; document.getElementById('modal-saida').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-saida').classList.add('hidden'); }
        function confirmarSaida() {
            const i = db.findIndex(x => x.id === idSelecionado);
            db[i].ativo = false;
            db[i].dataSaida = new Date().toLocaleDateString('pt-BR');
            db[i].servico = document.getElementById('servicoRealizado').value;
            localStorage.setItem('controle_patio_db', JSON.stringify(db));
            location.reload();
        }

        document.getElementById('dataEntrada').value = new Date().toISOString().split('T')[0];
        irParaMenu();
        renderizar();
    </script>
</body>
</html>
