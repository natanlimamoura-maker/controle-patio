<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/741/741407.png">
    <title>PÁTIO PRO v26.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: #111; border: 1px solid #222; border-radius: 25px; }
        input, textarea, select { background: #18181b !important; border: 1px solid #333 !important; color: #fff !important; border-radius: 15px; padding: 18px; font-size: 16px; width: 100%; }
        
        .btn-menu-full { width: 100%; height: 140px; background: #111; border: 1px solid #222; border-radius: 30px; display: flex; align-items: center; padding: 0 25px; gap: 20px; margin-bottom: 12px; }
        .icon-huge { font-size: 60px; } 
        .btn-menu-full p { font-size: 18px; font-weight: 900; text-transform: uppercase; color: #fff; }
        .btn-menu-full small { font-size: 10px; color: #666; font-weight: 800; text-transform: uppercase; display: block; }

        .btn-acao { background: #e11d48; color: white; font-weight: 900; padding: 20px; border-radius: 20px; width: 100%; text-transform: uppercase; }
        .btn-wpp { background: #25D366; color: white; font-weight: 900; padding: 20px; border-radius: 20px; width: 100%; text-transform: uppercase; }
        
        #preview-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .thumb-img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; border: 2px solid #e11d48; flex-shrink: 0; }

        .hidden { display: none !important; }
        label { font-size: 10px; font-weight: 900; color: #e11d48; text-transform: uppercase; display: block; margin-bottom: 5px; }
    </style>
</head>
<body class="pb-10">

    <div id="lock-screen" class="fixed inset-0 bg-black z-[100] flex items-center justify-center p-6 hidden">
        <div class="glass p-8 w-full max-w-sm text-center space-y-6">
            <h2 class="text-2xl font-black italic">PÁTIO<span class="text-rose-600">PRO</span></h2>
            <p class="text-rose-500 text-xs font-bold uppercase tracking-widest">Licença Expirada (30 dias)</p>
            <input type="password" id="pass-input" placeholder="SENHA" class="text-center">
            <button onclick="checkPass()" class="btn-acao">Ativar</button>
            <p id="lock-msg" class="text-rose-500 text-[10px] font-bold mt-2"></p>
        </div>
    </div>

    <header class="p-6 border-b border-white/5 flex justify-between items-center">
        <h1 onclick="tab('menu')" class="text-2xl font-black italic cursor-pointer">
            <span id="display-nome-app">PÁTIO</span><span class="text-rose-600">PRO</span>
        </h1>
        <button onclick="tab('ajustes')" class="text-xl">⚙️</button>
    </header>

    <main class="p-4 max-w-xl mx-auto">

        <section id="menu">
            <button onclick="openForm()" class="btn-menu-full">
                <span class="icon-huge">📥</span>
                <div><p>Nova Entrada</p><small>Registrar veículo</small></div>
            </button>
            <button onclick="tab('patio')" class="btn-menu-full">
                <span class="icon-huge">🏎️</span>
                <div><p>Pátio</p><small id="c-patio">0 veículos</small></div>
            </button>
            <button onclick="tab('orcamento')" class="btn-menu-full">
                <span class="icon-huge">📋</span>
                <div><p>Orçamentos</p><small>WhatsApp / PDF</small></div>
            </button>
            <button onclick="tab('historico')" class="btn-menu-full">
                <span class="icon-huge">📖</span>
                <div><p>Histórico</p><small>Serviços feitos</small></div>
            </button>
        </section>

        <section id="entrada" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black text-xs text-zinc-500 uppercase">Ficha de Entrada</h2>
                <div><label>Data de Entrada</label><input type="date" id="data-entrada"></div>
                <input id="placa" placeholder="PLACA" class="text-center text-4xl font-black text-rose-600 uppercase">
                <input id="cliente" placeholder="NOME DO CLIENTE">
                <input id="modelo" placeholder="VEÍCULO">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('in-cam').click()" class="bg-zinc-800 p-4 rounded-xl font-bold text-[10px]">📸 CÂMERA</button>
                    <button onclick="document.getElementById('in-gal').click()" class="bg-zinc-800 p-4 rounded-xl font-bold text-[10px]">🖼️ GALERIA</button>
                </div>
                <input type="file" id="in-cam" capture="camera" accept="image/*" class="hidden" multiple onchange="handleFiles(this.files)">
                <input type="file" id="in-gal" accept="image/*" class="hidden" multiple onchange="handleFiles(this.files)">
                <div id="preview-area" class="hidden"><div id="preview-container"></div></div>
                <button onclick="saveEntry()" class="btn-acao">Salvar Entrada</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4">Voltar</button>
            </div>
        </section>

        <section id="patio" class="hidden space-y-4">
            <div id="render-patio" class="space-y-4"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-6">Voltar</button>
        </section>

        <section id="orcamento" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black text-xs text-rose-600 uppercase">Orçamento</h2>
                <input id="orc-cliente" placeholder="Cliente">
                <input id="orc-fone" placeholder="WhatsApp">
                <input id="orc-veiculo" placeholder="Veículo">
                <div id="orc-itens" class="space-y-2">
                    <div class="flex gap-2"><input class="flex-1 n-i" placeholder="Item"><input class="w-24 v-i" type="number" placeholder="R$" oninput="calcTotal()"></div>
                </div>
                <button onclick="addRow()" class="text-xs font-black">+ ADICIONAR ITEM</button>
                <div class="text-right text-2xl font-black text-emerald-500" id="orc-total">R$ 0,00</div>
                <button onclick="alert('Enviando...')" class="btn-wpp">Enviar WhatsApp</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4">Voltar</button>
            </div>
        </section>

        <section id="saida-form" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <input id="saida-id" type="hidden">
                <div><label>Data de Saída</label><input type="date" id="data-saida"></div>
                <input id="saida-valor" type="number" placeholder="VALOR TOTAL (R$)">
                <textarea id="saida-relatorio" placeholder="O QUE FOI FEITO?" rows="4"></textarea>
                <button onclick="confirmCheckOut()" class="btn-acao">Finalizar Saída</button>
                <button onclick="tab('patio')" class="w-full text-zinc-600 font-black text-xs uppercase py-4">Cancelar</button>
            </div>
        </section>

        <section id="historico" class="hidden space-y-3">
            <div id="render-hist" class="space-y-2"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-4">Voltar</button>
        </section>

        <section id="ajustes" class="hidden space-y-4">
            <div class="glass p-8 space-y-6">
                <div>
                    <label>Nome do App</label>
                    <div class="flex gap-2 mt-2">
                        <input id="cfg-nome" placeholder="NOME">
                        <button onclick="updateName()" class="bg-rose-600 px-4 rounded-xl font-bold text-xs">OK</button>
                    </div>
                </div>

                <div class="text-left border-t border-white/5 pt-4">
                    <label>Licença</label>
                    <p id="lic-status" class="text-xs font-bold text-emerald-500 mt-1"></p>
                </div>

                <div class="border-t border-white/5 pt-4 space-y-3">
                    <label>Backup</label>
                    <button onclick="exportData()" class="w-full bg-zinc-900 p-4 rounded-xl font-bold text-[10px]">EXPORTAR DADOS</button>
                    <button onclick="document.getElementById('in-import').click()" class="w-full bg-zinc-900 p-4 rounded-xl font-bold text-[10px]">IMPORTAR DADOS</button>
                    <input type="file" id="in-import" class="hidden" accept=".json" onchange="importData(this)">
                </div>

                <button onclick="localStorage.clear(); location.reload();" class="text-rose-600 font-black text-[10px] block w-full">ZERAR TODOS OS DADOS</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4">Voltar</button>
            </div>
        </section>

    </main>

    <script>
        const DB_KEY = 'patiopro_v26';
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentPhotos = [];

        // --- LÓGICA DE LICENÇA ---
        function checkLicense() {
            let expiry = localStorage.getItem('patiopro_expiry');
            const now = new Date().getTime();
            if (!expiry) {
                expiry = now + (30 * 24 * 60 * 60 * 1000);
                localStorage.setItem('patiopro_expiry', expiry);
            }
            if (now > expiry) {
                document.getElementById('lock-screen').classList.remove('hidden');
            } else {
                const days = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
                document.getElementById('lic-status').innerText = "ATIVO: " + days + " DIAS RESTANTES";
            }
        }

        function checkPass() {
            if (document.getElementById('pass-input').value === 'meuapp') {
                localStorage.setItem('patiopro_expiry', new Date().getTime() + (30 * 24 * 60 * 60 * 1000));
                location.reload();
            } else {
                document.getElementById('lock-msg').innerText = "SENHA INCORRETA";
            }
        }

        // --- NOME E BACKUP ---
        function updateName() {
            const n = document.getElementById('cfg-nome').value.toUpperCase();
            if(n) { localStorage.setItem('patiopro_name', n); loadConfigs(); }
        }

        function loadConfigs() {
            const n = localStorage.getItem('patiopro_name') || 'PÁTIO';
            document.getElementById('display-nome-app').innerText = n;
            document.getElementById('cfg-nome').value = n;
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup.json`;
            a.click();
        }

        function importData(input) {
            const reader = new FileReader();
            reader.onload = function() {
                data = JSON.parse(reader.result);
                save(); render(); alert("Restaurado!");
            };
            reader.readAsText(input.files[0]);
        }

        // --- FUNÇÕES ORIGINAIS ---
        function tab(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            render();
        }

        function openForm() {
            tab('entrada');
            document.getElementById('data-entrada').value = new Date().toISOString().split('T')[0];
            document.getElementById('placa').value = "";
            document.getElementById('preview-container').innerHTML = "";
            currentPhotos = [];
        }

        async function handleFiles(files) {
            document.getElementById('preview-area').classList.remove('hidden');
            for (let file of files) {
                const b64 = await toBase64(file);
                currentPhotos.push(b64);
                const img = document.createElement('img');
                img.src = b64; img.className = "thumb-img";
                document.getElementById('preview-container').appendChild(img);
            }
        }

        const toBase64 = f => new Promise(res => { const rd = new FileReader(); rd.readAsDataURL(f); rd.onload = () => res(rd.result); });

        function saveEntry() {
            const p = document.getElementById('placa').value.toUpperCase();
            const dE = document.getElementById('data-entrada').value.split('-').reverse().join('/');
            if(!p) return alert("Placa vazia!");
            data.push({ id: Date.now(), placa: p, cliente: document.getElementById('cliente').value, modelo: document.getElementById('modelo').value, entrada: dE, fotos: currentPhotos, ativo: true });
            save(); tab('menu');
        }

        function render() {
            const lp = document.getElementById('render-patio'); const lh = document.getElementById('render-hist');
            let a = 0; lp.innerHTML = ""; lh.innerHTML = "";
            data.slice().reverse().forEach(v => {
                if(v.ativo) {
                    a++; lp.innerHTML += `<div class="glass p-6 mb-4"><div class="flex justify-between"><h3>${v.placa}</h3><span class="text-[10px]">${v.entrada}</span></div><p class="text-xs text-zinc-500">${v.cliente}</p><button onclick="startCheckOut(${v.id})" class="btn-acao mt-4">Dar Saída</button><button onclick="deleteItem(${v.id})" class="text-[10px] mt-2 block w-full text-center text-zinc-600">Excluir</button></div>`;
                } else {
                    lh.innerHTML += `<div class="glass p-4 mb-2"><div class="flex justify-between font-black"><span>${v.placa}</span><span class="text-emerald-500">R$ ${v.valor}</span></div><p class="text-[10px] text-zinc-500 italic">${v.relatorio}</p></div>`;
                }
            });
            document.getElementById('c-patio').innerText = a + " veículos";
        }

        function startCheckOut(id) {
            tab('saida-form');
            document.getElementById('saida-id').value = id;
            document.getElementById('data-saida').value = new Date().toISOString().split('T')[0];
        }

        function confirmCheckOut() {
            const id = document.getElementById('saida-id').value;
            const v = data.find(x => x.id == id);
            v.valor = document.getElementById('saida-valor').value;
            v.relatorio = document.getElementById('saida-relatorio').value;
            v.saida = document.getElementById('data-saida').value.split('-').reverse().join('/');
            v.ativo = false;
            save(); tab('menu');
        }

        function deleteItem(id) { if(confirm("Excluir?")) { data = data.filter(x => x.id != id); save(); render(); } }
        function save() { localStorage.setItem(DB_KEY, JSON.stringify(data)); }
        function addRow() { const d = document.createElement('div'); d.className="flex gap-2 mt-2"; d.innerHTML=`<input class="flex-1 n-i" placeholder="Item"><input class="w-24 v-i" type="number" placeholder="R$" oninput="calcTotal()">`; document.getElementById('orc-itens').appendChild(d); }
        function calcTotal() { let t = 0; document.querySelectorAll('.v-i').forEach(i => t += parseFloat(i.value || 0)); document.getElementById('orc-total').innerText = "R$ " + t.toFixed(2); }

        checkLicense();
        loadConfigs();
        render();
    </script>
</body>
</html>
