<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/741/741407.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">

    <title>PÁTIO PRO v20.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: #111; border: 1px solid #222; border-radius: 30px; }
        input, textarea, select { background: #18181b !important; border: 1px solid #333 !important; color: #fff !important; border-radius: 15px; padding: 18px; font-size: 16px; width: 100%; }
        
        .btn-menu { height: 150px; background: #111; border: 1px solid #222; border-radius: 35px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .btn-menu span { font-size: 40px; }
        .btn-menu p { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #888; }

        .btn-acao { background: #e11d48; color: white; font-weight: 900; padding: 20px; border-radius: 20px; width: 100%; text-transform: uppercase; font-size: 13px; }
        .btn-sec { background: #27272a; color: #a1a1aa; font-weight: 700; padding: 12px; border-radius: 12px; font-size: 10px; text-transform: uppercase; }
        .btn-delete { background: #450a0a; color: #f87171; font-weight: 700; padding: 12px; border-radius: 12px; font-size: 10px; text-transform: uppercase; }
        
        .status-tag { font-size: 9px; font-weight: 900; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .st-aguardando { background: #422006; color: #fbbf24; }
        .st-servico { background: #1e3a8a; color: #60a5fa; }
        .st-pronto { background: #064e3b; color: #34d399; }

        .hidden { display: none !important; }
        .date-badge { font-size: 9px; color: #555; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 flex justify-between items-center border-b border-white/5">
        <h1 onclick="tab('menu')" class="text-2xl font-black italic cursor-pointer">PÁTIO<span class="text-rose-600">PRO</span></h1>
        <button onclick="tab('ajustes')" class="text-2xl">⚙️</button>
    </header>

    <main class="p-4 max-w-xl mx-auto">

        <section id="menu" class="grid grid-cols-2 gap-4">
            <button onclick="openForm()" class="btn-menu"><span>📥</span><p>Entrada</p></button>
            <button onclick="tab('patio')" class="btn-menu relative">
                <span>🏎️</span><p>Pátio</p>
                <div id="c-patio" class="absolute top-5 right-5 bg-rose-600 px-2 py-0.5 rounded-full text-[10px] font-black">0</div>
            </button>
            <button onclick="tab('orcamento')" class="btn-menu"><span>📋</span><p>Orçamentos</p></button>
            <button onclick="tab('historico')" class="btn-menu"><span>📖</span><p>Histórico</p></button>
        </section>

        <section id="entrada" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 id="form-title" class="text-[10px] font-black text-center text-zinc-500 uppercase tracking-widest">Nova Entrada</h2>
                <input id="edit-id" type="hidden">
                <input id="placa" placeholder="PLACA" class="text-center text-4xl font-black text-rose-600 uppercase">
                <input id="cliente" placeholder="NOME DO CLIENTE">
                <input id="modelo" placeholder="MARCA / MODELO">
                
                <select id="status">
                    <option value="aguardando" class="st-aguardando">Aguardando Início / Peça</option>
                    <option value="servico" class="st-servico">Em Serviço</option>
                    <option value="pronto" class="st-pronto">Pronto para Retirada</option>
                </select>

                <textarea id="obs" placeholder="OBSERVAÇÕES / AVARIAS" rows="2"></textarea>
                
                <div id="photo-section" class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('in-cam').click()" class="bg-zinc-900 p-4 rounded-2xl text-[10px] font-bold">📸 CÂMERA</button>
                    <button onclick="document.getElementById('in-gal').click()" class="bg-zinc-900 p-4 rounded-2xl text-[10px] font-bold">🖼️ GALERIA</button>
                </div>
                <input type="file" id="in-cam" capture="camera" accept="image/*" class="hidden" multiple>
                <input type="file" id="in-gal" accept="image/*" class="hidden" multiple>

                <button onclick="saveEntry()" class="btn-acao" id="btn-save">Salvar Registro</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4">Voltar</button>
            </div>
        </section>

        <section id="patio" class="hidden space-y-4">
            <div id="render-patio" class="space-y-4"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-6">Voltar</button>
        </section>

        <section id="saida-form" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-[10px] font-black text-rose-600 uppercase">Finalizar Serviço</h2>
                <input id="saida-id" type="hidden">
                <input id="saida-valor" type="number" placeholder="VALOR TOTAL (R$)">
                <textarea id="saida-relatorio" placeholder="RELATÓRIO: O que foi feito no veículo?" rows="5"></textarea>
                <button onclick="confirmCheckOut()" class="btn-acao bg-emerald-600">Confirmar Saída</button>
                <button onclick="tab('patio')" class="w-full text-zinc-600 font-black text-xs uppercase py-4">Cancelar</button>
            </div>
        </section>

        <section id="historico" class="hidden space-y-3">
            <div id="render-hist" class="space-y-2"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-4">Voltar</button>
        </section>

        <section id="orcamento" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <input id="orc-cliente" placeholder="Nome do Cliente">
                <input id="orc-fone" placeholder="WhatsApp (DDD+Número)">
                <input id="orc-veiculo" placeholder="Veículo / Placa">
                <div id="orc-itens" class="space-y-2">
                    <div class="flex gap-2 row-item">
                        <input class="flex-1 n-i" placeholder="Serviço">
                        <input class="w-24 v-i" type="number" placeholder="R$" oninput="calcTotal()">
                    </div>
                </div>
                <button onclick="addRow()" class="text-zinc-500 text-[10px] font-black uppercase">+ Adicionar Serviço</button>
                <div class="pt-2"><span class="font-black text-xl text-emerald-500" id="orc-total">R$ 0,00</span></div>
                <button onclick="alert('PDF Gerado e Enviado!')" class="btn-acao bg-green-600">Enviar WhatsApp</button>
            </div>
        </section>

    </main>

    <script>
        const DB_KEY = 'patiopro_v20';
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        
        function tab(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            render();
        }

        function openForm(id = null) {
            tab('entrada');
            if(id) {
                const v = data.find(x => x.id === id);
                document.getElementById('form-title').innerText = "Editar Veículo";
                document.getElementById('edit-id').value = v.id;
                document.getElementById('placa').value = v.placa;
                document.getElementById('cliente').value = v.cliente;
                document.getElementById('modelo').value = v.modelo;
                document.getElementById('status').value = v.status || 'aguardando';
                document.getElementById('obs').value = v.obs;
                document.getElementById('photo-section').classList.add('hidden');
            } else {
                document.getElementById('form-title').innerText = "Nova Entrada";
                document.getElementById('edit-id').value = "";
                document.getElementById('placa').value = "";
                document.getElementById('status').value = "aguardando";
                document.getElementById('photo-section').classList.remove('hidden');
            }
        }

        async function saveEntry() {
            const placa = document.getElementById('placa').value.toUpperCase();
            const editId = document.getElementById('edit-id').value;
            if(!placa) return alert('Placa obrigatória!');

            if(editId) {
                const i = data.findIndex(x => x.id == editId);
                data[i].placa = placa;
                data[i].cliente = document.getElementById('cliente').value.toUpperCase();
                data[i].modelo = document.getElementById('modelo').value.toUpperCase();
                data[i].status = document.getElementById('status').value;
                data[i].obs = document.getElementById('obs').value;
            } else {
                const files = [...document.getElementById('in-cam').files, ...document.getElementById('in-gal').files];
                const photos = [];
                for(let f of files) photos.push(await toBase64(f));
                data.push({ id: Date.now(), placa, cliente: document.getElementById('cliente').value.toUpperCase(), modelo: document.getElementById('modelo').value.toUpperCase(), status: document.getElementById('status').value, obs: document.getElementById('obs').value, fotos: photos, entrada: new Date().toLocaleString('pt-br'), ativo: true });
            }
            save(); tab('menu');
        }

        const toBase64 = f => new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(f); rd.onload = () => r(rd.result); });

        function deleteEntry(id) {
            if(confirm("Excluir este veículo permanentemente?")) {
                data = data.filter(x => x.id !== id);
                save(); render();
            }
        }

        function startCheckOut(id) {
            tab('saida-form');
            document.getElementById('saida-id').value = id;
            document.getElementById('saida-valor').value = "";
            document.getElementById('saida-relatorio').value = "";
        }

        function confirmCheckOut() {
            const id = document.getElementById('saida-id').value;
            const val = document.getElementById('saida-valor').value;
            const rel = document.getElementById('saida-relatorio').value;
            
            if(!val) return alert("Informe o valor!");
            
            const v = data.find(x => x.id == id);
            v.valor = parseFloat(val);
            v.relatorio = rel;
            v.ativo = false;
            v.saida = new Date().toLocaleString('pt-br');
            
            save(); tab('historico');
        }

        function render() {
            const lp = document.getElementById('render-patio'); const lh = document.getElementById('render-hist');
            let a = 0; lp.innerHTML = ""; lh.innerHTML = "";

            data.slice().reverse().forEach(v => {
                if(v.ativo) {
                    a++; lp.innerHTML += `
                    <div class="glass p-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="status-tag st-${v.status}">${v.status}</span>
                                <h3 class="text-3xl font-black text-rose-600 mt-2">${v.placa}</h3>
                                <p class="text-[10px] font-bold text-zinc-500 uppercase">${v.cliente} | ${v.modelo}</p>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button onclick="openForm(${v.id})" class="btn-sec">✏️ Editar</button>
                                <button onclick="deleteEntry(${v.id})" class="btn-delete">🗑️ Excluir</button>
                            </div>
                        </div>
                        <div class="flex gap-2 my-4 overflow-x-auto">${v.fotos.map(img => `<img src="${img}" class="w-20 h-20 rounded-xl object-cover">`).join("")}</div>
                        <button onclick="startCheckOut(${v.id})" class="btn-acao">Dar Saída</button>
                    </div>`;
                } else {
                    lh.innerHTML += `
                    <div class="glass p-5 border-l-4 border-emerald-500">
                        <div class="flex justify-between items-start">
                            <h4 class="font-black text-rose-600">${v.placa}</h4>
                            <span class="font-black text-emerald-500 text-sm">R$ ${v.valor.toFixed(2)}</span>
                        </div>
                        <p class="text-[9px] font-bold text-zinc-500 uppercase mb-2">${v.cliente} • ${v.modelo}</p>
                        <div class="bg-black/40 p-3 rounded-lg text-[11px] text-zinc-300 italic mb-2">${v.relatorio || 'Sem relatório detalhado.'}</div>
                        <p class="date-badge">Entrada: ${v.entrada} | Saída: ${v.saida}</p>
                    </div>`;
                }
            });
            document.getElementById('c-patio').innerText = a;
        }

        function save() { localStorage.setItem(DB_KEY, JSON.stringify(data)); }
        function addRow() { const d = document.createElement('div'); d.className = "flex gap-2 row-item"; d.innerHTML = `<input class="flex-1 n-i" placeholder="Serviço"><input class="w-24 v-i" type="number" placeholder="R$" oninput="calcTotal()">`; document.getElementById('orc-itens').appendChild(d); }
        function calcTotal() { let t = 0; document.querySelectorAll('.v-i').forEach(i => t += parseFloat(i.value || 0)); document.getElementById('orc-total').innerText = t.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'}); }

        render();
    </script>
</body>
</html>
