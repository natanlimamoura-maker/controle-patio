<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">

    <title>Controle de Pátio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-red: #dc2626;
            --dark-bg: #000000;
        }
        body { 
            background-color: var(--dark-bg); 
            color: #ffffff; 
            -webkit-tap-highlight-color: transparent; 
        }
        .card-atraso { border-left: 6px solid var(--primary-red); }
        .hidden { display: none; }
        input, select, textarea { 
            background-color: #1a1a1a !important; 
            color: white !important; 
            border: 1px solid #333 !important; 
            appearance: none;
        }
        input:focus { border-color: var(--primary-red) !important; }
        .tab-active { color: var(--primary-red); border-top: 2px solid var(--primary-red); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-page { animation: fadeIn 0.3s ease-in; }
    </style>
</head>
<body class="font-sans pb-24 select-none">

    <header class="bg-black p-4 sticky top-0 z-50 flex justify-between items-center border-b border-red-900/50">
        <div class="flex items-center gap-2">
            <span class="text-red-600 text-2xl font-bold italic">PRO</span>
            <h1 class="text-lg font-black tracking-tighter uppercase">Controle de Pátio</h1>
        </div>
        <div id="contador" class="bg-red-600 text-[10px] font-black px-3 py-1 rounded shadow-lg">0 VEÍCULOS</div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <section id="aba-patio" class="animate-page">
            <h2 class="text-gray-500 font-bold text-[10px] uppercase tracking-[0.2em] mb-4">Veículos no Pátio</h2>
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-entrada" class="hidden animate-page">
            <h2 class="text-gray-500 font-bold text-[10px] uppercase tracking-[0.2em] mb-4">Nova Entrada</h2>
            <div class="bg-[#0a0a0a] p-5 rounded-xl border border-red-900/30 space-y-4">
                <input id="nomeCliente" type="text" placeholder="NOME DO CLIENTE" class="w-full p-4 rounded-lg outline-none uppercase font-bold text-sm">
                <input id="modelo" type="text" placeholder="MODELO DO CAMINHÃO" class="w-full p-4 rounded-lg outline-none uppercase font-bold text-sm">
                <input id="placa" type="text" placeholder="PLACA" class="w-full p-4 rounded-lg outline-none uppercase font-mono font-bold text-sm">
                
                <div class="space-y-1">
                    <label class="text-[9px] text-gray-500 font-bold ml-1">DATA DE ENTRADA</label>
                    <input id="dataEntrada" type="date" class="w-full p-4 rounded-lg outline-none font-bold text-sm uppercase">
                </div>
                
                <div class="bg-black border-2 border-dashed border-red-900/50 p-6 rounded-lg text-center">
                    <input id="fotoInput" type="file" accept="image/*" class="hidden">
                    <label for="fotoInput" class="cursor-pointer">
                        <div class="text-3xl mb-2">📸</div>
                        <div class="text-red-500 font-black text-xs uppercase">Foto do Veículo</div>
                        <div class="text-gray-600 text-[9px] mt-1">Câmera ou Galeria</div>
                    </label>
                    <canvas id="canvasPreview" class="hidden w-full rounded mt-4 border border-red-900/50"></canvas>
                </div>
                
                <button onclick="salvarEntrada()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-5 rounded-lg shadow-lg active:scale-95 transition-all uppercase tracking-widest text-sm">
                    Confirmar Entrada
                </button>
            </div>
        </section>

        <section id="aba-historico" class="hidden animate-page">
            <h2 class="text-gray-500 font-bold text-[10px] uppercase tracking-[0.2em] mb-4">Histórico de Saídas</h2>
            <div id="lista-historico" class="space-y-2"></div>
        </section>
    </main>

    <div id="modal-saida" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[60]">
        <div class="bg-[#111] p-6 rounded-xl w-full max-w-sm border border-red-600/30">
            <h3 class="font-black text-xl mb-4 text-red-600 uppercase italic">Dar Saída</h3>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[9px] text-gray-500 font-bold ml-1">DATA DE SAÍDA</label>
                    <input id="dataSaida" type="date" class="w-full p-4 rounded-lg outline-none text-sm font-bold uppercase">
                </div>
                
                <select id="statusFinal" class="w-full p-4 rounded-lg outline-none text-sm font-bold uppercase">
                    <option value="Diagnóstico">Diagnóstico</option>
                    <option value="Desmontagem">Desmontagem</option>
                    <option value="Montagem">Montagem</option>
                    <option value="Finalizado">Finalizado</option>
                </select>

                <textarea id="servicoRealizado" placeholder="SERVIÇO REALIZADO..." class="w-full p-4 rounded-lg h-28 outline-none resize-none text-sm font-bold uppercase"></textarea>

                <div class="flex gap-2">
                    <button onclick="confirmarSaida()" class="flex-1 bg-red-600 text-white p-4 rounded-lg font-black text-xs uppercase tracking-tighter">Finalizar</button>
                    <button onclick="fecharModal()" class="flex-1 bg-zinc-800 text-gray-400 p-4 rounded-lg font-bold text-xs uppercase">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-black border-t border-red-900/50 flex justify-around p-3 shadow-2xl z-50">
        <button onclick="trocarAba('patio')" id="btn-patio" class="flex flex-col items-center tab-active">
            <span class="text-xl">🚛</span><span class="text-[9px] font-black mt-1 uppercase">Pátio</span>
        </button>
        <button onclick="trocarAba('entrada')" id="btn-entrada" class="flex flex-col items-center text-zinc-600">
            <span class="text-xl">➕</span><span class="text-[9px] font-black mt-1 uppercase">Entrada</span>
        </button>
        <button onclick="trocarAba('historico')" id="btn-historico" class="flex flex-col items-center text-zinc-600">
            <span class="text-xl">📜</span><span class="text-[9px] font-black mt-1 uppercase">Histórico</span>
        </button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('controle_patio_db')) || [];
        let idSelecionado = null;
        let fotoFinal = "";

        // Processamento de Foto
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvasPreview');
                    const ctx = canvas.getContext('2d');
                    const maxW = 500;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    fotoFinal = canvas.toDataURL('image/jpeg', 0.6);
                    canvas.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Formatação de data simples (Brasil)
        function formatarData(dataStr) {
            if(!dataStr) return "";
            const [ano, mes, dia] = dataStr.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function salvarEntrada() {
            const placa = document.getElementById('placa').value.toUpperCase();
            const dataE = document.getElementById('dataEntrada').value;
            if(!placa || !dataE) return alert("Preencha Placa e Data!");

            db.push({
                id: Date.now(),
                cliente: document.getElementById('nomeCliente').value,
                modelo: document.getElementById('modelo').value,
                placa,
                dataEntrada: dataE,
                foto: fotoFinal,
                status: 'Diagnóstico',
                ativo: true
            });
            localStorage.setItem('controle_patio_db', JSON.stringify(db));
            location.reload(); 
        }

        function renderizar() {
            const listaPatio = document.getElementById('lista-veiculos');
            const listaHist = document.getElementById('lista-historico');
            listaPatio.innerHTML = ""; listaHist.innerHTML = "";
            let count = 0;

            db.forEach(v => {
                if(v.ativo) {
                    count++;
                    // Cálculo de dias
                    const dEntrada = new Date(v.dataEntrada);
                    const dHoje = new Date();
                    dHoje.setHours(0,0,0,0);
                    const dias = Math.floor((dHoje - dEntrada) / (1000 * 3600 * 24));
                    
                    listaPatio.innerHTML += `
                        <div class="bg-[#0a0a0a] p-4 rounded-lg border border-zinc-900 shadow-xl ${dias >= 3 ? 'card-atraso' : ''} animate-page">
                            <div class="flex gap-4">
                                <img src="${v.foto || 'https://via.placeholder.com/150/111/444?text=FOTO'}" class="w-20 h-20 object-cover rounded shadow-lg border border-zinc-800">
                                <div class="flex-1">
                                    <h3 class="font-black text-red-600 text-lg italic tracking-tighter">${v.placa}</h3>
                                    <p class="text-[10px] font-bold text-zinc-300 uppercase">${v.modelo}</p>
                                    <p class="text-[9px] text-zinc-500 uppercase">${v.cliente || 'CLIENTE NÃO INFORMADO'}</p>
                                    <div class="mt-2 flex items-center gap-2">
                                        <span class="bg-red-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded uppercase">${v.status}</span>
                                        ${dias >= 3 ? '<span class="text-red-500 text-[8px] font-bold uppercase tracking-widest animate-pulse">⚠️ ALERTA '+dias+' DIAS</span>' : ''}
                                    </div>
                                </div>
                            </div>
                            <button onclick="abrirSaida(${v.id})" class="w-full mt-3 bg-zinc-900 hover:bg-red-600 text-white py-2 rounded font-black text-[10px] uppercase transition-all border border-zinc-800">Finalizar Serviço</button>
                        </div>
                    `;
                } else {
                    listaHist.innerHTML += `
                        <div class="bg-black p-3 rounded border border-zinc-900 flex justify-between items-center text-[10px] text-zinc-500">
                            <div><span class="font-bold text-zinc-300 uppercase">${v.placa}</span> | SAIU: ${formatarData(v.dataSaida)}</div>
                            <div class="text-red-600 font-black uppercase text-[8px]">${v.status}</div>
                        </div>
                    `;
                }
            });
            document.getElementById('contador').innerText = `${count} VEÍCULOS`;
        }

        function abrirSaida(id) { 
            idSelecionado = id; 
            document.getElementById('dataSaida').value = new Date().toISOString().split('T')[0]; 
            document.getElementById('modal-saida').classList.remove('hidden'); 
        }

        function fecharModal() { document.getElementById('modal-saida').classList.add('hidden'); }

        function confirmarSaida() {
            const idx = db.findIndex(v => v.id === idSelecionado);
            db[idx].ativo = false;
            db[idx].dataSaida = document.getElementById('dataSaida').value;
            db[idx].status = document.getElementById('statusFinal').value;
            db[idx].servico = document.getElementById('servicoRealizado').value;
            localStorage.setItem('controle_patio_db', JSON.stringify(db));
            fecharModal(); 
            renderizar();
        }

        function trocarAba(aba) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('aba-' + aba).classList.remove('hidden');
            document.getElementById('btn-' + aba).classList.add('tab-active');
            if(aba === 'historico') renderizar();
        }
        
        // Define data de hoje como padrão na entrada
        document.getElementById('dataEntrada').value = new Date().toISOString().split('T')[0];
        renderizar();
    </script>
</body>
</html>
