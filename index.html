<section id="aba-orcamento" class="hidden space-y-4">
    <button onclick="irParaMenu()" class="text-zinc-500 text-[10px] font-black uppercase">← Voltar</button>
    <div class="glass p-6 rounded-[2.5rem] space-y-3">
        <h3 class="text-center font-black text-blue-500 uppercase italic mb-2">Novo Orçamento</h3>
        <input id="orc-cliente" type="text" placeholder="NOME DO CLIENTE" class="w-full p-3 rounded-xl text-xs font-bold uppercase">
        <input id="orc-telefone" type="tel" placeholder="TELEFONE (DDD + NÚMERO)" class="w-full p-3 rounded-xl text-xs font-bold">
        <input id="orc-cnpj" type="text" placeholder="CNPJ / CPF" class="w-full p-3 rounded-xl text-xs font-bold uppercase">
        <hr class="border-zinc-800 my-2">
        <textarea id="orc-servico" placeholder="DESCRIÇÃO DO SERVIÇO" class="w-full p-3 rounded-xl text-xs font-bold uppercase h-24"></textarea>
        <input id="orc-valor" type="number" placeholder="VALOR TOTAL (R$)" class="w-full p-3 rounded-xl text-xl font-black text-green-500">
        
        <div class="grid grid-cols-1 gap-3">
            <button onclick="gerarECompartilharPDF()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl uppercase text-[10px] flex items-center justify-center gap-2 shadow-lg shadow-green-600/20">
                <span>ENVIAR VIA WHATSAPP</span>
                <span class="text-lg">📲</span>
            </button>
            <button onclick="gerarPDF(true)" class="w-full bg-zinc-800 text-white font-black py-3 rounded-xl uppercase text-[9px]">Apenas Baixar PDF</button>
        </div>
    </div>
</section>

<script>
    // --- FUNÇÃO PDF E COMPARTILHAMENTO ---
    async function gerarECompartilharPDF() {
        const doc = criarDocumentoPDF();
        if(!doc) return;

        const pdfBlob = doc.output('blob');
        const cliente = document.getElementById('orc-cliente').value.toUpperCase();
        const arquivo = new File([pdfBlob], `Orcamento_${cliente}.pdf`, { type: 'application/pdf' });

        // Tenta usar a API de compartilhamento do celular
        if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
            try {
                await navigator.share({
                    files: [arquivo],
                    title: 'Orçamento ' + config.nomeOficina,
                    text: `Olá, segue o orçamento de ${cliente} referente aos serviços em nosso pátio.`
                });
            } catch (err) {
                if(err.name !== "AbortError") alert("Erro ao compartilhar. Tente baixar o arquivo.");
            }
        } else {
            // Caso o navegador não suporte compartilhamento de arquivos (ex: PCs antigos)
            doc.save(`Orcamento_${cliente}.pdf`);
            alert("Seu navegador não suporta compartilhamento direto. O arquivo foi baixado, anexe-o manualmente ao WhatsApp.");
        }
    }

    function criarDocumentoPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const cliente = document.getElementById('orc-cliente').value.toUpperCase();
        const tel = document.getElementById('orc-telefone').value;
        const cnpj = document.getElementById('orc-cnpj').value.toUpperCase();
        const servico = document.getElementById('orc-servico').value.toUpperCase();
        const valor = document.getElementById('orc-valor').value;

        if(!cliente || !valor) {
            alert("Preencha ao menos Nome e Valor!");
            return null;
        }

        // --- Layout do PDF ---
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.text(config.nomeOficina, 105, 20, { align: "center" });
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text("ORÇAMENTO DE PRESTAÇÃO DE SERVIÇOS", 105, 28, { align: "center" });
        doc.line(20, 32, 190, 32);

        doc.setFont("helvetica", "bold");
        doc.text("DADOS DO CLIENTE", 20, 45);
        doc.setFont("helvetica", "normal");
        doc.text(`CLIENTE: ${cliente}`, 20, 52);
        doc.text(`TELEFONE: ${tel}`, 20, 59);
        doc.text(`CNPJ/CPF: ${cnpj}`, 20, 66);

        doc.line(20, 75, 190, 75);
        doc.setFont("helvetica", "bold");
        doc.text("DESCRIÇÃO DOS SERVIÇOS", 20, 85);
        doc.setFont("helvetica", "normal");
        
        const splitServico = doc.splitTextToSize(servico, 160);
        doc.text(splitServico, 20, 92);

        const yFinal = 92 + (splitServico.length * 7);
        doc.line(20, yFinal, 190, yFinal);
        doc.setFontSize(16);
        doc.setFont("helvetica", "bold");
        doc.text(`VALOR TOTAL: R$ ${parseFloat(valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`, 20, yFinal + 15);

        doc.setFontSize(8);
        doc.text(`Gerado em: ${new Date().toLocaleString()}`, 20, 280);
        doc.text("DESENVOLVIDO POR UPCODE", 105, 285, { align: "center" });

        return doc;
    }

    // Função auxiliar para apenas baixar
    function gerarPDF(apenasBaixar = false) {
        const doc = criarDocumentoPDF();
        if(doc) doc.save(`Orcamento_${document.getElementById('orc-cliente').value}.pdf`);
    }
</script>
