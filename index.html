<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PÁTIO PRO v7.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .menu-card { background: linear-gradient(145deg, #111, #080808); border: 1px solid #1a1a1a; transition: all 0.2s; }
        .menu-card:active { transform: scale(0.95); }
        input, textarea { background: #0a0a0a !important; border: 1px solid #222 !important; color: white !important; outline: none; }
        input:focus { border-color: #dc2626 !important; }
        .upcode-footer { position: fixed; bottom: 10px; left: 0; width: 100%; text-align: center; font-size: 8px; font-weight: 900; color: rgba(255,255,255,0.05); text-transform: uppercase; letter-spacing: 4px; pointer-events: none; }
    </style>
</head>
<body class="pb-10">

    <div class="upcode-footer">Desenvolvido por UpCode</div>

    <header class="p-6 sticky top-0 z-50 bg-[#050505]/90 backdrop-blur-md border-b border-white/5 flex justify-between items-center">
        <h1 onclick="irParaMenu()" class="text-xl font-black italic uppercase tracking-tighter cursor-pointer">PÁTIO<span class="text-red-600">PRO</span></h1>
        <div id="contador" class="bg-red-600/20 border border-red-600/30 text-red-500 text-[10px] font-black px-4 py-2 rounded-full italic">0 VEÍCULOS</div>
    </header>

    <main class="p-5 max-w-lg mx-auto">
        
        <section id="aba-menu" class="space-y-6 pt-4">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="trocarAba('entrada')" class="menu-card p-8 rounded-[2.5rem] flex flex-col items-center">
                    <span class="text-4xl mb-3">➕</span>
                    <span class="text-[10px] font-black uppercase text-zinc-400">Entrada</span>
                </button>
                <button onclick="trocarAba('patio')" class="menu-card p-8 rounded-[2.5rem] flex flex-col items-center border-b-2 border-red-600">
                    <span class="text-4xl mb-3">🚛</span>
                    <span class="text-[10px] font-black uppercase text-zinc-400">Pátio</span>
                </button>
                <button onclick="trocarAba('orcamento')" class="menu-card p-8 rounded-[2.5rem] flex flex-col items-center">
                    <span class="text-4xl mb-3">📄</span>
                    <span class="text-[10px] font-black uppercase text-zinc-400">Orçamento</span>
                </button>
                <button onclick="trocarAba('balanco')" class="menu-card p-8 rounded-[2.5rem] flex flex-col items-center bg-green-900/10 border-green-600/20">
                    <span class="text-4xl mb-3">💰</span>
                    <span class="text-[10px] font-black uppercase text-green-500">Balanço</span>
                </button>
            </div>
        </section>

        <section id="aba-balanco" class="hidden space-y-6">
            <button onclick="irParaMenu()" class="text-zinc-500 text-[10px] font-black uppercase">← Voltar</button>
            <div class="glass p-8 rounded-[2.5rem] text-center border-t-4 border-green-600">
                <p class="text-[10px] font-black text-zinc-500 uppercase mb-2">Faturamento Mensal</p>
                <h2 id="total-mensal" class="text-4xl font-black text-white italic">R$ 0,00</h2>
                <p id="mes-atual" class="text-[10px] text-green-500 font-bold mt-2 uppercase"></p>
            </div>
            <div id="lista-faturamento" class="space-y-3">
                </div>
        </section>

        <section id="aba-orcamento" class="hidden space-y-4">
            <button onclick="irParaMenu()" class="text-zinc-500 text-[10px] font-black uppercase">← Voltar</button>
            <div class="glass p-6 rounded-[2.5rem] space-y-3">
                <input id="orc-cliente" type="text" placeholder="CLIENTE" class="w-full p-4 rounded-xl text-xs font-bold uppercase">
                <input id="orc-valor" type="number" placeholder="VALOR R$" class="w-full p-4 rounded-xl text-xl font-black text-green-500">
                <textarea id="orc-servico" placeholder="SERVIÇOS" class="w-full p-4 rounded-xl text-xs font-bold uppercase h-24"></textarea>
                <button onclick="gerarOrcamento()" class="w-full bg-red-600 py-5 rounded-2xl font-black text-[10px] uppercase">Gerar e Salvar</button>
            </div>
        </section>

        <section id="aba-entrada" class="hidden space-y-6">
            <button onclick="irParaMenu()" class="text-zinc-500 text-[10px] font-black uppercase">← Voltar</button>
            <div class="glass p-6 rounded-[2.5rem] space-y-4">
                <input id="placa" type="text" placeholder="PLACA" class="w-full p-4 rounded-2xl font-black text-2xl text-red-600 text-center uppercase">
                <input id="cliente" type="text" placeholder="NOME CLIENTE" class="w-full p-4 rounded-xl text-xs font-bold uppercase">
                <input id="fotoInput" type="file" accept="image/*" capture="camera" class="hidden">
                <label for="fotoInput" class="flex flex-col items-center justify-center p-10 border-2 border-dashed border-zinc-800 rounded-3xl bg-zinc-900/40 cursor-pointer">
                    <span class="text-4xl">📸</span>
                </label>
                <button onclick="salvarEntrada()" class="w-full bg-red-600 py-5 rounded-2xl font-black text-[10px] uppercase">Registrar Entrada</button>
            </div>
        </section>

        <section id="aba-patio" class="hidden space-y-4">
            <button onclick="irParaMenu()" class="text-zinc-500 text-[10px] font-black uppercase">← Voltar</button>
            <div id="lista-patio" class="space-y-4"></div>
        </section>

        <section id="aba-ajustes" class="hidden space-y-6">
            <button onclick="irParaMenu()" class="text-zinc-500 text-[10px] font-black uppercase">← Voltar</button>
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <button onclick="baixarBackup()" class="w-full bg-white/10 py-4 rounded-xl text-[10px] font-black uppercase italic">Exportar Backup Completo (.JSON)</button>
            </div>
        </section>

    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('patio_pro_v74')) || [];
        let config = { nomeOficina: "PÁTIO PRO" };

        function init() {
            atualizarContador();
            renderizarPatio();
            renderizarBalanco();
        }

        function atualizarContador() {
            const ativos = db.filter(v => v.ativo).length;
            document.getElementById('contador').innerText = `${ativos} VEÍCULOS`;
        }

        // --- GESTÃO FINANCEIRA ---
        function registrarNoFinanceiro(cliente, valor, tipo) {
            db.push({
                id: Date.now(),
                cliente: cliente,
                valor: parseFloat(valor),
                data: new Date().toISOString(),
                tipo: tipo, // 'orcamento' ou 'saida'
                ativo: false
            });
            localStorage.setItem('patio_pro_v74', JSON.stringify(db));
        }

        function renderizarBalanco() {
            const lista = document.getElementById('lista-faturamento');
            const displayTotal = document.getElementById('total-mensal');
            const dataAtual = new Date();
            const mesCorrente = dataAtual.getMonth();
            const anoCorrente = dataAtual.getFullYear();
            
            document.getElementById('mes-atual').innerText = dataAtual.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });

            let total = 0;
            lista.innerHTML = "";

            // Filtra registros que tenham valor e sejam do mês atual
            const lancamentos = db.filter(item => {
                const dataItem = new Date(item.data);
                return item.valor > 0 && dataItem.getMonth() === mesCorrente && dataItem.getFullYear() === anoCorrente;
            });

            lancamentos.reverse().forEach(item => {
                total += item.valor;
                lista.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center border-l-4 border-green-600">
                        <div>
                            <p class="text-[10px] font-black uppercase text-white">${item.cliente}</p>
                            <p class="text-[8px] text-zinc-500 uppercase">${new Date(item.data).toLocaleDateString()}</p>
                        </div>
                        <p class="text-sm font-black text-green-500">R$ ${item.valor.toFixed(2)}</p>
                    </div>
                `;
            });

            displayTotal.innerText = `R$ ${total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }

        // --- ORÇAMENTO ---
        function gerarOrcamento() {
            const cliente = document.getElementById('orc-cliente').value;
            const valor = document.getElementById('orc-valor').value;
            if(!cliente || !valor) return alert("Preencha Nome e Valor");

            registrarNoFinanceiro(cliente.toUpperCase(), valor, 'orcamento');
            alert("Orçamento salvo no Balanço!");
            location.reload();
        }

        // --- ENTRADA E SAÍDA ---
        function salvarEntrada() {
            const placa = document.getElementById('placa').value.toUpperCase();
            if(!placa) return alert("Placa obrigatória");
            db.push({
                id: Date.now(),
                placa: placa,
                cliente: document.getElementById('cliente').value.toUpperCase(),
                data: new Date().toISOString(),
                ativo: true,
                valor: 0
            });
            localStorage.setItem('patio_pro_v74', JSON.stringify(db));
            location.reload();
        }

        function darSaida(id) {
            const valor = prompt("Valor final do serviço (R$):", "0.00");
            if (valor === null) return;

            const i = db.findIndex(x => x.id === id);
            db[i].ativo = false;
            db[i].valor = parseFloat(valor);
            db[i].dataSaida = new Date().toISOString();
            
            localStorage.setItem('patio_pro_v74', JSON.stringify(db));
            location.reload();
        }

        function renderizarPatio() {
            const p = document.getElementById('lista-patio');
            p.innerHTML = "";
            db.filter(v => v.ativo).reverse().forEach(v => {
                p.innerHTML += `
                <div class="glass p-4 rounded-3xl flex justify-between items-center border border-white/5">
                    <div>
                        <h3 class="text-xl font-black italic uppercase">${v.placa}</h3>
                        <p class="text-[9px] text-red-500 font-black uppercase">${v.cliente || 'AVULSO'}</p>
                    </div>
                    <button onclick="darSaida(${v.id})" class="bg-red-600 px-6 py-2 rounded-xl text-[10px] font-black italic">SAÍDA</button>
                </div>`;
            });
        }

        // --- SISTEMA ---
        function baixarBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "patio_pro_full_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function trocarAba(aba) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('aba-' + aba).classList.remove('hidden');
            if(aba === 'balanco') renderizarBalanco();
            window.scrollTo(0,0);
        }

        function irParaMenu() { trocarAba('menu'); }

        init();
    </script>
</body>
</html>
