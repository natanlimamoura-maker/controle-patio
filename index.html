<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="manifest.json">
    
    <title>Pátio Pro Elite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo para parecer App nativo */
        body { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-2xl">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black italic tracking-tighter">PÁTIO PRO</h1>
            <span id="contador" class="bg-blue-900 px-3 py-1 rounded-full text-[10px] font-bold uppercase">0 No Pátio</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        
        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-gray-700">Registrar Entrada</h2>
                <form id="form-entrada" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-black text-xl uppercase">
                    <input type="text" id="modelo" placeholder="MODELO" required class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold">
                    <input type="text" id="cliente" placeholder="NOME DO CLIENTE" required class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold">
                    
                    <label class="flex flex-col items-center justify-center border-2 border-dashed border-blue-200 p-4 rounded-2xl text-blue-600 cursor-pointer bg-blue-50 active:bg-blue-100">
                        <span id="label-foto" class="font-bold text-sm">📸 Tirar Foto</span>
                        <input type="file" id="foto" accept="image/*" capture="environment" class="hidden" onchange="document.getElementById('label-foto').innerText = '✅ Foto Pronta'">
                    </label>
                    
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-black p-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase">Confirmar</button>
                    <button type="button" id="btn-cancelar" onclick="cancelarEdicao()" class="hidden w-full bg-gray-200 text-gray-500 font-bold p-3 rounded-2xl mt-2">CANCELAR</button>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-relatorio" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-gray-700">HISTÓRICO</h2>
                <button onclick="limparHistorico()" class="text-[10px] text-red-500 font-bold uppercase">Limpar</button>
            </div>
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-20 safe-area-bottom z-50">
        <button onclick="mudarAba('entrada')" id="btn-nav-entrada" class="nav-button active flex flex-col items-center p-2 flex-1">
            <span class="text-xl">➕</span><span class="text-[10px] font-bold uppercase">Entrada</span>
        </button>
        <button onclick="mudarAba('patio')" id="btn-nav-patio" class="nav-button flex flex-col items-center p-2 flex-1">
            <span class="text-xl">🚗</span><span class="text-[10px] font-bold uppercase">Pátio</span>
        </button>
        <button onclick="mudarAba('relatorio')" id="btn-nav-relatorio" class="nav-button flex flex-col items-center p-2 flex-1">
            <span class="text-xl">📋</span><span class="text-[10px] font-bold uppercase">Relatório</span>
        </button>
    </nav>

    <script>
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];

        function mudarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            document.getElementById('btn-nav-' + aba).classList.add('active');
            if(aba === 'relatorio') renderizarRelatorio();
        }

        const otimizarFoto = (file) => {
            return new Promise((res) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 400; canvas.height = img.height * (400 / img.width);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    }
                }
            });
        };

        document.getElementById('form-entrada').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const fotoFile = document.getElementById('foto').files[0];
            let fotoBase64 = id ? patio.find(v => v.id == id).foto : null;
            if(fotoFile) fotoBase64 = await otimizarFoto(fotoFile);

            const dados = {
                id: id ? Number(id) : Date.now(),
                placa: document.getElementById('placa').value.toUpperCase(),
                modelo: document.getElementById('modelo').value,
                cliente: document.getElementById('cliente').value,
                foto: fotoBase64,
                entrada: id ? patio.find(v => v.id == id).entrada : new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
            };

            if(id) {
                const i = patio.findIndex(v => v.id == id);
                patio[i] = dados;
            } else {
                patio.unshift(dados);
            }

            localStorage.setItem('patio_data', JSON.stringify(patio));
            cancelarEdicao();
            renderizarPátio();
            mudarAba('patio');
        });

        function renderizarPátio() {
            const container = document.getElementById('lista-veiculos');
            container.innerHTML = '';
            document.getElementById('contador').innerText = patio.length + " NO PÁTIO";
            patio.forEach(v => {
                container.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex gap-4 items-center">
                    <img src="${v.foto || ''}" class="w-20 h-20 rounded-2xl object-cover bg-gray-50">
                    <div class="flex-1">
                        <div class="font-black text-xl tracking-tight">${v.placa}</div>
                        <div class="text-xs text-blue-600 font-bold uppercase">${v.cliente}</div>
                        <div class="flex gap-2 mt-2">
                            <button onclick="editarVeiculo(${v.id})" class="text-[10px] font-bold bg-gray-100 px-3 py-1 rounded-lg">EDITAR</button>
                            <button onclick="darSaida(${v.id})" class="text-[10px] font-bold bg-green-600 text-white px-3 py-1 rounded-lg">SAÍDA</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function renderizarRelatorio() {
            const container = document.getElementById('lista-relatorio');
            container.innerHTML = '';
            historico.forEach(v => {
                container.innerHTML += `
                <div class="bg-white p-3 rounded-2xl border border-gray-100 flex gap-3 items-center opacity-80">
                    <img src="${v.foto || ''}" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between font-bold text-sm uppercase"><span>${v.placa}</span><span class="text-gray-400 text-[10px]">${v.saida}</span></div>
                        <div class="text-[10px] text-gray-500">${v.cliente} • ${v.modelo}</div>
                    </div>
                </div>`;
            });
        }

        window.darSaida = (id) => {
            if(confirm("Confirmar saída?")) {
                const v = patio.find(v => v.id === id);
                historico.unshift({...v, saida: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})});
                localStorage.setItem('patio_historico', JSON.stringify(historico));
                patio = patio.filter(v => v.id !== id);
                localStorage.setItem('patio_data', JSON.stringify(patio));
                renderizarPátio();
            }
        };

        window.editarVeiculo = (id) => {
            const v = patio.find(v => v.id == id);
            document.getElementById('edit-id').value = v.id;
            document.getElementById('placa').value = v.placa;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('cliente').value = v.cliente;
            document.getElementById('btn-submit').innerText = "SALVAR ALTERAÇÕES";
            document.getElementById('btn-cancelar').classList.remove('hidden');
            mudarAba('entrada');
        };

        window.cancelarEdicao = () => {
            document.getElementById('form-entrada').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('btn-submit').innerText = "CONFIRMAR";
            document.getElementById('btn-cancelar').classList.add('hidden');
        };

        window.limparHistorico = () => { if(confirm("Limpar relatório?")) { historico = []; localStorage.setItem('patio_historico', JSON.stringify(historico)); renderizarRelatorio(); }};
        renderizarPátio();
    </script>
</body>
</html>
