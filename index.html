<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Pátio</title>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-red: #d32f2f;
      --hover-red: #b71c1c;
      --bg-black: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2b2b2b;
      --text-white: #ffffff;
      --text-gray: #b0b0b0;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary-red);
    }

    h1 { color: var(--primary-red); font-size: 22px; text-transform: uppercase; }
    h2 { color: var(--primary-red); font-size: 18px; margin-bottom: 12px; }

    /* NAVEGAÇÃO DE ABAS */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary-red);
      border-color: var(--primary-red);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* FORMULÁRIOS */
    .form-container {
      background-color: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-gray);
    }

    input[type="text"], input[type="number"], input[type="file"], input[type="date"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: var(--input-bg);
      color: var(--text-white);
      font-size: 14px;
    }

    textarea { resize: vertical; height: 70px; }

    .btn-action {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      width: 100%;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .btn-action:hover { background-color: var(--hover-red); }

    /* GRID DE CARDS */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .card-item:hover { border-color: var(--primary-red); }

    .card-item img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
      background-color: #000;
    }

    .card-item .titulo {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-item .sub { color: var(--text-gray); font-size: 12px; margin-bottom: 8px; }

    .card-actions {
      display: flex;
      gap: 5px;
    }

    .btn-card {
      flex: 1;
      padding: 5px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
    }

    .btn-edit { background: #1976d2; }
    .btn-delete { background: var(--primary-red); }

    /* MODAIS */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 2px solid var(--primary-red);
    }

    .modal-content img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: #000;
    }

    .report-list {
      text-align: left;
      margin-bottom: 15px;
      background: #121212;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }

    .report-item {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-white);
    }

    .report-item strong { color: var(--primary-red); }

    .btn-close {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Controle de Pátio</h1>
  </header>

  <div class="nav-tabs">
    <div class="tab-btn active" onclick="trocarAba('estoque')">Estoque de Peças</div>
    <div class="tab-btn" onclick="trocarAba('patio')">Pátio de Veículos</div>
  </div>

  <!-- ABA ESTOQUE DE PEÇAS (Tabela 'produtos') -->
  <div id="aba-estoque" class="tab-content active">
    <div class="form-container">
      <h2>Cadastrar Peça</h2>
      <div class="form-group">
        <label>Nome da Peça:</label>
        <input type="text" id="pecaNome" placeholder="Ex: Injetor Common Rail">
      </div>
      <div class="form-group">
        <label>Quantidade:</label>
        <input type="number" id="pecaQtd" min="0" placeholder="Ex: 5">
      </div>
      <div class="form-group">
        <label>Foto da Peça:</label>
        <input type="file" id="pecaFoto" accept="image/*">
      </div>
      <button class="btn-action" id="btnSalvarPeca" onclick="salvarPeca()">Salvar no Estoque</button>
    </div>

    <h2>Peças em Estoque</h2>
    <div id="gridPecas" class="grid-cards"></div>
  </div>

  <!-- ABA PÁTIO DE VEÍCULOS (Tabela 'patio') -->
  <div id="aba-patio" class="tab-content">
    <div class="form-container">
      <h2>Cadastrar Veículo</h2>
      <div class="form-group">
        <label>Modelo do Veículo:</label>
        <input type="text" id="veiculoModelo" placeholder="Ex: Scania R450 / Hilux">
      </div>
      <div class="form-group">
        <label>Placa:</label>
        <input type="text" id="veiculoPlaca" placeholder="Ex: ABC-1234">
      </div>
      <div class="form-group">
        <label>Data de Entrada:</label>
        <input type="date" id="veiculoData">
      </div>
      <div class="form-group">
        <label>Observações / Relatório:</label>
        <textarea id="veiculoObs" placeholder="Ex: Defeito na bomba de alta pressão..."></textarea>
      </div>
      <div class="form-group">
        <label>Foto do Veículo:</label>
        <input type="file" id="veiculoFoto" accept="image/*">
      </div>
      <button class="btn-action" id="btnSalvarVeiculo" onclick="salvarVeiculo()">Salvar Veículo</button>
    </div>

    <h2>Veículos no Pátio</h2>
    <div id="gridVeiculos" class="grid-cards"></div>
  </div>

  <!-- MODAL DE DETALHES -->
  <div id="modalDetalhes" class="modal-overlay">
    <div class="modal-content">
      <img id="modalImg" src="" alt="Imagem Expandida">
      <div id="modalReport" class="report-list"></div>
      <button class="btn-close" onclick="fecharModal()">FECHAR</button>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO DA PEÇA -->
  <div id="modalEditar" class="modal-overlay">
    <div class="modal-content">
      <h2>Editar Peça</h2>
      <input type="hidden" id="editPecaId">
      <input type="hidden" id="editPecaFotoUrl">
      <div class="form-group">
        <label>Nome:</label>
        <input type="text" id="editPecaNome">
      </div>
      <div class="form-group">
        <label>Quantidade:</label>
        <input type="number" id="editPecaQtd">
      </div>
      <div class="form-group">
        <label>Trocar Foto (Opcional):</label>
        <input type="file" id="editPecaFoto" accept="image/*">
      </div>
      <button class="btn-action" onclick="confirmarEdicaoPeca()">Atualizar Peça</button>
      <button class="btn-close" style="margin-top: 10px;" onclick="fecharModalEdit()">Cancelar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ywybppfkyekqlrndwhdn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_R08_JT0lLER2lnRE-v4xSw_4Dgl8BDU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let pecasData = [];
    let veiculosData = [];

    function trocarAba(aba) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(aba === 'estoque') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('aba-estoque').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('aba-patio').classList.add('active');
      }
    }

    async function uploadFoto(file, pasta) {
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;
      const filePath = `${pasta}/${fileName}`;

      const { error: uploadError } = await _supabase.storage
        .from('fotos-pecas')
        .upload(filePath, file);

      if (uploadError) throw uploadError;

      const { data } = _supabase.storage
        .from('fotos-pecas')
        .getPublicUrl(filePath);

      return data.publicUrl;
    }

    // --- CARREGAR ESTOQUE DA TABELA 'produtos' ---
    async function carregarPecas() {
      const { data, error } = await _supabase.from('produtos').select('*').order('id', { ascending: false });
      
      if (error) {
        console.error('Erro ao buscar produtos:', error);
        return;
      }

      pecasData = data || [];
      const grid = document.getElementById('gridPecas');
      grid.innerHTML = pecasData.length === 0 ? '<p style="color:#888;">Nenhuma peça cadastrada.</p>' : '';

      pecasData.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <img src="${p.foto_url || p.fotos || 'https://via.placeholder.com/150'}" onclick="verRelatorioPeca(${p.id})">
          <div class="titulo" onclick="verRelatorioPeca(${p.id})">${p.nome || p.descricao || 'Peça'}</div>
          <div class="sub" onclick="verRelatorioPeca(${p.id})">Qtd: ${p.quantidade || 0}</div>
          <div class="card-actions">
            <button class="btn-card btn-edit" onclick="abrirEditarPeca(${p.id})">EDITAR</button>
            <button class="btn-card btn-delete" onclick="excluirPeca(${p.id})">EXCLUIR</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function salvarPeca() {
      const nome = document.getElementById('pecaNome').value.trim();
      const quantidade = document.getElementById('pecaQtd').value;
      const file = document.getElementById('pecaFoto').files[0];

      if (!nome || !quantidade) {
        alert('Preencha o nome e a quantidade!');
        return;
      }

      const btn = document.getElementById('btnSalvarPeca');
      btn.innerText = 'SALVANDO...'; btn.disabled = true;

      try {
        let fotoUrl = null;
        if (file) {
          fotoUrl = await uploadFoto(file, 'pecas');
        }
        
        const { error } = await _supabase.from('produtos').insert([{ nome, quantidade, foto_url: fotoUrl }]);
        if (error) throw error;

        document.getElementById('pecaNome').value = '';
        document.getElementById('pecaQtd').value = '';
        document.getElementById('pecaFoto').value = '';
        await carregarPecas();
        alert('Peça salva no estoque!');
      } catch (err) {
        alert('Erro ao salvar peça: ' + err.message);
      } finally {
        btn.innerText = 'SALVAR NO ESTOQUE'; btn.disabled = false;
      }
    }

    function abrirEditarPeca(id) {
      const p = pecasData.find(item => item.id === id);
      if (!p) return;
      document.getElementById('editPecaId').value = p.id;
      document.getElementById('editPecaNome').value = p.nome || p.descricao || '';
      document.getElementById('editPecaQtd').value = p.quantidade || 0;
      document.getElementById('editPecaFotoUrl').value = p.foto_url || p.fotos || '';
      document.getElementById('modalEditar').style.display = 'flex';
    }

    async function confirmarEdicaoPeca() {
      const id = document.getElementById('editPecaId').value;
      const nome = document.getElementById('editPecaNome').value.trim();
      const quantidade = document.getElementById('editPecaQtd').value;
      let fotoUrl = document.getElementById('editPecaFotoUrl').value;
      const newFile = document.getElementById('editPecaFoto').files[0];

      try {
        if (newFile) {
          fotoUrl = await uploadFoto(newFile, 'pecas');
        }

        const { error } = await _supabase
          .from('produtos')
          .update({ nome, quantidade, foto_url: fotoUrl })
          .eq('id', id);

        if (error) throw error;

        fecharModalEdit();
        carregarPecas();
        alert('Peça atualizada com sucesso!');
      } catch (err) {
        alert('Erro ao atualizar: ' + err.message);
      }
    }

    async function excluirPeca(id) {
      if (!confirm('Deseja excluir esta peça?')) return;
      await _supabase.from('produtos').delete().eq('id', id);
      carregarPecas();
    }

    function verRelatorioPeca(id) {
      const p = pecasData.find(item => item.id === id);
      if (!p) return;
      document.getElementById('modalImg').src = p.foto_url || p.fotos || 'https://via.placeholder.com/150';
      document.getElementById('modalReport').innerHTML = `
        <div class="report-item"><strong>NOME DA PEÇA:</strong> ${p.nome || p.descricao}</div>
        <div class="report-item"><strong>QUANTIDADE EM ESTOQUE:</strong> ${p.quantidade || 0}</div>
        <div class="report-item"><strong>CÓDIGO SISTEMA:</strong> #${p.id}</div>
      `;
      document.getElementById('modalDetalhes').style.display = 'flex';
    }

    // --- CARREGAR PÁTIO DA TABELA 'patio' / 'historico' ---
    async function carregarVeiculos() {
      let { data, error } = await _supabase.from('patio').select('*').order('id', { ascending: false });
      
      // Se pátio estiver vazio, puxa os registros da tabela 'historico'
      if ((!data || data.length === 0) && !error) {
        const hist = await _supabase.from('historico').select('*').order('id', { ascending: false });
        data = hist.data;
      }

      if (error) {
        console.error('Erro ao buscar veículos:', error);
        return;
      }

      veiculosData = data || [];
      const grid = document.getElementById('gridVeiculos');
      grid.innerHTML = veiculosData.length === 0 ? '<p style="color:#888;">Nenhum veículo no pátio.</p>' : '';

      veiculosData.forEach(v => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <img src="${v.foto_url || v.fotos || 'https://via.placeholder.com/150'}" onclick="verRelatorioVeiculo(${v.id})">
          <div class="titulo" onclick="verRelatorioVeiculo(${v.id})">${v.modelo || v.servico || 'Veículo'}</div>
          <div class="sub" onclick="verRelatorioVeiculo(${v.id})">Placa: ${v.placa || 'N/I'}</div>
          <button class="btn-card btn-delete" style="width:100%" onclick="excluirVeiculo(${v.id})">REMOVER DO PÁTIO</button>
        `;
        grid.appendChild(card);
      });
    }

    async function salvarVeiculo() {
      const modelo = document.getElementById('veiculoModelo').value.trim();
      const placa = document.getElementById('veiculoPlaca').value.trim();
      const entrada = document.getElementById('veiculoData').value;
      const observacoes = document.getElementById('veiculoObs').value.trim();
      const file = document.getElementById('veiculoFoto').files[0];

      if (!modelo) {
        alert('Preencha o modelo do veículo!');
        return;
      }

      const btn = document.getElementById('btnSalvarVeiculo');
      btn.innerText = 'SALVANDO...'; btn.disabled = true;

      try {
        let fotoUrl = null;
        if (file) {
          fotoUrl = await uploadFoto(file, 'veiculos');
        }
        
        const { error } = await _supabase.from('patio').insert([{ modelo, placa, entrada, observacoes, foto_url: fotoUrl }]);
        if (error) throw error;

        document.getElementById('veiculoModelo').value = '';
        document.getElementById('veiculoPlaca').value = '';
        document.getElementById('veiculoData').value = '';
        document.getElementById('veiculoObs').value = '';
        document.getElementById('veiculoFoto').value = '';
        await carregarVeiculos();
        alert('Veículo cadastrado no pátio!');
      } catch (err) {
        alert('Erro ao salvar veículo: ' + err.message);
      } finally {
        btn.innerText = 'SALVAR VEÍCULO'; btn.disabled = false;
      }
    }

    function verRelatorioVeiculo(id) {
      const v = veiculosData.find(item => item.id === id);
      if (!v) return;
      document.getElementById('modalImg').src = v.foto_url || v.fotos || 'https://via.placeholder.com/150';
      document.getElementById('modalReport').innerHTML = `
        <div class="report-item"><strong>MODELO / SERVIÇO:</strong> ${v.modelo || v.servico || 'N/I'}</div>
        <div class="report-item"><strong>PLACA:</strong> ${v.placa || 'Não Informada'}</div>
        <div class="report-item"><strong>DATA DE ENTRADA:</strong> ${v.entrada || v.data || 'Não Registrada'}</div>
        <div class="report-item"><strong>OBSERVAÇÕES / DEFEITO:</strong> ${v.observacoes || 'Sem detalhes informados.'}</div>
      `;
      document.getElementById('modalDetalhes').style.display = 'flex';
    }

    async function excluirVeiculo(id) {
      if (!confirm('Deseja dar saída neste veículo?')) return;
      await _supabase.from('patio').delete().eq('id', id);
      await _supabase.from('historico').delete().eq('id', id);
      carregarVeiculos();
    }

    function fecharModal() { document.getElementById('modalDetalhes').style.display = 'none'; }
    function fecharModalEdit() { document.getElementById('modalEditar').style.display = 'none'; }

    // Carregar os 78 produtos e histórico no arranque
    carregarPecas();
    carregarVeiculos();
  </script>
</body>
</html>
