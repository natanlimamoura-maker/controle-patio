<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Cloud V3</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #pagina-detalhes { display: none; position: fixed; inset: 0; background: #f3f4f6; z-index: 9999; flex-direction: column; overflow-y: auto; }
        #modal-saida { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9998; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800">

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-2xl flex justify-between items-center">
        <div>
            <h1 id="app-nome-display" class="text-xl font-black italic uppercase">PÁTIO PRO</h1>
            <span id="status-drive" class="text-[9px] font-bold opacity-70 uppercase">Local</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        
        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-100">
                <form id="form-entrada" class="space-y-4">
                    <div class="flex justify-between items-center text-[10px] font-bold uppercase text-blue-600">
                        <span>Novo Registro</span>
                        <span id="proxima-os"></span>
                    </div>
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-black text-xl text-center uppercase outline-none">
                    <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                    <input type="text" id="cliente" placeholder="CLIENTE" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                    <div id="container-previa" class="hidden grid grid-cols-3 gap-2"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex flex-col items-center justify-center border-2 border-blue-200 p-4 rounded-2xl text-blue-600 bg-blue-50 cursor-pointer">
                            <span class="font-bold text-[10px] uppercase">📸 Foto</span>
                            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(this)">
                        </label>
                        <button type="submit" class="bg-blue-600 text-white font-black rounded-2xl uppercase text-xs">Registrar</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-agendamento" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-orange-100 mb-6">
                <form id="form-agendamento" class="space-y-3">
                    <input type="date" id="agend-data" required class="w-full bg-gray-50 border-2 p-3 rounded-2xl font-bold outline-none">
                    <input type="text" id="agend-veiculo" placeholder="VEÍCULO / CLIENTE" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                    <button type="submit" class="w-full bg-orange-500 text-white font-black p-4 rounded-2xl uppercase text-xs shadow-lg">Agendar</button>
                </form>
            </div>
            <div id="lista-agendamentos" class="space-y-2"></div>
        </section>

        <section id="aba-relatorio" class="tab-content">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-blue-100 mb-4">
                <input type="text" id="busca-historico" onkeyup="renderizarRelatorio()" placeholder="🔍 BUSCAR PLACA NO HISTÓRICO" class="w-full p-4 rounded-2xl bg-gray-50 border-2 font-black uppercase text-center outline-none focus:border-blue-500">
            </div>
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>

        <section id="aba-config" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-md space-y-4">
                <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100 text-center">
                    <p class="text-[10px] font-black text-blue-700 mb-3 uppercase italic">Armazenamento em Nuvem</p>
                    <button id="btn-login-drive" onclick="loginGoogle()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold text-xs uppercase shadow-md">Conectar meu Google Drive</button>
                    <p class="text-[8px] text-gray-400 mt-2 italic">Ao conectar, seus dados serão salvos no seu Drive pessoal.</p>
                </div>
                <input type="text" id="config-nome" placeholder="NOME DA OFICINA" class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                <button onclick="salvarConfig()" class="w-full bg-blue-700 text-white font-bold p-3 rounded-xl uppercase text-[10px]">Salvar Configurações</button>
            </div>
        </section>
    </main>

    <div id="pagina-detalhes">
        <header class="bg-blue-700 text-white p-5 flex justify-between items-center shadow-lg">
            <button onclick="fecharDetalhes()" class="font-bold">VOLTAR</button>
            <h1 class="text-xs font-black uppercase">Relatório de Serviço</h1>
            <button onclick="gerarPDF()" class="bg-green-500 px-3 py-2 rounded-lg font-black text-[10px] uppercase">PDF</button>
        </header>
        <div class="p-4">
            <div id="conteudo-pdf" class="bg-white p-6 rounded-2xl shadow-sm border">
                <div class="border-b-4 border-blue-700 pb-2 mb-4">
                    <h2 id="pdf-nome-oficina" class="text-2xl font-black text-blue-700 italic"></h2>
                    <p id="detalhe-os" class="text-xs font-bold text-gray-400"></p>
                </div>
                <div class="space-y-3">
                    <p><strong>PLACA:</strong> <span id="detalhe-placa" class="text-blue-600 font-black"></span></p>
                    <p><strong>MODELO:</strong> <span id="detalhe-modelo" class="uppercase"></span></p>
                    <p><strong>CLIENTE:</strong> <span id="detalhe-cliente" class="uppercase"></span></p>
                    <div class="bg-blue-50 p-4 rounded-xl">
                        <p class="text-[10px] font-bold text-blue-400">SERVIÇO REALIZADO:</p>
                        <p id="detalhe-servico" class="font-bold italic uppercase"></p>
                    </div>
                </div>
                <div id="detalhe-fotos-pdf" class="mt-6 space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="modal-saida">
        <div class="bg-white p-6 rounded-3xl w-80 shadow-2xl">
            <h3 class="font-black text-blue-700 uppercase mb-4 text-center">Finalizar Saída</h3>
            <input type="hidden" id="saida-id-temp">
            <input type="text" id="input-servico-final" placeholder="O QUE FOI FEITO?" class="w-full border-2 p-4 rounded-2xl mb-4 font-bold uppercase outline-none">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="fecharModalSaida()" class="bg-gray-100 p-3 rounded-xl font-bold uppercase text-[10px]">Cancelar</button>
                <button onclick="confirmarSaidaFinal()" class="bg-green-600 text-white p-3 rounded-xl font-black uppercase text-[10px]">Concluir</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-20 z-50">
        <button onclick="mudarAba('entrada')" class="nav-button active flex-1 flex flex-col items-center"><span>➕</span><span class="text-[8px] font-bold uppercase mt-1">Entrada</span></button>
        <button onclick="mudarAba('patio')" class="nav-button flex-1 flex flex-col items-center"><span>🚗</span><span class="text-[8px] font-bold uppercase mt-1">Pátio</span></button>
        <button onclick="mudarAba('agendamento')" class="nav-button flex-1 flex flex-col items-center"><span>📅</span><span class="text-[8px] font-bold uppercase mt-1">Agenda</span></button>
        <button onclick="mudarAba('relatorio')" class="nav-button flex-1 flex flex-col items-center"><span>📋</span><span class="text-[8px] font-black uppercase mt-1">Histórico</span></button>
        <button onclick="mudarAba('config')" class="nav-button flex-1 flex flex-col items-center"><span>⚙️</span><span class="text-[8px] font-bold uppercase mt-1">Ajustes</span></button>
    </nav>

    <script>
        const CLIENT_ID = "317001427708-1rglariag6m8l4vi4a19noduuuk2dg6b.apps.googleusercontent.com";
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];
        let agendamentos = JSON.parse(localStorage.getItem('patio_agendamentos')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO", os_counter: 1 };
        let fotosTemp = [], googleToken = null, fileIdDrive = null;

        // --- DRIVE ---
        function loginGoogle() {
            google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
                callback: async (resp) => {
                    googleToken = resp.access_token;
                    document.getElementById('btn-login-drive').innerText = "✓ CONECTADO COM SUCESSO";
                    document.getElementById('btn-login-drive').classList.replace('bg-blue-600', 'bg-green-500');
                    document.getElementById('status-drive').innerText = "Nuvem Ativa";
                    await buscarArquivoNoDrive();
                },
            }).requestAccessToken();
        }

        async function buscarArquivoNoDrive() {
            const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='patio_pro_db.json'`, { headers: { 'Authorization': `Bearer ${googleToken}` } });
            const d = await r.json(); if (d.files && d.files.length > 0) fileIdDrive = d.files[0].id;
        }

        async function salvarNoDrive() {
            if(!googleToken) return;
            const metadata = { name: 'patio_pro_db.json', mimeType: 'application/json' };
            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', new Blob([JSON.stringify({patio, historico, agendamentos})], { type: 'application/json' }));
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';
            if (fileIdDrive) { url = `https://www.googleapis.com/upload/drive/v3/files/${fileIdDrive}?uploadType=multipart`; method = 'PATCH'; }
            await fetch(url, { method: method, headers: { 'Authorization': `Bearer ${googleToken}` }, body: formData });
        }

        // --- FOTOS ---
        function processarFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 400; canvas.height = img.height * (400 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        fotosTemp.push(canvas.toDataURL('image/jpeg', 0.4));
                        renderizarPrevias();
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function renderizarPrevias() {
            const c = document.getElementById('container-previa'); c.innerHTML = '';
            fotosTemp.forEach((f, i) => { c.innerHTML += `<div class="relative h-16 border rounded-xl overflow-hidden"><img src="${f}" class="w-full h-full object-cover"><button type="button" onclick="fotosTemp.splice(${i},1);renderizarPrevias()" class="absolute top-0 right-0 bg-red-600 text-white px-1">✕</button></div>`; });
            c.classList.toggle('hidden', fotosTemp.length === 0);
        }

        // --- AÇÕES ---
        document.getElementById('form-entrada').onsubmit = async function(e) {
            e.preventDefault();
            const novo = { id: Date.now(), os: config.os_counter.toString().padStart(3, '0'), placa: document.getElementById('placa').value.toUpperCase(), modelo: document.getElementById('modelo').value.toUpperCase(), cliente: document.getElementById('cliente').value.toUpperCase(), fotos: [...fotosTemp], data: new Date().toLocaleDateString('pt-BR') };
            patio.unshift(novo); config.os_counter++;
            localStorage.setItem('patio_data', JSON.stringify(patio)); localStorage.setItem('patio_config', JSON.stringify(config));
            await salvarNoDrive(); location.reload();
        };

        function renderizarPatio() {
            const container = document.getElementById('lista-veiculos'); container.innerHTML = '';
            patio.forEach(v => {
                container.innerHTML += `<div class="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center"><img src="${v.fotos[0] || ''}" class="w-16 h-16 rounded-2xl object-cover"><div class="flex-1"><span class="text-[9px] font-black text-blue-600">OS #${v.os}</span><div class="font-black text-lg">${v.placa}</div><button onclick="abrirModalSaida(${v.id})" class="w-full bg-green-600 text-white p-2 rounded-xl text-[8px] font-black uppercase mt-1">Dar Saída</button></div></div>`;
            });
        }

        window.abrirModalSaida = (id) => { document.getElementById('saida-id-temp').value = id; document.getElementById('modal-saida').style.display = 'flex'; };
        window.fecharModalSaida = () => document.getElementById('modal-saida').style.display = 'none';

        window.confirmarSaidaFinal = async () => {
            const id = document.getElementById('saida-id-temp').value;
            const v = patio.find(x => x.id == id);
            const servico = document.getElementById('input-servico-final').value.toUpperCase() || "CONCLUÍDO";
            historico.unshift({...v, saida: new Date().toLocaleDateString('pt-BR'), servico});
            patio = patio.filter(x => x.id != id);
            localStorage.setItem('patio_data', JSON.stringify(patio)); localStorage.setItem('patio_historico', JSON.stringify(historico));
            await salvarNoDrive(); location.reload();
        };

        function renderizarRelatorio() {
            const busca = document.getElementById('busca-historico').value.toUpperCase();
            const container = document.getElementById('lista-relatorio'); container.innerHTML = '';
            historico.filter(v => v.placa.includes(busca)).forEach(v => {
                container.innerHTML += `<div onclick="abrirDetalhes(${v.id})" class="bg-white p-4 rounded-3xl border flex gap-4 items-center"><img src="${v.fotos[0] || ''}" class="w-12 h-12 rounded-xl object-cover"><div class="flex-1 text-left"><span class="text-[8px] text-gray-400">OS #${v.os}</span><div class="font-black">${v.placa}</div><div class="text-[9px] text-blue-600 font-bold uppercase truncate">${v.servico}</div></div></div>`;
            });
        }

        window.abrirDetalhes = (id) => {
            const v = historico.find(x => x.id == id);
            document.getElementById('detalhe-os').innerText = "ORDEM DE SERVIÇO #" + v.os;
            document.getElementById('detalhe-placa').innerText = v.placa;
            document.getElementById('detalhe-modelo').innerText = v.modelo;
            document.getElementById('detalhe-cliente').innerText = v.cliente;
            document.getElementById('detalhe-servico').innerText = v.servico;
            document.getElementById('pdf-nome-oficina').innerText = config.nome;
            const grid = document.getElementById('detalhe-fotos-pdf'); grid.innerHTML = '';
            v.fotos.forEach(f => { grid.innerHTML += `<img src="${f}" class="w-full rounded-xl shadow">`; });
            document.getElementById('pagina-detalhes').style.display = 'flex';
        };

        window.gerarPDF = async () => {
            const canvas = await html2canvas(document.getElementById('conteudo-pdf'), { scale: 2 });
            const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, (canvas.height * 210) / canvas.width);
            pdf.save(`Relatorio_${document.getElementById('detalhe-placa').innerText}.pdf`);
        };

        // --- AGENDA ---
        document.getElementById('form-agendamento').onsubmit = async (e) => {
            e.preventDefault();
            agendamentos.push({ id: Date.now(), data: document.getElementById('agend-data').value, veiculo: document.getElementById('agend-veiculo').value.toUpperCase() });
            localStorage.setItem('patio_agendamentos', JSON.stringify(agendamentos));
            await salvarNoDrive(); location.reload();
        };
        function renderizarAgendamentos() {
            const container = document.getElementById('lista-agendamentos'); container.innerHTML = '';
            agendamentos.sort((a,b) => new Date(a.data) - new Date(b.data)).forEach(a => {
                container.innerHTML += `<div class="bg-white p-3 rounded-2xl flex justify-between border mb-2"><span class="font-bold uppercase text-xs">${a.data.split('-').reverse().join('/')} - ${a.veiculo}</span><button onclick="agendamentos=agendamentos.filter(x=>x.id!==${a.id});localStorage.setItem('patio_agendamentos',JSON.stringify(agendamentos));renderizarAgendamentos();" class="text-red-500 font-bold">✕</button></div>`;
            });
        }

        // --- NAV ---
        window.mudarAba = (aba) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            event.currentTarget.classList.add('active');
            if(aba === 'patio') renderizarPatio();
            if(aba === 'relatorio') renderizarRelatorio();
            if(aba === 'agendamento') renderizarAgendamentos();
        };

        window.fecharDetalhes = () => document.getElementById('pagina-detalhes').style.display = 'none';
        window.salvarConfig = () => { config.nome = document.getElementById('config-nome').value.toUpperCase(); localStorage.setItem('patio_config', JSON.stringify(config)); location.reload(); };
        
        document.getElementById('app-nome-display').innerText = config.nome;
        document.getElementById('config-nome').value = config.nome;
        document.getElementById('proxima-os').innerText = "OS: #" + config.os_counter.toString().padStart(3, '0');
        renderizarPatio();
    </script>
</body>
</html>
