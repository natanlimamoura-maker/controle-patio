<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Pátio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-red: #d32f2f;
      --hover-red: #b71c1c;
      --bg-black: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2b2b2b;
      --text-white: #ffffff;
      --text-gray: #b0b0b0;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary-red);
    }

    h1 { color: var(--primary-red); font-size: 22px; text-transform: uppercase; }
    h2 { color: var(--primary-red); font-size: 18px; margin-bottom: 12px; }

    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 130px;
      padding: 12px 8px;
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      font-size: 13px;
    }

    .tab-btn.active {
      background: var(--primary-red);
      border-color: var(--primary-red);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-container {
      background-color: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-gray);
    }

    input[type="text"], input[type="number"], input[type="file"], input[type="date"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: var(--input-bg);
      color: var(--text-white);
      font-size: 14px;
    }

    textarea { resize: vertical; height: 75px; }

    .search-input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--primary-red);
      background-color: var(--input-bg);
      color: var(--text-white);
      margin-bottom: 15px;
    }

    .btn-action {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      width: 100%;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .btn-action:hover { background-color: var(--hover-red); }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .card-item:hover { border-color: var(--primary-red); }

    .img-box {
      width: 100%;
      height: 120px;
      border-radius: 6px;
      margin-bottom: 8px;
      background-color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-item .titulo {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-item .sub { color: var(--text-gray); font-size: 12px; margin-bottom: 8px; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 2px solid var(--primary-red);
    }

    .modal-content .img-box {
      height: 250px;
    }

    .report-list {
      text-align: left;
      margin-bottom: 15px;
      background: #121212;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }

    .report-item {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-white);
    }

    .report-item strong { color: var(--primary-red); }

    .btn-close {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Controle de Pátio</h1>
  </header>

  <div class="nav-tabs">
    <div class="tab-btn active" onclick="trocarAba('entrada')">Entrada Veículo</div>
    <div class="tab-btn" onclick="trocarAba('patio')">Pátio</div>
    <div class="tab-btn" onclick="trocarAba('estoque')">Estoque Peças</div>
    <div class="tab-btn" onclick="trocarAba('historico')">Histórico Saídas</div>
  </div>

  <!-- ABA 1: ENTRADA DE VEÍCULOS -->
  <div id="aba-entrada" class="tab-content active">
    <div class="form-container">
      <h2>Cadastrar Entrada de Veículo</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Cliente:</label>
          <input type="text" id="vCliente" placeholder="Nome do Cliente">
        </div>
        <div class="form-group">
          <label>Telefone:</label>
          <input type="text" id="vTelefone" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label>Modelo do Veículo:</label>
          <input type="text" id="vModelo" placeholder="Ex: Scania R450 / Hilux">
        </div>
        <div class="form-group">
          <label>Placa:</label>
          <input type="text" id="vPlaca" placeholder="Ex: ABC-1234">
        </div>
        <div class="form-group">
          <label>Data Entrada:</label>
          <input type="date" id="vDataEntrada">
        </div>
        <div class="form-group full">
          <label>O que foi feito / Defeito relatado:</label>
          <textarea id="vServico" placeholder="Descreva os serviços ou reparações efetuadas..."></textarea>
        </div>
        <div class="form-group full">
          <label>Foto do Veículo:</label>
          <input type="file" id="vFoto" accept="image/*">
        </div>
      </div>
      <button class="btn-action" id="btnSalvarVeiculo" onclick="salvarVeiculoPatio()">Dar Entrada no Pátio</button>
    </div>
  </div>

  <!-- ABA 2: PÁTIO -->
  <div id="aba-patio" class="tab-content">
    <h2>Veículos Atuais no Pátio</h2>
    <input type="text" id="buscaPatio" class="search-input" placeholder="🔍 Pesquisar por cliente, modelo ou placa..." oninput="filtrarPatio()">
    <div id="gridPatio" class="grid-cards"></div>
  </div>

  <!-- ABA 3: ESTOQUE PEÇAS -->
  <div id="aba-estoque" class="tab-content">
    <div class="form-container">
      <h2>Cadastrar Peça</h2>
      <div class="form-group">
        <label>Nome da Peça:</label>
        <input type="text" id="pecaNome" placeholder="Ex: Injetor Common Rail">
      </div>
      <div class="form-group">
        <label>Quantidade:</label>
        <input type="number" id="pecaQtd" min="0" placeholder="Ex: 5">
      </div>
      <div class="form-group">
        <label>Foto da Peça:</label>
        <input type="file" id="pecaFoto" accept="image/*">
      </div>
      <button class="btn-action" id="btnSalvarPeca" onclick="salvarPeca()">Salvar no Estoque</button>
    </div>

    <h2>Peças em Estoque</h2>
    <input type="text" id="buscaPecas" class="search-input" placeholder="🔍 Pesquisar peça pelo nome..." oninput="filtrarPecas()">
    <div id="gridPecas" class="grid-cards"></div>
  </div>

  <!-- ABA 4: HISTÓRICO DE SAÍDA DE VEÍCULOS -->
  <div id="aba-historico" class="tab-content">
    <h2>Histórico de Veículos Liberados</h2>
    <input type="text" id="buscaHist" class="search-input" placeholder="🔍 Pesquisar histórico por placa ou cliente..." oninput="filtrarHistorico()">
    <div id="gridHistorico" class="grid-cards"></div>
  </div>

  <!-- MODAL DE DETALHES -->
  <div id="modalDetalhes" class="modal-overlay">
    <div class="modal-content">
      <div class="img-box" id="modalImgContainer"></div>
      <div id="modalReport" class="report-list"></div>
      <div id="modalBtnAcao"></div>
      <button class="btn-close" style="margin-top:8px;" onclick="fecharModal()">FECHAR</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ywybppfkyekqlrndwhdn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_R08_JT0lLER2lnRE-v4xSw_4Dgl8BDU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let patioData = [];
    let pecasData = [];
    let historicoData = [];

    // PLACEHOLDER LIMPO EM JS (Sem quebrar HTML)
    const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22150%22%20height%3D%22120%22%20viewBox%3D%220%200%20150%20120%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%232b2b2b%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23777777%22%20font-family%3D%22sans-serif%22%20font-size%3D%2212%22%3ESem%20Foto%3C%2Ftext%3E%3C%2Fsvg%3E';

    function obterFotoUrl(obj) {
      const url = obj.foto_url || obj.foto || obj.fotos || obj.imagem || obj.url || '';
      if (!url || typeof url !== 'string' || url.trim() === '' || url.includes('null') || url.includes('undefined')) {
        return PLACEHOLDER_IMG;
      }
      return url.trim();
    }

    function trocarAba(aba) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        const abas = ['entrada', 'patio', 'estoque', 'historico'];
        b.classList.toggle('active', abas[i] === aba);
      });
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`aba-${aba}`).classList.add('active');

      if (aba === 'patio') carregarPatio();
      if (aba === 'estoque') carregarPecas();
      if (aba === 'historico') carregarHistorico();
    }

    async function uploadFoto(file, pasta) {
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const filePath = `${pasta}/${Date.now()}.${fileExt}`;

      const { error: uploadError } = await _supabase.storage
        .from('fotos-pecas')
        .upload(filePath, file);

      if (uploadError) throw uploadError;

      const { data } = _supabase.storage
        .from('fotos-pecas')
        .getPublicUrl(filePath);

      return data.publicUrl;
    }

    // --- CADASTRAR VEÍCULO ---
    async function salvarVeiculoPatio() {
      const cliente = document.getElementById('vCliente').value.trim();
      const telefone = document.getElementById('vTelefone').value.trim();
      const modelo = document.getElementById('vModelo').value.trim();
      const placa = document.getElementById('vPlaca').value.trim();
      const entrada = document.getElementById('vDataEntrada').value;
      const servico = document.getElementById('vServico').value.trim();
      const file = document.getElementById('vFoto').files[0];

      if (!modelo || !placa) {
        alert('Informe ao menos o modelo e a placa do veículo!');
        return;
      }

      const btn = document.getElementById('btnSalvarVeiculo');
      btn.innerText = 'CADASTRANDO...'; btn.disabled = true;

      try {
        let fotoUrl = null;
        if (file) fotoUrl = await uploadFoto(file, 'veiculos');

        const payload = {
          cliente,
          telefone,
          modelo,
          placa,
          entrada,
          servico,
          observacoes: servico,
          foto_url: fotoUrl
        };

        const { error } = await _supabase.from('patio').insert([payload]);
        if (error) throw error;

        alert('Veículo inserido no Pátio!');
        document.getElementById('vCliente').value = '';
        document.getElementById('vTelefone').value = '';
        document.getElementById('vModelo').value = '';
        document.getElementById('vPlaca').value = '';
        document.getElementById('vServico').value = '';
        document.getElementById('vFoto').value = '';
        trocarAba('patio');
      } catch (err) {
        alert('Erro ao cadastrar veículo: ' + err.message);
      } finally {
        btn.innerText = 'DAR ENTRADA NO PÁTIO'; btn.disabled = false;
      }
    }

    // --- PÁTIO DE VEÍCULOS ---
    async function carregarPatio() {
      const { data, error } = await _supabase.from('patio').select('*').order('id', { ascending: false });
      if (error) return console.error('Erro no patio:', error);
      patioData = data || [];
      filtrarPatio();
    }

    function filtrarPatio() {
      const t = document.getElementById('buscaPatio').value.toLowerCase().trim();
      const list = patioData.filter(v => 
        (v.modelo || v.veiculo || '').toLowerCase().includes(t) ||
        (v.placa || '').toLowerCase().includes(t) ||
        (v.cliente || v.nome_cliente || '').toLowerCase().includes(t)
      );

      const grid = document.getElementById('gridPatio');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhum veículo no pátio.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(v => {
        const modeloVeiculo = v.modelo || v.veiculo || 'Veículo';
        const placaVeiculo = v.placa || 'Sem Placa';
        const clienteVeiculo = v.cliente || v.nome_cliente || 'Não informado';
        const imgUrl = obterFotoUrl(v);

        const card = document.createElement('div');
        card.className = 'card-item';
        card.onclick = () => verDetalhesVeiculo(v, 'patio');
        card.innerHTML = `
          <div class="img-box">
            <img src="${imgUrl}" onerror="this.src='${PLACEHOLDER_IMG}'">
          </div>
          <div class="titulo">${modeloVeiculo}</div>
          <div class="sub">Placa: ${placaVeiculo}</div>
          <div class="sub" style="color:var(--primary-red); font-weight: bold;">Cliente: ${clienteVeiculo}</div>
        `;
        grid.appendChild(card);
      });
    }

    function verDetalhesVeiculo(v, origem) {
      const imgUrl = obterFotoUrl(v);
      document.getElementById('modalImgContainer').innerHTML = `<img src="${imgUrl}" onerror="this.src='${PLACEHOLDER_IMG}'">`;
      
      document.getElementById('modalReport').innerHTML = `
        <div class="report-item"><strong>CLIENTE:</strong> ${v.cliente || v.nome_cliente || 'Não cadastrado'}</div>
        <div class="report-item"><strong>TELEFONE:</strong> ${v.telefone || 'Não informado'}</div>
        <div class="report-item"><strong>MODELO VEÍCULO:</strong> ${v.modelo || v.veiculo || 'N/I'}</div>
        <div class="report-item"><strong>PLACA:</strong> ${v.placa || 'N/I'}</div>
        <div class="report-item"><strong>DATA ENTRADA:</strong> ${v.entrada || v.data || 'N/I'}</div>
        <div class="report-item"><strong>SERVIÇO / OBSERVACÕES:</strong> ${v.servico || v.observacoes || 'Sem detalhes.'}</div>
      `;

      const btnAcao = document.getElementById('modalBtnAcao');
      if (origem === 'patio') {
        btnAcao.innerHTML = `<button class="btn-action" onclick="darSaidaVeiculo(${v.id})">DAR SAÍDA (MOVER P/ HISTÓRICO)</button>`;
      } else {
        btnAcao.innerHTML = '';
      }

      document.getElementById('modalDetalhes').style.display = 'flex';
    }

    async function darSaidaVeiculo(id) {
      if (!confirm('Confirmar saída deste veículo do pátio para o histórico?')) return;
      const v = patioData.find(item => item.id === id);
      if (!v) return;

      try {
        const payload = { ...v };
        delete payload.id;
        payload.saida = new Date().toISOString().split('T')[0];

        await _supabase.from('historico').insert([payload]);
        await _supabase.from('patio').delete().eq('id', id);

        fecharModal();
        carregarPatio();
        alert('Veículo movido para o histórico de saídas!');
      } catch (err) {
        alert('Erro ao dar saída: ' + err.message);
      }
    }

    // --- ESTOQUE DE PEÇAS ---
    async function carregarPecas() {
      const { data, error } = await _supabase.from('produtos').select('*').order('id', { ascending: false });
      if (error) return console.error('Erro nas pecas:', error);
      pecasData = data || [];
      filtrarPecas();
    }

    function filtrarPecas() {
      const t = document.getElementById('buscaPecas').value.toLowerCase().trim();
      const list = pecasData.filter(p => (p.nome || p.descricao || p.titulo || '').toLowerCase().includes(t));

      const grid = document.getElementById('gridPecas');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhuma peça encontrada.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(p => {
        const nomePeca = p.nome || p.descricao || p.titulo || p.produto || 'Peça Sem Nome';
        const quantidade = p.quantidade ?? p.qtd ?? p.estoque ?? 0;
        const imgUrl = obterFotoUrl(p);

        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="img-box">
            <img src="${imgUrl}" onerror="this.src='${PLACEHOLDER_IMG}'">
          </div>
          <div class="titulo">${nomePeca}</div>
          <div class="sub">Qtd: ${quantidade}</div>
        `;
        grid.appendChild(card);
      });
    }

    async function salvarPeca() {
      const nome = document.getElementById('pecaNome').value.trim();
      const quantidade = Number(document.getElementById('pecaQtd').value);
      const file = document.getElementById('pecaFoto').files[0];

      if (!nome) return alert('Informe o nome da peça!');

      try {
        let fotoUrl = null;
        if (file) fotoUrl = await uploadFoto(file, 'pecas');

        await _supabase.from('produtos').insert([{ nome, quantidade, foto_url: fotoUrl }]);
        document.getElementById('pecaNome').value = '';
        document.getElementById('pecaQtd').value = '';
        document.getElementById('pecaFoto').value = '';
        carregarPecas();
        alert('Peça salva no estoque!');
      } catch (err) {
        alert('Erro: ' + err.message);
      }
    }

    // --- HISTÓRICO DE SAÍDAS ---
    async function carregarHistorico() {
      const { data, error } = await _supabase.from('historico').select('*').order('id', { ascending: false });
      if (error) return console.error('Erro no historico:', error);
      historicoData = data || [];
      filtrarHistorico();
    }

    function filtrarHistorico() {
      const t = document.getElementById('buscaHist').value.toLowerCase().trim();
      const list = historicoData.filter(v => 
        (v.modelo || v.veiculo || '').toLowerCase().includes(t) ||
        (v.placa || '').toLowerCase().includes(t) ||
        (v.cliente || v.nome_cliente || '').toLowerCase().includes(t)
      );

      const grid = document.getElementById('gridHistorico');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhum registro no histórico de saídas.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(v => {
        const modeloVeiculo = v.modelo || v.veiculo || 'Veículo';
        const placaVeiculo = v.placa || 'Sem Placa';
        const clienteVeiculo = v.cliente || v.nome_cliente || 'Não informado';
        const imgUrl = obterFotoUrl(v);

        const card = document.createElement('div');
        card.className = 'card-item';
        card.onclick = () => verDetalhesVeiculo(v, 'historico');
        card.innerHTML = `
          <div class="img-box">
            <img src="${imgUrl}" onerror="this.src='${PLACEHOLDER_IMG}'">
          </div>
          <div class="titulo">${modeloVeiculo}</div>
          <div class="sub">Placa: ${placaVeiculo}</div>
          <div class="sub" style="color:#888;">Cliente: ${clienteVeiculo}</div>
        `;
        grid.appendChild(card);
      });
    }

    function fecharModal() {
      document.getElementById('modalDetalhes').style.display = 'none';
    }

    // Inicialização da data atual na Entrada
    document.getElementById('vDataEntrada').valueAsDate = new Date();
  </script>
</body>
</html>
