<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Pátio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-red: #d32f2f;
      --hover-red: #b71c1c;
      --bg-black: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2b2b2b;
      --text-white: #ffffff;
      --text-gray: #b0b0b0;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary-red);
    }

    h1 { color: var(--primary-red); font-size: 22px; text-transform: uppercase; }
    h2 { color: var(--primary-red); font-size: 18px; margin-bottom: 12px; }

    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 130px;
      padding: 12px 8px;
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      font-size: 13px;
    }

    .tab-btn.active {
      background: var(--primary-red);
      border-color: var(--primary-red);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-container {
      background-color: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-gray);
    }

    input[type="text"], input[type="number"], input[type="file"], input[type="date"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: var(--input-bg);
      color: var(--text-white);
      font-size: 14px;
    }

    .search-input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--primary-red);
      background-color: var(--input-bg);
      color: var(--text-white);
      margin-bottom: 15px;
    }

    .btn-action {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      width: 100%;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .btn-action:hover { background-color: var(--hover-red); }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .card-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .card-item:hover { border-color: var(--primary-red); }

    .img-box {
      width: 100%;
      height: 120px;
      border-radius: 6px;
      margin-bottom: 8px;
      background-color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-item .titulo {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .card-item .sub { color: var(--text-gray); font-size: 12px; margin-bottom: 6px; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 2px solid var(--primary-red);
    }

    .modal-content .img-box { height: 250px; }

    .report-list {
      text-align: left;
      margin-bottom: 15px;
      background: #121212;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }

    .report-item { margin-bottom: 8px; font-size: 14px; color: var(--text-white); }
    .report-item strong { color: var(--primary-red); }

    .btn-close {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Controle de Pátio</h1>
  </header>

  <div class="nav-tabs">
    <div class="tab-btn active" onclick="trocarAba('entrada')">Entrada Veículo</div>
    <div class="tab-btn" onclick="trocarAba('patio')">Pátio</div>
    <div class="tab-btn" onclick="trocarAba('estoque')">Estoque Peças</div>
    <div class="tab-btn" onclick="trocarAba('hist-veiculos')">Histórico Veículos</div>
    <div class="tab-btn" onclick="trocarAba('hist-estoque')">Histórico Estoque</div>
  </div>

  <!-- ABA 1: ENTRADA DE VEÍCULOS -->
  <div id="aba-entrada" class="tab-content active">
    <div class="form-container">
      <h2>Cadastrar Entrada de Veículo</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Cliente:</label>
          <input type="text" id="vCliente" placeholder="Nome do Cliente">
        </div>
        <div class="form-group">
          <label>Modelo do Veículo:</label>
          <input type="text" id="vModelo" placeholder="Ex: Scania R450 / Hilux">
        </div>
        <div class="form-group">
          <label>Placa:</label>
          <input type="text" id="vPlaca" placeholder="Ex: ABC-1234">
        </div>
        <div class="form-group">
          <label>Data Entrada:</label>
          <input type="date" id="vDataEntrada">
        </div>
        <div class="form-group full">
          <label>Foto do Veículo:</label>
          <input type="file" id="vFoto" accept="image/*">
        </div>
      </div>
      <button class="btn-action" id="btnSalvarVeiculo" onclick="salvarVeiculoPatio()">Dar Entrada no Pátio</button>
    </div>
  </div>

  <!-- ABA 2: PÁTIO -->
  <div id="aba-patio" class="tab-content">
    <h2>Veículos Atuais no Pátio</h2>
    <input type="text" id="buscaPatio" class="search-input" placeholder="🔍 Pesquisar por cliente, modelo ou placa..." oninput="filtrarPatio()">
    <div id="gridPatio" class="grid-cards"></div>
  </div>

  <!-- ABA 3: ESTOQUE PEÇAS -->
  <div id="aba-estoque" class="tab-content">
    <div class="form-container">
      <h2>Cadastrar Peça</h2>
      <div class="form-group">
        <label>Nome da Peça:</label>
        <input type="text" id="pecaNome" placeholder="Ex: Injetor Common Rail">
      </div>
      <div class="form-group">
        <label>Quantidade:</label>
        <input type="number" id="pecaQtd" min="0" placeholder="Ex: 5">
      </div>
      <div class="form-group">
        <label>Foto da Peça:</label>
        <input type="file" id="pecaFoto" accept="image/*">
      </div>
      <button class="btn-action" id="btnSalvarPeca" onclick="salvarPeca()">Salvar no Estoque</button>
    </div>

    <h2>Peças em Estoque</h2>
    <input type="text" id="buscaPecas" class="search-input" placeholder="🔍 Pesquisar peça pelo nome..." oninput="filtrarPecas()">
    <div id="gridPecas" class="grid-cards"></div>
  </div>

  <!-- ABA 4: HISTÓRICO DE VEÍCULOS -->
  <div id="aba-hist-veiculos" class="tab-content">
    <h2>Histórico de Veículos Liberados</h2>
    <input type="text" id="buscaHistVeiculos" class="search-input" placeholder="🔍 Pesquisar veículos liberados..." oninput="filtrarHistVeiculos()">
    <div id="gridHistVeiculos" class="grid-cards"></div>
  </div>

  <!-- ABA 5: HISTÓRICO DE ESTOQUE -->
  <div id="aba-hist-estoque" class="tab-content">
    <h2>Histórico de Movimentação do Estoque</h2>
    <input type="text" id="buscaHistEstoque" class="search-input" placeholder="🔍 Pesquisar movimentação de estoque..." oninput="filtrarHistEstoque()">
    <div id="gridHistEstoque" class="grid-cards"></div>
  </div>

  <!-- MODAL DE DETALHES -->
  <div id="modalDetalhes" class="modal-overlay">
    <div class="modal-content">
      <div class="img-box" id="modalImgContainer"></div>
      <div id="modalReport" class="report-list"></div>
      <div id="modalBtnAcao"></div>
      <button class="btn-close" style="margin-top:8px;" onclick="fecharModal()">FECHAR</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ywybppfkyekqlrndwhdn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_R08_JT0lLER2lnRE-v4xSw_4Dgl8BDU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let patioData = [];
    let pecasData = [];
    let historicoData = [];

    const PLACEHOLDER_IMG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22150%22%20height%3D%22120%22%20viewBox%3D%220%200%20150%20120%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%232b2b2b%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23777777%22%20font-family%3D%22sans-serif%22%20font-size%3D%2212%22%3ESem%20Foto%3C%2Ftext%3E%3C%2Fsvg%3E';

    function extrairFotoPatio(fotos) {
      if (!fotos) return PLACEHOLDER_IMG;
      if (Array.isArray(fotos) && fotos.length > 0) return fotos[0];
      if (typeof fotos === 'string' && fotos.trim().length > 5) return fotos.trim();
      return PLACEHOLDER_IMG;
    }

    function trocarAba(aba) {
      const abas = ['entrada', 'patio', 'estoque', 'hist-veiculos', 'hist-estoque'];
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', abas[i] === aba);
      });
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`aba-${aba}`).classList.add('active');

      if (aba === 'patio') carregarPatio();
      if (aba === 'estoque') carregarPecas();
      if (aba === 'hist-veiculos' || aba === 'hist-estoque') carregarHistoricoGeral();
    }

    async function uploadFoto(file, pasta) {
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const filePath = `${pasta}/${Date.now()}.${fileExt}`;

      const { error: uploadError } = await _supabase.storage.from('fotos-pecas').upload(filePath, file);
      if (uploadError) throw uploadError;

      const { data } = _supabase.storage.from('fotos-pecas').getPublicUrl(filePath);
      return data.publicUrl;
    }

    // --- ENTRADA VEÍCULO ---
    async function salvarVeiculoPatio() {
      const cliente = document.getElementById('vCliente').value.trim();
      const modelo = document.getElementById('vModelo').value.trim();
      const placa = document.getElementById('vPlaca').value.trim();
      const entrada = document.getElementById('vDataEntrada').value;
      const file = document.getElementById('vFoto').files[0];

      if (!modelo || !placa) return alert('Informe ao menos o modelo e a placa!');

      const btn = document.getElementById('btnSalvarVeiculo');
      btn.innerText = 'CADASTRANDO...'; btn.disabled = true;

      try {
        let fotosArr = [];
        if (file) {
          const url = await uploadFoto(file, 'veiculos');
          if (url) fotosArr.push(url);
        }

        const payload = {
          cliente: cliente || 'Não informado',
          modelo: modelo,
          placa: placa,
          entrada: entrada || new Date().toISOString().split('T')[0],
          fotos: fotosArr
        };

        const { error } = await _supabase.from('patio').insert([payload]);
        if (error) throw error;

        alert('Veículo inserido no Pátio!');
        document.getElementById('vCliente').value = '';
        document.getElementById('vModelo').value = '';
        document.getElementById('vPlaca').value = '';
        document.getElementById('vFoto').value = '';
        trocarAba('patio');
      } catch (err) {
        alert('Erro ao cadastrar veículo: ' + err.message);
      } finally {
        btn.innerText = 'DAR ENTRADA NO PÁTIO'; btn.disabled = false;
      }
    }

    // --- PÁTIO ---
    async function carregarPatio() {
      const { data, error } = await _supabase.from('patio').select('*').order('created_at', { ascending: false });
      if (error) return console.error(error);
      patioData = data || [];
      filtrarPatio();
    }

    function filtrarPatio() {
      const t = document.getElementById('buscaPatio').value.toLowerCase().trim();
      const list = patioData.filter(v => (v.modelo || '').toLowerCase().includes(t) || (v.placa || '').toLowerCase().includes(t) || (v.cliente || '').toLowerCase().includes(t));

      const grid = document.getElementById('gridPatio');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhum veículo no pátio.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(v => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.onclick = () => verDetalhesVeiculo(v);
        card.innerHTML = `
          <div class="img-box"><img src="${extrairFotoPatio(v.fotos)}" onerror="this.src='${PLACEHOLDER_IMG}'"></div>
          <div class="titulo">${v.modelo || 'Veículo'}</div>
          <div class="sub">Placa: ${v.placa || 'Sem Placa'}</div>
          <div class="sub" style="color:var(--primary-red); font-weight: bold;">Cliente: ${v.cliente || 'Não informado'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function verDetalhesVeiculo(v) {
      document.getElementById('modalImgContainer').innerHTML = `<img src="${extrairFotoPatio(v.fotos)}" onerror="this.src='${PLACEHOLDER_IMG}'">`;
      document.getElementById('modalReport').innerHTML = `
        <div class="report-item"><strong>CLIENTE:</strong> ${v.cliente || 'Não informado'}</div>
        <div class="report-item"><strong>MODELO VEÍCULO:</strong> ${v.modelo || 'N/I'}</div>
        <div class="report-item"><strong>PLACA:</strong> ${v.placa || 'N/I'}</div>
        <div class="report-item"><strong>DATA ENTRADA:</strong> ${v.entrada || 'N/I'}</div>
      `;
      document.getElementById('modalBtnAcao').innerHTML = `<button class="btn-action" onclick="darSaidaVeiculo('${v.id}')">DAR SAÍDA (MOVER P/ HISTÓRICO)</button>`;
      document.getElementById('modalDetalhes').style.display = 'flex';
    }

    async function darSaidaVeiculo(id) {
      if (!confirm('Confirmar saída deste veículo para o histórico?')) return;
      const v = patioData.find(item => item.id === id);
      if (!v) return;

      try {
        const textoHistorico = `Veículo: ${v.modelo || 'N/I'} | Placa: ${v.placa || 'N/I'} | Cliente: ${v.cliente || 'N/I'}`;
        const dataHoje = new Date().toISOString().split('T')[0];

        await _supabase.from('historico').insert([{ date: dataHoje, text: textoHistorico }]);
        await _supabase.from('patio').delete().eq('id', id);

        fecharModal();
        carregarPatio();
        alert('Veículo movido para o histórico de saídas!');
      } catch (err) {
        alert('Erro ao dar saída: ' + err.message);
      }
    }

    // --- ESTOQUE PEÇAS ---
    async function carregarPecas() {
      const { data, error } = await _supabase.from('produtos').select('*').order('id', { ascending: false });
      if (error) return console.error(error);
      pecasData = data || [];
      filtrarPecas();
    }

    function filtrarPecas() {
      const t = document.getElementById('buscaPecas').value.toLowerCase().trim();
      const list = pecasData.filter(p => (p.name || '').toLowerCase().includes(t));

      const grid = document.getElementById('gridPecas');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhuma peça encontrada.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(p => {
        const fotoUrl = (p.img && p.img.trim().length > 5) ? p.img.trim() : PLACEHOLDER_IMG;
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="img-box"><img src="${fotoUrl}" onerror="this.src='${PLACEHOLDER_IMG}'"></div>
          <div class="titulo">${p.name || 'Sem Nome'}</div>
          <div class="sub">Qtd: ${p.qty ?? 0}</div>
        `;
        grid.appendChild(card);
      });
    }

    async function salvarPeca() {
      const name = document.getElementById('pecaNome').value.trim();
      const qty = Number(document.getElementById('pecaQtd').value);
      const file = document.getElementById('pecaFoto').files[0];

      if (!name) return alert('Informe o nome da peça!');

      try {
        let img = null;
        if (file) img = await uploadFoto(file, 'pecas');

        await _supabase.from('produtos').insert([{ name, qty, img }]);
        
        // Regista no histórico do estoque
        const dataHoje = new Date().toISOString().split('T')[0];
        await _supabase.from('historico').insert([{ date: dataHoje, text: `Adicionado: ${qty}x ${name}` }]);

        document.getElementById('pecaNome').value = '';
        document.getElementById('pecaQtd').value = '';
        document.getElementById('pecaFoto').value = '';
        carregarPecas();
        alert('Peça salva no estoque!');
      } catch (err) {
        alert('Erro: ' + err.message);
      }
    }

    // --- HISTÓRICOS (SEPARADOS) ---
    async function carregarHistoricoGeral() {
      const { data, error } = await _supabase.from('historico').select('*').order('id', { ascending: false });
      if (error) return console.error(error);
      historicoData = data || [];
      filtrarHistVeiculos();
      filtrarHistEstoque();
    }

    // 1. Filtra Apenas Veículos Liberados
    function filtrarHistVeiculos() {
      const t = document.getElementById('buscaHistVeiculos').value.toLowerCase().trim();
      const list = historicoData.filter(h => {
        const txt = (h.text || '').toLowerCase();
        const eVeiculo = txt.includes('veículo:') || txt.includes('veiculo:');
        return eVeiculo && (txt.includes(t) || (h.date || '').includes(t));
      });

      const grid = document.getElementById('gridHistVeiculos');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhum veículo liberado no histórico.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.style.textAlign = 'left';
        card.innerHTML = `
          <div class="titulo" style="color:var(--primary-red)">Data: ${h.date || 'Sem data'}</div>
          <div class="sub" style="color:#fff; font-size: 13px; margin-top: 5px;">${h.text || ''}</div>
        `;
        grid.appendChild(card);
      });
    }

    // 2. Filtra Apenas Movimentação de Peças/Estoque
    function filtrarHistEstoque() {
      const t = document.getElementById('buscaHistEstoque').value.toLowerCase().trim();
      const list = historicoData.filter(h => {
        const txt = (h.text || '').toLowerCase();
        const eVeiculo = txt.includes('veículo:') || txt.includes('veiculo:');
        return !eVeiculo && (txt.includes(t) || (h.date || '').includes(t));
      });

      const grid = document.getElementById('gridHistEstoque');
      if (list.length === 0) {
        grid.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align: center; padding: 20px;">Nenhuma movimentação de estoque encontrada.</p>';
        return;
      }

      grid.innerHTML = '';
      list.forEach(h => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.style.textAlign = 'left';
        card.innerHTML = `
          <div class="titulo" style="color:var(--primary-red)">Data: ${h.date || 'Sem data'}</div>
          <div class="sub" style="color:#fff; font-size: 13px; margin-top: 5px;">${h.text || ''}</div>
        `;
        grid.appendChild(card);
      });
    }

    function fecharModal() {
      document.getElementById('modalDetalhes').style.display = 'none';
    }

    document.getElementById('vDataEntrada').valueAsDate = new Date();
  </script>
</body>
</html>
