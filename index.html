<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PÁTIO PRO v12.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background:#050505; color:#fff; font-family:'Inter', sans-serif; -webkit-tap-highlight-color:transparent; }
        .glass { background:rgba(18,18,18,.9); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.05); }
        input, textarea, select { background:#0a0a0a !important; border:1px solid #222 !important; color:#fff !important; outline:none; width:100%; padding:0.8rem; border-radius:0.8rem; font-size:0.8rem; }
        .btn-red { background:#dc2626; color:white; font-weight:900; padding:1rem; border-radius:1rem; width:100%; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px; }
        #bloqueio { display:none; position:fixed; inset:0; background:#000; z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20">

    <div id="bloqueio">
        <h2 class="text-red-600 font-black text-3xl italic mb-4 text-center">LICENÇA EXPIRADA</h2>
        <input id="chave-ativacao" type="password" placeholder="SENHA MESTRA" class="mb-4 text-center">
        <button onclick="verificarChave()" class="btn-red">Ativar</button>
    </div>

    <header class="p-5 sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-white/5 flex justify-between items-center">
        <h1 onclick="show('menu')" class="font-black italic cursor-pointer text-lg" id="header-nome">PÁTIO<span class="text-red-600">PRO</span></h1>
        <div id="contador" class="text-[9px] font-black text-red-500 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20 uppercase">0 Veículos</div>
    </header>

    <main class="p-4 max-w-lg mx-auto space-y-4">

        <section id="menu" class="grid grid-cols-2 gap-3">
            <button onclick="show('entrada')" class="glass p-6 rounded-3xl text-center">➕<p class="text-[9px] font-black mt-2 text-zinc-400">ENTRADA</p></button>
            <button onclick="show('patio')" class="glass p-6 rounded-3xl text-center border-b-2 border-red-600">🚗<p class="text-[9px] font-black mt-2 text-zinc-400">PÁTIO</p></button>
            <button onclick="show('orcamento')" class="glass p-6 rounded-3xl text-center">📄<p class="text-[9px] font-black mt-2 text-zinc-400">ORÇAMENTO</p></button>
            <button onclick="show('historico')" class="glass p-6 rounded-3xl text-center">📜<p class="text-[9px] font-black mt-2 text-zinc-400">HISTÓRICO</p></button>
            <button onclick="show('balanco')" class="glass p-6 rounded-3xl text-center bg-green-900/5 col-span-2">💰<p class="text-[9px] font-black mt-2 text-green-500 italic">BALANÇO FINANCEIRO</p></button>
        </section>

        <section id="entrada" class="hidden space-y-3 glass p-5 rounded-3xl">
            <button onclick="show('menu')" class="text-[10px] font-black text-zinc-600">← VOLTAR</button>
            <input id="placa" placeholder="PLACA" class="text-center text-xl font-black text-red-600 uppercase">
            <input id="cliente" placeholder="NOME DO CLIENTE">
            <input id="modelo" placeholder="MODELO DO VEÍCULO">
            <textarea id="obs" placeholder="OBSERVAÇÕES (AVARIAS)"></textarea>
            <div class="space-y-2">
                <label class="text-[9px] font-black text-zinc-500 uppercase">Foto do Veículo</label>
                <input type="file" id="fotos" accept="image/*" capture="camera" multiple class="text-[10px]">
            </div>
            <button onclick="salvarEntrada()" class="btn-red">Registrar no Pátio</button>
        </section>

        <section id="orcamento" class="hidden space-y-3">
            <button onclick="show('menu')" class="text-[10px] font-black text-zinc-600">← VOLTAR</button>
            <div class="glass p-5 rounded-3xl space-y-3">
                <p class="text-[10px] font-black text-red-600 italic">DADOS DO CLIENTE</p>
                <input id="orc-cliente" placeholder="NOME COMPLETO">
                <div class="grid grid-cols-2 gap-2">
                    <input id="orc-fone" placeholder="WHATSAPP">
                    <input id="orc-doc" placeholder="CPF/CNPJ">
                </div>
                <input id="orc-endereco" placeholder="ENDEREÇO">
                <div class="grid grid-cols-2 gap-2">
                    <input id="orc-modelo" placeholder="VEÍCULO">
                    <input id="orc-placa" placeholder="PLACA" class="uppercase">
                </div>
            </div>

            <div class="glass p-5 rounded-3xl space-y-3">
                <p class="text-[10px] font-black text-red-600 italic uppercase">Serviços e Valores</p>
                <div id="itens-servico" class="space-y-2">
                    <div class="flex gap-2 item-linha">
                        <input class="flex-1 s-nome" placeholder="Serviço">
                        <input class="w-24 s-valor" type="number" placeholder="R$" oninput="calcularTotalOrc()">
                    </div>
                </div>
                <button onclick="addLinhaServico()" class="text-[9px] font-black text-zinc-500">+ ADICIONAR ITEM</button>
                <div class="border-t border-white/5 pt-3 flex justify-between items-center">
                    <span class="text-xs font-black">TOTAL:</span>
                    <span id="orc-total-display" class="text-xl font-black text-green-500">R$ 0,00</span>
                </div>
                <button onclick="gerarPDF()" class="btn-red">Gerar e Enviar PDF</button>
            </div>
        </section>

        <section id="patio" class="hidden space-y-3"></section>

        <section id="historico" class="hidden space-y-2"></section>

        <section id="balanco" class="hidden space-y-4 text-center">
            <div class="glass p-10 rounded-[2.5rem] border-t-4 border-green-600">
                <p class="text-[10px] font-black text-zinc-500 uppercase">Faturamento Mensal</p>
                <h2 id="totalMes" class="text-4xl font-black italic">R$ 0,00</h2>
            </div>
            <div id="listaFaturamento" class="space-y-2 text-left"></div>
        </section>

    </main>

    <script>
        const { jsPDF } = window.jspdf;
        let db = JSON.parse(localStorage.getItem('patio_pro_v12')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { 
            nome: "PÁTIO PRO", expiracao: new Date().getTime() + (30*24*60*60*1000) 
        };

        function init() {
            if (new Date().getTime() > config.expiracao) document.getElementById('bloqueio').style.display='flex';
            document.getElementById('header-nome').innerText = config.nome;
            render();
        }

        function verificarChave() {
            if(document.getElementById('chave-ativacao').value === "meuapp") {
                config.expiracao = new Date().getTime() + (30*24*60*60*1000);
                localStorage.setItem('patio_config', JSON.stringify(config));
                location.reload();
            }
        }

        function show(id) {
            document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
            document.getElementById(id).classList.remove("hidden");
            window.scrollTo(0,0);
        }

        function addLinhaServico() {
            const div = document.createElement('div');
            div.className = "flex gap-2 item-linha";
            div.innerHTML = `<input class="flex-1 s-nome" placeholder="Serviço">
                             <input class="w-24 s-valor" type="number" placeholder="R$" oninput="calcularTotalOrc()">`;
            document.getElementById('itens-servico').appendChild(div);
        }

        function calcularTotalOrc() {
            let total = 0;
            document.querySelectorAll('.s-valor').forEach(i => total += (Number(i.value) || 0));
            document.getElementById('orc-total-display').innerText = total.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
            return total;
        }

        async function gerarPDF() {
            const doc = new jsPDF();
            const cliente = document.getElementById('orc-cliente').value;
            const total = calcularTotalOrc();
            
            doc.setFont("helvetica", "bold");
            doc.text(config.nome, 105, 20, { align: "center" });
            doc.setFontSize(10);
            doc.text("ORÇAMENTO DE SERVIÇOS", 105, 28, { align: "center" });
            
            doc.line(10, 35, 200, 35);
            doc.text(`CLIENTE: ${cliente.toUpperCase()}`, 10, 45);
            doc.text(`DOC: ${document.getElementById('orc-doc').value}`, 10, 50);
            doc.text(`FONE: ${document.getElementById('orc-fone').value}`, 10, 55);
            doc.text(`VEÍCULO: ${document.getElementById('orc-modelo').value.toUpperCase()} | PLACA: ${document.getElementById('orc-placa').value.toUpperCase()}`, 10, 60);
            
            doc.line(10, 65, 200, 65);
            doc.text("DESCRIÇÃO DOS SERVIÇOS", 10, 75);
            
            let y = 85;
            document.querySelectorAll('.item-linha').forEach(linha => {
                const nome = linha.querySelector('.s-nome').value;
                const valor = Number(linha.querySelector('.s-valor').value);
                if(nome) {
                    doc.setFont("helvetica", "normal");
                    doc.text(nome.toUpperCase(), 10, y);
                    doc.text(`R$ ${valor.toFixed(2)}`, 190, y, { align: "right" });
                    y += 7;
                }
            });

            doc.line(10, y + 5, 200, y + 5);
            doc.setFont("helvetica", "bold");
            doc.text(`TOTAL GERAL: R$ ${total.toFixed(2)}`, 190, y + 15, { align: "right" });

            // Salvar e registrar no financeiro
            db.push({ id: Date.now(), cliente, valor: total, saida: new Date().toISOString(), ativo: false });
            localStorage.setItem('patio_pro_v12', JSON.stringify(db));
            
            doc.save(`Orcamento_${cliente}.pdf`);
            alert("PDF Gerado! Agora compartilhe o arquivo no WhatsApp.");
            location.reload();
        }

        function salvarEntrada() {
            const placa = document.getElementById('placa').value.toUpperCase();
            const fotosInput = document.getElementById('fotos').files;
            const fotos = [];
            const readerFinal = () => {
                db.push({
                    id: Date.now(), placa, 
                    cliente: document.getElementById('cliente').value.toUpperCase(),
                    modelo: document.getElementById('modelo').value.toUpperCase(),
                    obs: document.getElementById('obs').value,
                    entrada: new Date().toISOString(),
                    fotos, ativo: true, valor: 0
                });
                localStorage.setItem('patio_pro_v12', JSON.stringify(db));
                location.reload();
            };
            if(fotosInput.length === 0) return readerFinal();
            let lidos = 0;
            [...fotosInput].forEach(f => {
                const r = new FileReader();
                r.onload = e => { fotos.push(e.target.result); lidos++; if(lidos === fotosInput.length) readerFinal(); };
                r.readAsDataURL(f);
            });
        }

        function darSaida(id) {
            const v = db.find(x => x.id === id);
            const valor = Number(prompt("Valor Final R$:", 0));
            if(valor) {
                v.valor = valor; v.ativo = false; v.saida = new Date().toISOString();
                localStorage.setItem('patio_pro_v12', JSON.stringify(db));
                location.reload();
            }
        }

        function render() {
            const lp = document.getElementById('patio');
            const lh = document.getElementById('historico');
            const lb = document.getElementById('listaFaturamento');
            let ativos = 0, faturado = 0, mes = new Date().getMonth();
            lp.innerHTML = ""; lh.innerHTML = ""; lb.innerHTML = "";

            db.slice().reverse().forEach(v => {
                if(v.ativo) {
                    ativos++;
                    lp.innerHTML += `<div class="glass p-5 rounded-3xl">
                        <h3 class="text-xl font-black text-red-600 italic">${v.placa}</h3>
                        <p class="text-[10px] font-black opacity-50 uppercase">${v.cliente} • ${v.modelo}</p>
                        <div class="flex gap-2 mt-3 overflow-x-auto">${v.fotos.map(f => `<img src="${f}" class="w-20 h-20 rounded-xl object-cover">`).join("")}</div>
                        <button onclick="darSaida(${v.id})" class="btn-red mt-4">DAR SAÍDA</button>
                    </div>`;
                } else {
                    const htm = `<div class="glass p-4 rounded-2xl flex justify-between items-center opacity-70">
                        <div><p class="font-black text-xs">${v.placa || v.cliente}</p><p class="text-[8px] uppercase">${new Date(v.saida).toLocaleDateString()}</p></div>
                        <p class="font-black text-green-500 text-xs">R$ ${v.valor.toFixed(2)}</p>
                    </div>`;
                    lh.innerHTML += htm;
                    if(new Date(v.saida).getMonth() === mes) { faturado += v.valor; lb.innerHTML += htm; }
                }
            });
            document.getElementById('contador').innerText = `${ativos} Veículos`;
            document.getElementById('totalMes').innerText = faturado.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        }

        init();
    </script>
</body>
</html>
