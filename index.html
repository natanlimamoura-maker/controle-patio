<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PÁTIO PRO v9.0</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body { background:#050505; color:#fff; font-family:Inter,sans-serif }
.glass { background:rgba(18,18,18,.85); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.05) }
input,textarea { background:#0a0a0a; border:1px solid #222; color:white }
img { object-fit:cover }
.modal { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:999 }
</style>
</head>

<body class="pb-20">

<header class="p-5 sticky top-0 bg-black/80 backdrop-blur border-b border-white/5 flex justify-between">
<h1 class="font-black italic uppercase">PÁTIO<span class="text-red-600">PRO</span></h1>
<div id="contador" class="text-xs font-black text-red-500">0 NO PÁTIO</div>
</header>

<main class="p-4 max-w-lg mx-auto space-y-4">

<!-- MENU -->
<section id="menu" class="grid grid-cols-2 gap-4">
<button onclick="show('entrada')" class="glass p-6 rounded-3xl text-center">➕<p class="text-xs font-black mt-2">ENTRADA</p></button>
<button onclick="show('patio')" class="glass p-6 rounded-3xl text-center">🚗<p class="text-xs font-black mt-2">PÁTIO</p></button>
<button onclick="show('historico')" class="glass p-6 rounded-3xl text-center">📜<p class="text-xs font-black mt-2">HISTÓRICO</p></button>
<button onclick="show('balanco')" class="glass p-6 rounded-3xl text-center">💰<p class="text-xs font-black mt-2">BALANÇO</p></button>
</section>

<!-- ENTRADA -->
<section id="entrada" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>

<input id="cliente" placeholder="CLIENTE">
<input id="placa" placeholder="PLACA">
<input id="modelo" placeholder="MODELO DO VEÍCULO">

<input id="fotos" type="file" accept="image/*" multiple capture="environment">

<button onclick="salvarEntrada()" class="bg-red-600 w-full py-4 rounded-xl font-black">REGISTRAR ENTRADA</button>
</section>

<!-- PÁTIO -->
<section id="patio" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>
<div id="listaPatio" class="space-y-3"></div>
</section>

<!-- HISTÓRICO -->
<section id="historico" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>
<div id="listaHistorico" class="space-y-2"></div>
</section>

<!-- BALANÇO -->
<section id="balanco" class="hidden space-y-4">
<button onclick="show('menu')" class="text-xs">← Voltar</button>
<h2 id="totalMes" class="text-3xl font-black text-center">R$ 0,00</h2>
</section>

</main>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="glass p-6 rounded-3xl max-w-sm w-full space-y-3">
<h3 id="modalTitulo" class="font-black"></h3>
<div id="modalConteudo"></div>
<button onclick="fecharModal()" class="w-full bg-red-600 py-3 rounded-xl font-black">FECHAR</button>
</div>
</div>

<script>
const DB_KEY = "patio_pro_v9";
let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];

function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function salvarEntrada(){
const fotosInput = document.getElementById("fotos").files;
const fotos = [];

const readerPromises = [...fotosInput].map(file=>{
return new Promise(res=>{
const r = new FileReader();
r.onload=e=>res(e.target.result);
r.readAsDataURL(file);
});
});

Promise.all(readerPromises).then(imgs=>{
imgs.forEach(i=>fotos.push(i));

db.push({
id:Date.now(),
cliente:cliente.value.toUpperCase(),
placa:placa.value.toUpperCase(),
modelo:modelo.value.toUpperCase(),
entrada:new Date().toISOString(),
saida:null,
valor:0,
fotos,
ativo:true
});
saveDB();
render();
show("menu");
});
}

function render(){
const patio = document.getElementById("listaPatio");
const hist = document.getElementById("listaHistorico");
patio.innerHTML = hist.innerHTML = "";

let ativos = 0, totalMes = 0, mes = new Date().getMonth();

db.slice().reverse().forEach(v=>{
if(v.ativo){
ativos++;
patio.innerHTML+=`
<div class="glass p-4 rounded-2xl">
<p class="font-black">${v.placa}</p>
<p class="text-xs">${v.cliente} • ${v.modelo}</p>
<div class="flex gap-2 mt-2 overflow-x-auto">
${v.fotos.map(f=>`<img src="${f}" class="w-20 h-20 rounded-xl">`).join("")}
</div>
<button onclick="saida(${v.id})" class="mt-3 w-full bg-red-600 py-2 rounded-xl text-xs font-black">DAR SAÍDA</button>
</div>`;
}else{
hist.innerHTML+=`
<div class="glass p-3 rounded-xl flex justify-between">
<div>
<p class="font-black text-sm">${v.placa}</p>
<p class="text-xs">${new Date(v.saida).toLocaleDateString()}</p>
</div>
<p class="font-black text-green-500">R$ ${v.valor.toFixed(2)}</p>
</div>`;
if(new Date(v.saida).getMonth()===mes) totalMes+=v.valor;
}
});

contador.innerText = ativos+" NO PÁTIO";
totalMesEl = document.getElementById("totalMes");
if(totalMesEl) totalMesEl.innerText = totalMes.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function saida(id){
const valor = parseFloat(prompt("VALOR FINAL:","0"));
const v = db.find(x=>x.id===id);
v.ativo=false;
v.saida=new Date().toISOString();
v.valor=valor;
saveDB();
render();
}

render();
</script>
</body>
</html>
