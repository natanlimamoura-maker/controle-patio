<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/741/741407.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">

    <title>PÁTIO PRO v22.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: #111; border: 1px solid #222; border-radius: 25px; }
        input, textarea, select { background: #18181b !important; border: 1px solid #333 !important; color: #fff !important; border-radius: 15px; padding: 20px; font-size: 16px; width: 100%; appearance: none; }
        
        .btn-menu-full { width: 100%; height: 110px; background: #111; border: 1px solid #222; border-radius: 25px; display: flex; align-items: center; padding: 0 25px; gap: 20px; margin-bottom: 12px; }
        .btn-menu-full span { font-size: 35px; }
        .btn-menu-full p { font-size: 14px; font-weight: 900; text-transform: uppercase; }

        .btn-acao { background: #e11d48; color: white; font-weight: 900; padding: 22px; border-radius: 20px; width: 100%; text-transform: uppercase; font-size: 14px; }
        
        #preview-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .thumb-img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 2px solid #333; }

        .hidden { display: none !important; }
        label { font-size: 10px; font-weight: 900; color: #e11d48; text-transform: uppercase; margin-left: 5px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body class="pb-20">

    <header class="p-6 border-b border-white/5 sticky top-0 bg-black z-50">
        <h1 onclick="tab('menu')" class="text-2xl font-black italic cursor-pointer">PÁTIO<span class="text-rose-600">PRO</span></h1>
    </header>

    <main class="p-4 max-w-xl mx-auto">

        <section id="menu">
            <button onclick="openForm()" class="btn-menu-full">
                <span>📥</span>
                <div><p>Entrada de Veículo</p></div>
            </button>
            <button onclick="tab('patio')" class="btn-menu-full">
                <span>🏎️</span>
                <div><p>Veículos no Pátio</p><small id="c-patio" class="text-zinc-500 font-bold uppercase text-[9px]">0 veículos</small></div>
            </button>
            <button onclick="tab('historico')" class="btn-menu-full">
                <span>📖</span>
                <div><p>Histórico Geral</p></div>
            </button>
        </section>

        <section id="entrada" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black uppercase text-xs text-zinc-500 mb-4">Registro de Entrada</h2>
                
                <div>
                    <label>Data de Entrada</label>
                    <input type="date" id="data-entrada">
                </div>

                <input id="placa" placeholder="PLACA" class="text-center text-4xl font-black text-rose-600 uppercase">
                <input id="cliente" placeholder="NOME DO CLIENTE">
                <input id="modelo" placeholder="MARCA / MODELO">
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('in-cam').click()" class="bg-zinc-800 p-4 rounded-xl font-bold text-[10px]">📸 CÂMERA</button>
                    <button onclick="document.getElementById('in-gal').click()" class="bg-zinc-800 p-4 rounded-xl font-bold text-[10px]">🖼️ GALERIA</button>
                </div>
                <input type="file" id="in-cam" capture="camera" accept="image/*" class="hidden" multiple onchange="handleFiles(this.files)">
                <input type="file" id="in-gal" accept="image/*" class="hidden" multiple onchange="handleFiles(this.files)">

                <div id="preview-area" class="hidden">
                    <div id="preview-container"></div>
                </div>

                <button onclick="saveEntry()" class="btn-acao">Salvar Entrada</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4 text-center">Cancelar</button>
            </div>
        </section>

        <section id="saida-form" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black uppercase text-xs text-rose-600 mb-4">Finalizar Serviço</h2>
                
                <input id="saida-id" type="hidden">
                
                <div>
                    <label>Data de Saída</label>
                    <input type="date" id="data-saida">
                </div>

                <input id="saida-valor" type="number" placeholder="VALOR TOTAL (R$)">
                <textarea id="saida-relatorio" placeholder="O QUE FOI FEITO NO CARRO?" rows="4"></textarea>
                
                <button onclick="confirmCheckOut()" class="btn-acao">Confirmar e Finalizar</button>
                <button onclick="tab('patio')" class="w-full text-zinc-600 font-black text-xs uppercase py-4 text-center">Voltar</button>
            </div>
        </section>

        <section id="patio" class="hidden space-y-4">
            <div id="render-patio" class="space-y-4"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-6 text-center">Voltar</button>
        </section>

        <section id="historico" class="hidden space-y-3">
            <div id="render-hist" class="space-y-2"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-4 text-center">Voltar</button>
        </section>

    </main>

    <script>
        const DB_KEY = 'patiopro_v22';
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentPhotos = [];

        function tab(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            render();
        }

        function openForm() {
            tab('entrada');
            // Define data de hoje no padrão AAAA-MM-DD para o input date
            document.getElementById('data-entrada').value = new Date().toISOString().split('T')[0];
            document.getElementById('placa').value = "";
            document.getElementById('cliente').value = "";
            document.getElementById('modelo').value = "";
            document.getElementById('preview-container').innerHTML = "";
            currentPhotos = [];
        }

        async function handleFiles(files) {
            document.getElementById('preview-area').classList.remove('hidden');
            for (let file of files) {
                const b64 = await toBase64(file);
                currentPhotos.push(b64);
                const img = document.createElement('img');
                img.src = b64;
                img.className = "thumb-img";
                document.getElementById('preview-container').appendChild(img);
            }
        }

        function saveEntry() {
            const placa = document.getElementById('placa').value.toUpperCase();
            const dataE = document.getElementById('data-entrada').value.split('-').reverse().join('/'); // Formata para DD/MM/AAAA
            
            if(!placa) return alert('Insira a placa');

            data.push({ 
                id: Date.now(), 
                placa, 
                cliente: document.getElementById('cliente').value.toUpperCase(), 
                modelo: document.getElementById('modelo').value.toUpperCase(), 
                fotos: currentPhotos, 
                entrada: dataE, 
                ativo: true 
            });
            
            save(); tab('menu');
        }

        function startCheckOut(id) {
            tab('saida-form');
            document.getElementById('saida-id').value = id;
            document.getElementById('data-saida').value = new Date().toISOString().split('T')[0];
        }

        function confirmCheckOut() {
            const id = document.getElementById('saida-id').value;
            const dataS = document.getElementById('data-saida').value.split('-').reverse().join('/');
            const v = data.find(x => x.id == id);
            
            v.valor = parseFloat(document.getElementById('saida-valor').value || 0);
            v.relatorio = document.getElementById('saida-relatorio').value;
            v.saida = dataS;
            v.ativo = false;
            
            save(); tab('menu');
        }

        function render() {
            const lp = document.getElementById('render-patio');
            const lh = document.getElementById('render-hist');
            let a = 0; lp.innerHTML = ""; lh.innerHTML = "";

            data.slice().reverse().forEach(v => {
                if(v.ativo) {
                    a++; lp.innerHTML += `
                    <div class="glass p-6">
                        <div class="flex justify-between items-start">
                            <h3 class="text-3xl font-black text-rose-600">${v.placa}</h3>
                            <span class="text-[10px] font-black text-zinc-600">Entrada: ${v.entrada}</span>
                        </div>
                        <p class="text-[10px] font-bold text-zinc-500 uppercase">${v.cliente} | ${v.modelo}</p>
                        <div class="flex gap-2 my-4 overflow-x-auto">${v.fotos.map(img => `<img src="${img}" class="w-16 h-16 rounded-lg object-cover">`).join("")}</div>
                        <button onclick="startCheckOut(${v.id})" class="btn-acao py-3">Dar Saída</button>
                    </div>`;
                } else {
                    lh.innerHTML += `
                    <div class="glass p-4 border-l-4 border-emerald-500 mb-2">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-black text-rose-600">${v.placa}</span>
                            <span class="font-black text-emerald-500">R$ ${v.valor.toFixed(2)}</span>
                        </div>
                        <p class="text-[10px] text-zinc-400 mb-2 uppercase">${v.relatorio || 'Sem descrição'}</p>
                        <div class="flex justify-between text-[9px] font-bold text-zinc-600">
                            <span>ENTRADA: ${v.entrada}</span>
                            <span>SAÍDA: ${v.saida}</span>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('c-patio').innerText = `${a} veículos internos`;
        }

        const toBase64 = f => new Promise(res => { const rd = new FileReader(); rd.readAsDataURL(f); rd.onload = () => res(rd.result); });
        function save() { localStorage.setItem(DB_KEY, JSON.stringify(data)); }

        render();
    </script>
</body>
</html>
