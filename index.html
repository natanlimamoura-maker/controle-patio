<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/741/741407.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">

    <title>PÁTIO PRO v25.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: #111; border: 1px solid #222; border-radius: 25px; }
        input, textarea, select { background: #18181b !important; border: 1px solid #333 !important; color: #fff !important; border-radius: 15px; padding: 18px; font-size: 16px; width: 100%; appearance: none; }
        
        /* BOTÕES GIGANTES FULL TELA */
        .btn-menu-full { 
            width: 100%; 
            height: 150px; 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 30px; 
            display: flex; 
            align-items: center; 
            padding: 0 30px; 
            gap: 30px; 
            margin-bottom: 15px; 
        }
        .btn-menu-full .icon-huge { font-size: 70px; } 
        .btn-menu-full p { font-size: 20px; font-weight: 900; text-transform: uppercase; color: #fff; line-height: 1; }
        .btn-menu-full small { font-size: 11px; color: #666; font-weight: 800; text-transform: uppercase; margin-top: 5px; display: block; }

        .btn-acao { background: #e11d48; color: white; font-weight: 900; padding: 22px; border-radius: 20px; width: 100%; text-transform: uppercase; font-size: 14px; }
        .btn-wpp { background: #25D366; color: white; font-weight: 900; padding: 22px; border-radius: 20px; width: 100%; text-transform: uppercase; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        #preview-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .thumb-img { width: 80px; height: 80px; object-fit: cover; border-radius: 15px; border: 2px solid #e11d48; flex-shrink: 0; }

        .hidden { display: none !important; }
        label { font-size: 10px; font-weight: 900; color: #e11d48; text-transform: uppercase; margin-bottom: 5px; display: block; padding-left: 5px; }
        .date-badge { font-size: 9px; font-weight: 900; color: #555; text-transform: uppercase; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 border-b border-white/5 sticky top-0 bg-black z-50 flex justify-between items-center">
        <h1 onclick="tab('menu')" class="text-2xl font-black italic cursor-pointer">PÁTIO<span class="text-rose-600">PRO</span></h1>
        <button onclick="tab('ajustes')" class="text-2xl">⚙️</button>
    </header>

    <main class="p-4 max-w-xl mx-auto">

        <section id="menu">
            <button onclick="openForm()" class="btn-menu-full">
                <span class="icon-huge">📥</span>
                <div><p>Nova Entrada</p><small>Registrar veículo</small></div>
            </button>
            <button onclick="tab('patio')" class="btn-menu-full">
                <span class="icon-huge">🏎️</span>
                <div><p>Pátio</p><small id="c-patio">0 internos</small></div>
            </button>
            <button onclick="tab('orcamento')" class="btn-menu-full">
                <span class="icon-huge">📋</span>
                <div><p>Orçamentos</p><small>Gerar para WhatsApp</small></div>
            </button>
            <button onclick="tab('historico')" class="btn-menu-full">
                <span class="icon-huge">📖</span>
                <div><p>Histórico</p><small>Relatórios antigos</small></div>
            </button>
        </section>

        <section id="entrada" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black uppercase text-xs text-zinc-500">Ficha de Entrada</h2>
                <div><label>Data de Entrada</label><input type="date" id="data-entrada"></div>
                <input id="placa" placeholder="PLACA" class="text-center text-4xl font-black text-rose-600 uppercase">
                <input id="cliente" placeholder="NOME DO CLIENTE">
                <input id="modelo" placeholder="MARCA / MODELO">
                <textarea id="obs" placeholder="OBSERVAÇÕES (OPCIONAL)" rows="2"></textarea>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('in-cam').click()" class="bg-zinc-800 p-4 rounded-xl font-bold text-[10px]">📸 CÂMERA</button>
                    <button onclick="document.getElementById('in-gal').click()" class="bg-zinc-800 p-4 rounded-xl font-bold text-[10px]">🖼️ GALERIA</button>
                </div>
                <input type="file" id="in-cam" capture="camera" accept="image/*" class="hidden" multiple onchange="handleFiles(this.files)">
                <input type="file" id="in-gal" accept="image/*" class="hidden" multiple onchange="handleFiles(this.files)">

                <div id="preview-area" class="hidden">
                    <p class="text-[9px] font-black text-zinc-600 uppercase">Fotos Selecionadas:</p>
                    <div id="preview-container"></div>
                </div>

                <button onclick="saveEntry()" class="btn-acao">Salvar Registro</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4 text-center">Cancelar</button>
            </div>
        </section>

        <section id="patio" class="hidden space-y-4">
            <div id="render-patio" class="space-y-4"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-6 text-center">Voltar ao Menu</button>
        </section>

        <section id="orcamento" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black uppercase text-xs text-rose-600">Novo Orçamento</h2>
                <input id="orc-cliente" placeholder="Nome do Cliente">
                <input id="orc-fone" placeholder="WhatsApp (DDD+Número)">
                <input id="orc-veiculo" placeholder="Veículo / Placa">
                <div id="orc-itens" class="space-y-2">
                    <div class="flex gap-2 row-item">
                        <input class="flex-1 n-i" placeholder="Serviço/Peça">
                        <input class="w-24 v-i" type="number" placeholder="R$" oninput="calcTotal()">
                    </div>
                </div>
                <button onclick="addRow()" class="text-zinc-500 text-[10px] font-black uppercase">+ Adicionar Item</button>
                <div class="pt-2 text-right"><span class="font-black text-2xl text-emerald-500" id="orc-total">R$ 0,00</span></div>
                <button onclick="pdfOrc()" class="btn-wpp">Enviar Orçamento WhatsApp</button>
                <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase py-4 text-center">Voltar</button>
            </div>
        </section>

        <section id="saida-form" class="hidden space-y-4">
            <div class="glass p-6 space-y-4">
                <h2 class="text-center font-black uppercase text-xs text-rose-600">Finalizar Serviço</h2>
                <input id="saida-id" type="hidden">
                <div><label>Data de Saída</label><input type="date" id="data-saida"></div>
                <input id="saida-valor" type="number" placeholder="VALOR TOTAL (R$)">
                <textarea id="saida-relatorio" placeholder="O QUE FOI FEITO NO VEÍCULO?" rows="4"></textarea>
                <button onclick="confirmCheckOut()" class="btn-acao">Confirmar e Finalizar</button>
                <button onclick="tab('patio')" class="w-full text-zinc-600 font-black text-xs uppercase py-4 text-center">Cancelar</button>
            </div>
        </section>

        <section id="historico" class="hidden space-y-3">
            <div id="render-hist" class="space-y-2"></div>
            <button onclick="tab('menu')" class="w-full text-zinc-600 font-black text-xs uppercase p-4 text-center">Voltar</button>
        </section>

        <section id="ajustes" class="hidden space-y-4">
            <div class="glass p-8 space-y-6 text-center">
                <input id="cfg-name" placeholder="NOME DA OFICINA">
                <button onclick="saveCfg()" class="btn-acao">Salvar Nome</button>
                <button onclick="reset()" class="text-xs text-rose-900 font-black uppercase">Zerar Tudo</button>
            </div>
        </section>

    </main>

    <script>
        const DB_KEY = 'patiopro_v25';
        let data = JSON.parse(localStorage.getItem(DB_KEY))
