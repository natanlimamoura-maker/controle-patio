<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">

    <title>PÁTIO PRO v16.5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { 
            background:#050505; 
            color:#fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color:transparent;
            user-select: none;
        }
        .glass { 
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        input, textarea { 
            background:#111 !important; 
            border:1px solid #333 !important; 
            color:#fff !important; 
            outline:none; 
            width:100%; 
            padding:12px; 
            border-radius:12px; 
            font-size:16px; /* Evita zoom no iPhone */
        }
        .btn-red { 
            background: #dc2626; 
            color:white; 
            font-weight:800; 
            padding:16px; 
            border-radius:14px; 
            width:100%; 
            text-transform:uppercase; 
            font-size:13px; 
            letter-spacing:1px;
        }
        .btn-back { color: #666; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; display: block; }
        .hidden { display: none !important; }
        #bloqueio { position:fixed; inset:0; background:#000; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
        .media-btn { background: #151515; border: 1px solid #222; padding: 20px; border-radius: 16px; text-align: center; width: 100%; }
    </style>
</head>
<body class="pb-10">

    <div id="bloqueio">
        <h2 class="text-red-600 font-black text-2xl mb-6">SISTEMA BLOQUEADO</h2>
        <input id="chave-ativacao" type="password" placeholder="SENHA" class="text-center mb-4">
        <button onclick="verificarChave()" class="btn-red">Ativar</button>
    </div>

    <header class="p-5 sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-white/5 flex justify-between items-center">
        <h1 onclick="location.reload()" class="font-black italic text-xl">PÁTIO<span class="text-red-600">PRO</span></h1>
        <button onclick="abrirAba('ajustes')" class="text-xl">⚙️</button>
    </header>

    <main class="p-4 max-w-lg mx-auto">

        <section id="menu" class="grid grid-cols-2 gap-3">
            <button onclick="abrirAba('entrada')" class="glass p-8 rounded-3xl flex flex-col items-center">
                <span class="text-3xl mb-2">➕</span>
                <span class="text-[10px] font-black uppercase text-zinc-400">Entrada</span>
            </button>
            <button onclick="abrirAba('patio')" class="glass p-8 rounded-3xl flex flex-col items-center relative border-b-2 border-red-600">
                <span class="text-3xl mb-2">🚗</span>
                <span class="text-[10px] font-black uppercase text-zinc-400">Pátio</span>
                <div id="cont-patio" class="absolute top-3 right-3 bg-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0</div>
            </button>
            <button onclick="abrirAba('orcamento')" class="glass p-8 rounded-3xl flex flex-col items-center">
                <span class="text-3xl mb-2">📄</span>
                <span class="text-[10px] font-black uppercase text-zinc-400">Orçamento</span>
            </button>
            <button onclick="abrirAba('historico')" class="glass p-8 rounded-3xl flex flex-col items-center">
                <span class="text-3xl mb-2">📜</span>
                <span class="text-[10px] font-black uppercase text-zinc-400">Histórico</span>
            </button>
            <button onclick="abrirAba('balanco')" class="glass p-8 rounded-3xl col-span-2 flex flex-col items-center border border-green-900/30">
                <span class="text-3xl mb-1">💰</span>
                <span class="text-[10px] font-black uppercase text-green-500">Balanço Financeiro</span>
            </button>
        </section>

        <section id="entrada" class="hidden">
            <button onclick="abrirAba('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-5 rounded-3xl space-y-3">
                <input id="placa" placeholder="PLACA" class="text-center text-2xl font-black text-red-600 uppercase">
                <input id="cliente" placeholder="Nome do Cliente">
                <input id="modelo" placeholder="Veículo">
                <textarea id="obs" placeholder="Avarias/Observações"></textarea>
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="document.getElementById('f-cam').click()" class="media-btn">📸<br><span class="text-[9px] font-black uppercase">Câmera</span></button>
                    <button onclick="document.getElementById('f-gal').click()" class="media-btn">🖼️<br><span class="text-[9px] font-black uppercase">Galeria</span></button>
                </div>
                <input type="file" id="f-cam" accept="image/*" capture="camera" class="hidden" multiple onchange="contarFotos()">
                <input type="file" id="f-gal" accept="image/*" class="hidden" multiple onchange="contarFotos()">
                <p id="txt-fotos" class="text-[10px] text-center text-zinc-500 font-bold uppercase"></p>

                <button onclick="salvarEntrada()" class="btn-red">Registrar Veículo</button>
            </div>
        </section>

        <section id="orcamento" class="hidden">
            <button onclick="abrirAba('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-5 rounded-3xl space-y-3">
                <input id="o-cliente" placeholder="Cliente">
                <input id="o-modelo" placeholder="Veículo / Placa">
                <div id="itens-servico" class="space-y-2">
                    <div class="flex gap-2">
                        <input class="flex-1 it-n" placeholder="Serviço">
                        <input class="w-24 it-v" type="number" placeholder="R$" oninput="calcOrc()">
                    </div>
                </div>
                <button onclick="addItem()" class="text-[10px] font-black text-zinc-500 uppercase">+ Item</button>
                <div class="pt-2 border-t border-white/5 flex justify-between">
                    <span class="text-xs font-bold">TOTAL</span>
                    <span id="o-total" class="font-black text-green-500">R$ 0,00</span>
                </div>
                <button onclick="gerarPDF()" class="btn-red">Salvar PDF</button>
            </div>
        </section>

        <section id="patio" class="hidden"><button onclick="abrirAba('menu')" class="btn-back">← Voltar</button><div id="listPatio" class="space-y-3"></div></section>
        <section id="historico" class="hidden"><button onclick="abrirAba('menu')" class="btn-back">← Voltar</button><div id="listHist" class="space-y-2"></div></section>
        <section id="balanco" class="hidden">
            <button onclick="abrirAba('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-8 rounded-3xl text-center mb-4 border-t-4 border-green-600">
                <p class="text-[10px] font-black text-zinc-500 uppercase">Mensal</p>
                <h2 id="fatMes" class="text-3xl font-black">R$ 0,00</h2>
            </div>
            <div id="listFat" class="space-y-2"></div>
        </section>

        <section id="ajustes" class="hidden">
            <button onclick="abrirAba('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-6 rounded-3xl space-y-4">
                <input id="cfg-nome" placeholder="Nome da Oficina">
                <button onclick="salvarConfig()" class="btn-red">Salvar</button>
                <button onclick="exportar()" class="w-full text-[10px] font-black py-4 bg-white/5 rounded-xl">EXPORTAR BACKUP</button>
                <button onclick="zerar()" class="w-full text-zinc-800 text-[9px] font-black uppercase">Zerar Tudo</button>
            </div>
        </section>

    </main>

    <script>
        const KEY = 'patio_pro_master_v13';
        let db = JSON.parse(localStorage.getItem(KEY)) || [];
        let cfg = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO", exp: new Date().getTime() + (30*24*60*60*1000) };

        function abrirAba(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function contarFotos() {
            const c = document.getElementById('f-cam').files.length + document.getElementById('f-gal').files.length;
            document.getElementById('txt-fotos').innerText = c + " Foto(s) selecionada(s)";
        }

        function salvarEntrada() {
            const p = document.getElementById('placa').value.toUpperCase();
            if(!p) return alert("Placa?");
            
            const files = [...document.getElementById('f-cam').files, ...document.getElementById('f-gal').files];
            const fotos = [];
            
            if(files.length === 0) {
                finalizar(fotos);
            } else {
                let lidos = 0;
                files.forEach(f => {
                    const r = new FileReader();
                    r.onload = e => { fotos.push(e.target.result); lidos++; if(lidos === files.length) finalizar(fotos); };
                    r.readAsDataURL(f);
                });
            }

            function finalizar(fotosArr) {
                db.push({ id: Date.now(), placa: p, cliente: document.getElementById('cliente').value.toUpperCase(), modelo: document.getElementById('modelo').value.toUpperCase(), obs: document.getElementById('obs').value, fotos: fotosArr, entrada: new Date().toISOString(), ativo: true, valor: 0 });
                localStorage.setItem(KEY, JSON.stringify(db));
                location.reload();
            }
        }

        function render() {
            const lp = document.getElementById('listPatio'); const lh = document.getElementById('listHist'); const lf = document.getElementById('listFat');
            let a = 0, f = 0, mes = new Date().getMonth();
            lp.innerHTML = ""; lh.innerHTML = ""; lf.innerHTML = "";

            db.slice().reverse().forEach(v => {
                if(v.ativo) {
                    a++; lp.innerHTML += `<div class="glass p-5 rounded-3xl"><h3 class="text-xl font-black text-red-600">${v.placa}</h3><p class="text-[10px] font-bold text-zinc-500 uppercase">${v.cliente}</p><div class="flex gap-2 my-3 overflow-x-auto">${v.fotos.map(i => `<img src="${i}" class="w-16 h-16 rounded-lg object-cover">`).join("")}</div><button onclick="darSaida(${v.id})" class="btn-red py-3">Dar Saída</button></div>`;
                } else {
                    const h = `<div class="glass p-3 rounded-xl flex justify-between text-xs mb-1"><span>${v.placa || v.cliente}</span><span class="text-green-500 font-bold">R$ ${v.valor.toFixed(2)}</span></div>`;
                    lh.innerHTML += h;
                    if(new Date(v.saida).getMonth() === mes) { f += v.valor; lf.innerHTML += h; }
                }
            });
            document.getElementById('cont-patio').innerText = a;
            document.getElementById('fatMes').innerText = f.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        }

        function darSaida(id) {
            const v = db.find(x => x.id === id); const val = Number(prompt("Valor:", 0));
            if(val) { v.valor = val; v.ativo = false; v.saida = new Date().toISOString(); localStorage.setItem(KEY, JSON.stringify(db)); render(); }
        }

        function addItem() {
            const d = document.createElement('div'); d.className = "flex gap-2";
            d.innerHTML = `<input class="flex-1 it-n" placeholder="Serviço"><input class="w-24 it-v" type="number" placeholder="R$" oninput="calcOrc()">`;
            document.getElementById('itens-servico').appendChild(d);
        }

        function calcOrc() {
            let t = 0; document.querySelectorAll('.it-v').forEach(i => t += (Number(i.value) || 0));
            document.getElementById('o-total').innerText = t.toLocaleString('pt-br', {style:'currency', currency:'BRL'});
            return t;
        }

        function gerarPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("ORÇAMENTO - " + cfg.nome, 10, 20);
            doc.text("Cliente: " + document.getElementById('o-cliente').value, 10, 30);
            doc.save("orc.pdf");
        }

        function verificarChave() { if(document.getElementById('chave-ativacao').value === "meuapp") { cfg.exp = new Date().getTime() + (30*24*60*60*1000); localStorage.setItem('patio_config', JSON.stringify(cfg)); location.reload(); } }
        function salvarConfig() { cfg.nome = document.getElementById('cfg-nome').value.toUpperCase(); localStorage.setItem('patio_config', JSON.stringify(cfg)); location.reload(); }
        function zerar() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }
        function exportar() { const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db)); a.download = "backup.json"; a.click(); }

        if (new Date().getTime() > cfg.exp) document.getElementById('bloqueio').style.display='flex';
        document.getElementById('header-nome').innerText = cfg.nome;
        render();
    </script>
</body>
</html>
