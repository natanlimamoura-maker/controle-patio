<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>PÁTIO PRO v4.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ef4444; }
        body { background-color: #050505; color: #f4f4f5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .glass { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .page-transition { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        input, select, textarea { background: #111 !important; border: 1px solid #222 !important; color: white !important; outline: none; }
        .menu-card { background: linear-gradient(145deg, #111, #080808); border: 1px solid #222; transition: all 0.2s; }
        .menu-card:active { transform: scale(0.95); background: #1a1a1a; }
        .btn-voltar { font-size: 10px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-40 bg-[#050505]/90 backdrop-blur-lg border-b border-white/5 flex justify-between items-center">
        <div id="header-voltar" class="hidden">
            <button onclick="irParaMenu()" class="btn-voltar flex items-center gap-2">
                <span class="text-lg">←</span> VOLTAR
            </button>
        </div>
        <div id="header-logo">
            <h1 class="text-xl font-black tracking-tighter italic uppercase leading-none">PÁTIO<span class="text-red-500">PRO</span></h1>
        </div>
        <div id="contador" class="bg-red-600/10 border border-red-500/20 text-red-500 text-[10px] font-black px-4 py-2 rounded-full uppercase">0 Ativos</div>
    </header>

    <main class="p-5 max-w-lg mx-auto">
        
        <section id="aba-menu" class="page-transition space-y-6 pt-4">
            <div class="glass p-8 rounded-[2.5rem] text-center mb-8 border-b-4 border-red-600 shadow-2xl">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.3em] mb-2">Painel de Controle</p>
                <h2 class="text-3xl font-black italic uppercase leading-none">SISTEMA DE<br><span class="text-red-500">OFICINA</span></h2>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="trocarAba('entrada')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center">
                    <span class="text-3xl mb-3">➕</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Nova Entrada</span>
                </button>
                <button onclick="trocarAba('patio')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center relative">
                    <span class="text-3xl mb-3">🚛</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Pátio Atual</span>
                </button>
                <button onclick="trocarAba('historico')" class="menu-card p-6 rounded-[2rem] flex flex-col items-center">
                    <span class="text-3xl mb-3">📜</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Relatórios</span>
                </button>
                <button onclick="limparTudo()" class="menu-card p-6 rounded-[2rem] flex flex-col items-center opacity-30">
                    <span class="text-3xl mb-3">🧹</span>
                    <span class="text-[10px] font-black uppercase tracking-widest">Limpar BD</span>
                </button>
            </div>
        </section>

        <section id="aba-patio" class="hidden page-transition space-y-4">
            <input id="buscaPlacaPatio" type="text" onkeyup="renderizar()" placeholder="BUSCAR PLACA NO PÁTIO..." class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
            <div id="lista-patio" class="space-y-4"></div>
        </section>

        <section id="aba-entrada" class="hidden page-transition">
            <div class="glass p-6 rounded-[2rem] space-y-6 shadow-2xl border border-white/10">
                <h2 id="titulo-form" class="text-lg font-black uppercase italic text-center text-red-500">Registro de Veículo</h2>
                <div class="space-y-4">
                    <input id="placa" type="text" placeholder="PLACA" class="w-full p-4 rounded-2xl font-black text-xl text-red-500 uppercase">
                    <input id="modelo" type="text" placeholder="MODELO / MARCA" class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
                    <input id="nomeCliente" type="text" placeholder="NOME DO CLIENTE" class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
                    <input id="dataEntrada" type="date" class="w-full p-4 rounded-2xl text-xs font-bold">
                </div>
                <div class="pt-2 relative">
                    <input id="fotoInput" type="file" accept="image/*" class="hidden">
                    <button id="btn-remover-foto" onclick="removerFoto()" class="hidden absolute top-4 right-4 z-20 bg-red-600 text-white p-2 rounded-full text-[8px] font-black shadow-lg">✕ REMOVER</button>
                    <label id="label-foto" for="fotoInput" class="flex flex-col items-center justify-center p-12 border-2 border-dashed border-zinc-800 rounded-3xl bg-black/40">
                        <span class="text-4xl mb-2">📸</span>
                        <span class="text-[9px] font-black uppercase text-zinc-500 text-center">Tirar Foto ou Galeria</span>
                    </label>
                    <canvas id="canvasPreview" class="hidden mt-4 mx-auto border border-white/5 rounded-2xl shadow-2xl"></canvas>
                </div>
                <button onclick="salvarRegistro()" class="w-full bg-red-600 text-white font-black py-5 rounded-2xl uppercase text-xs tracking-widest shadow-xl active:scale-95 transition-all">Salvar Dados</button>
            </div>
        </section>

        <section id="aba-historico" class="hidden page-transition space-y-4">
            <input id="buscaPlacaHist" type="text" onkeyup="renderizar()" placeholder="BUSCAR NO HISTÓRICO..." class="w-full p-4 rounded-2xl text-xs font-bold uppercase">
            <div id="lista-historico" class="space-y-3"></div>
        </section>
    </main>

    <div id="modal-relatorio" class="hidden fixed inset-0 bg-black z-[100] overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <button onclick="fecharRelatorio()" class="text-[10px] font-black text-zinc-500 uppercase">← Fechar</button>
            <h2 class="text-red-500 font-black italic uppercase">Relatório Detalhado</h2>
        </div>
        <div id="conteudo-relatorio" class="space-y-6 max-w-lg mx-auto pb-10"></div>
    </div>

    <div id="modal-saida" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-[60] backdrop-blur-md">
        <div class="glass p-8 rounded-[3rem] w-full max-w-sm border border-red-500/20">
            <h3 class="font-black text-xl mb-6 text-center italic text-red-500">CONCLUIR SERVIÇO</h3>
            <textarea id="servicoRealizado" class="w-full p-5 rounded-2xl h-44 text-sm font-medium mb-6 uppercase border-white/10" placeholder="O QUE FOI FEITO NO VEÍCULO?"></textarea>
            <div class="flex flex-col gap-3">
                <button onclick="confirmarSaida()" class="w-full bg-red-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg">Finalizar e Arquivar</button>
                <button onclick="fecharModal()" class="w-full text-zinc-500 font-bold text-[10px] uppercase p-2">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('controle_patio_db')) || [];
        let fotoFinal = "";
        let idSelecionado = null;
        let modoEdicao = false;
        let idEdicao = null;

        // CONTROLE DE IMAGEM
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvasPreview');
                    const ctx = canvas.getContext('2d');
                    let max = 800;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > max) { h *= max / w; w = max; } }
                    else { if (h > max) { w *= max / h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    fotoFinal = canvas.toDataURL('image/jpeg', 0.5);
                    canvas.classList.remove('hidden');
                    document.getElementById('label-foto').classList.add('hidden');
                    document.getElementById('btn-remover-foto').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function removerFoto() {
            fotoFinal = "";
            document.getElementById('fotoInput').value = "";
            document.getElementById('canvasPreview').classList.add('hidden');
            document.getElementById('label-foto').classList.remove('hidden');
            document.getElementById('btn-remover-foto').classList.add('hidden');
        }

        // SALVAR / EDITAR
        function salvarRegistro() {
            const placa = document.getElementById('placa').value.toUpperCase();
            if(!placa || !fotoFinal) return alert("ERRO: Placa e Foto são obrigatórios!");

            const dados = {
                id: modoEdicao ? idEdicao : Date.now(),
                cliente: document.getElementById('nomeCliente').value,
                modelo: document.getElementById('modelo').value,
                placa: placa,
                dataEntrada: document.getElementById('dataEntrada').value,
                foto: fotoFinal,
                status: modoEdicao ? db.find(x => x.id === idEdicao).status : 'Diagnóstico',
                ativo: true
            };

            if(modoEdicao) {
                const idx = db.findIndex(x => x.id === idEdicao);
                db[idx] = dados;
            } else {
                db.push(dados);
            }

            localStorage.setItem('controle_patio_db', JSON.stringify(db));
            location.reload();
        }

        // NAVEGAÇÃO
        function irParaMenu() {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('aba-menu').classList.remove('hidden');
            document.getElementById('header-voltar').classList.add('hidden');
            document.getElementById('header-logo').classList.remove('hidden');
            modoEdicao = false;
        }

        function trocarAba(aba) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('aba-' + aba).classList.remove('hidden');
            document.getElementById('header-voltar').classList.remove('hidden');
            document.getElementById('header-logo').classList.add('hidden');
            renderizar();
        }

        // RENDERIZAÇÃO E BUSCA
        function renderizar() {
            const buscaP = document.getElementById('buscaPlacaPatio').value.toUpperCase();
            const buscaH = document.getElementById('buscaPlacaHist').value.toUpperCase();
            const containerPatio = document.getElementById('lista-patio');
            const containerHist = document.getElementById('lista-historico');
            
            containerPatio.innerHTML = ""; containerHist.innerHTML = "";
            let ativos = 0;

            db.slice().reverse().forEach(v => {
                if(v.ativo) {
                    if (buscaP !== "" && !v.placa.includes(buscaP)) return;
                    ativos++;
                    containerPatio.innerHTML += `
                        <div class="glass rounded-[2rem] overflow-hidden page-transition border-l-4 border-red-600">
                            <div class="flex p-4 gap-4">
                                <img src="${v.foto}" class="w-20 h-20 object-cover rounded-2xl">
                                <div class="flex-1">
                                    <div class="flex justify-between items-start">
                                        <h3 class="text-xl font-black italic text-white uppercase leading-none">${v.placa}</h3>
                                        <div class="flex gap-4">
                                            <button onclick="prepararEdicao(${v.id})" class="text-xs">✏️</button>
                                            <button onclick="excluirRegistro(${v.id})" class="text-xs">🗑️</button>
                                        </div>
                                    </div>
                                    <p class="text-[9px] font-bold text-zinc-500 uppercase mt-1 mb-2">${v.modelo || 'VEÍCULO'}</p>
                                    <select onchange="atualizarStatus(${v.id}, this.value)" class="w-full bg-black border border-white/5 rounded-lg p-2 text-[9px] font-black text-red-500 uppercase">
                                        <option value="Diagnóstico" ${v.status=='Diagnóstico'?'selected':''}>Diagnóstico</option>
                                        <option value="Manutenção" ${v.status=='Manutenção'?'selected':''}>Manutenção</option>
                                        <option value="Finalizado" ${v.status=='Finalizado'?'selected':''}>Finalizado</option>
                                    </select>
                                </div>
                            </div>
                            <button onclick="abrirSaida(${v.id})" class="w-full bg-red-600/5 text-zinc-400 py-3 text-[8px] font-black uppercase tracking-widest border-t border-white/5">Registrar Saída</button>
                        </div>
                    `;
                } else {
                    if (buscaH !== "" && !v.placa.includes(buscaH)) return;
                    containerHist.innerHTML += `
                        <div onclick="verRelatorio(${v.id})" class="glass p-5 rounded-2xl flex justify-between items-center active:scale-95 transition-all">
                            <div>
                                <p class="font-black text-white italic text-base uppercase leading-none">${v.placa}</p>
                                <p class="text-[8px] text-zinc-500 font-bold uppercase mt-1">Saída: ${v.dataSaida}</p>
                            </div>
                            <span class="text-red-500 text-[10px] font-black uppercase">VER DADOS →</span>
                        </div>
                    `;
                }
            });
            document.getElementById('contador').innerText = `${ativos} Ativos`;
        }

        // FUNÇÃO DE RELATÓRIO CORRIGIDA
        function verRelatorio(id) {
            const v = db.find(x => x.id === id);
            if(!v) return;
            const container = document.getElementById('conteudo-relatorio');
            container.innerHTML = `
                <img src="${v.foto}" class="w-full h
