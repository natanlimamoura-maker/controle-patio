<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 20px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800">

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-3xl flex justify-between items-center">
        <h1 class="text-xl font-black italic uppercase">PÁTIO PRO CLOUD</h1>
        <div id="indicador-drive" class="h-3 w-3 rounded-full bg-red-500 shadow-[0_0_8px_red]"></div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <input type="text" id="busca-placa" onkeyup="buscarPlaca()" placeholder="🔍 PESQUISAR PLACA" class="w-full p-5 rounded-3xl border-none shadow-md font-black uppercase text-center mb-6 outline-none focus:ring-4 ring-blue-200">

        <section id="aba-entrada" class="tab-content active">
            <form id="form-patio" class="bg-white p-6 rounded-3xl shadow-xl space-y-4">
                <div class="flex justify-between items-center text-[10px] font-black text-gray-400 uppercase">
                    <span>Novo Veículo</span>
                    <span id="proxima-os" class="text-blue-600">OS: #001</span>
                </div>
                <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl text-2xl text-center font-black uppercase outline-none">
                <input type="text" id="modelo" placeholder="MODELO / CLIENTE" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                
                <div id="previa" class="grid grid-cols-4 gap-2 hidden"></div>
                
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex flex-col items-center justify-center border-2 border-dashed border-blue-200 p-4 rounded-2xl text-blue-600 bg-blue-50 cursor-pointer">
                        <span class="text-[10px] font-black">FOTO</span>
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="compactar(this)">
                    </label>
                    <button type="submit" class="bg-blue-600 text-white font-black rounded-2xl uppercase text-xs">Registar</button>
                </div>
            </form>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-config" class="tab-content">
            <div class="bg-white p-8 rounded-3xl shadow-xl text-center space-y-6">
                <div class="inline-block p-4 bg-blue-50 rounded-full text-4xl">⚙️</div>
                <h2 class="font-black text-xl italic">CONFIGURAÇÕES</h2>
                
                <div class="border-t pt-6">
                    <p class="text-sm text-gray-500 mb-4">Estado da Nuvem (Google Drive):</p>
                    
                    <div id="status-offline" class="space-y-4">
                        <div class="p-4 bg-red-50 text-red-600 rounded-2xl font-bold text-xs uppercase">
                            Drive não conectado
                        </div>
                        <button onclick="loginGoogle()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase shadow-lg">LIGAR O MEU DRIVE</button>
                    </div>

                    <div id="status-online" class="hidden space-y-4">
                        <div class="p-4 bg-green-50 text-green-700 rounded-2xl font-bold text-xs uppercase border-2 border-green-200">
                            ✓ Backup em Tempo Real Ativo
                        </div>
                        <p class="text-[10px] text-gray-400">Os dados desta oficina estão a ser salvos na sua conta Google pessoal.</p>
                        <button onclick="location.reload()" class="w-full bg-gray-100 text-gray-500 p-3 rounded-2xl font-bold text-[10px]">SAIR / TROCAR CONTA</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="resultado-busca" class="mt-4 space-y-4"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-20 z-50">
        <button onclick="mudarAba('entrada')" class="nav-button active flex-1 flex flex-col items-center"><span>➕</span><span class="text-[8px] font-bold">ENTRADA</span></button>
        <button onclick="mudarAba('patio')" class="nav-button flex-1 flex flex-col items-center"><span>🚗</span><span class="text-[8px] font-bold">PÁTIO</span></button>
        <button onclick="mudarAba('config')" class="nav-button flex-1 flex flex-col items-center"><span>⚙️</span><span class="text-[8px] font-bold">AJUSTES</span></button>
    </nav>

    <script>
        const CLIENT_ID = "317001427708-1rglariag6m8l4vi4a19noduuuk2dg6b.apps.googleusercontent.com";
        let db = JSON.parse(localStorage.getItem('patio_db')) || [];
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { os_counter: 1 };
        let googleToken = null;
        let fotosTemp = [];

        function mudarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            event.currentTarget.classList.add('active');
            if(aba === 'patio') renderizarPatio();
            document.getElementById('resultado-busca').innerHTML = '';
        }

        function loginGoogle() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (response) => {
                    googleToken = response.access_token;
                    document.getElementById('status-offline').classList.add('hidden');
                    document.getElementById('status-online').classList.remove('hidden');
                    document.getElementById('indicador-drive').classList.replace('bg-red-500', 'bg-green-500');
                    document.getElementById('indicador-drive').classList.replace('shadow-[0_0_8px_red]', 'shadow-[0_0_8px_green]');
                    alert("Drive conectado! Os dados serão salvos na sua conta.");
                },
            });
            client.requestAccessToken();
        }

        function compactar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 300;
                        canvas.height = img.height * (300 / img.width);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.2);
                        fotosTemp.push(base64);
                        document.getElementById('previa').classList.remove('hidden');
                        document.getElementById('previa').innerHTML += `<img src="${base64}" class="h-12 w-full object-cover rounded shadow">`;
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('form-patio').onsubmit = function(e) {
            e.preventDefault();
            const novo = {
                id: Date.now(),
                os: config.os_counter.toString().padStart(3, '0'),
                placa: document.getElementById('placa').value.toUpperCase(),
                modelo: document.getElementById('modelo').value.toUpperCase(),
                fotos: [...fotosTemp],
                data: new Date().toLocaleDateString('pt-PT')
            };
            patio.unshift(novo);
            db.unshift(novo);
            config.os_counter++;
            localStorage.setItem('patio_data', JSON.stringify(patio));
            localStorage.setItem('patio_db', JSON.stringify(db));
            localStorage.setItem('patio_config', JSON.stringify(config));
            
            alert("Veículo Registado!");
            this.reset();
            fotosTemp = [];
            document.getElementById('previa').innerHTML = '';
            document.getElementById('previa').classList.add('hidden');
            document.getElementById('proxima-os').innerText = "OS: #" + config.os_counter.toString().padStart(3, '0');
        };

        function renderizarPatio() {
            const lista = document.getElementById('lista-veiculos');
            lista.innerHTML = '';
            patio.forEach(v => {
                lista.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-md border flex gap-4 items-center">
                    <img src="${v.fotos[0] || ''}" class="w-16 h-16 rounded-2xl object-cover bg-gray-100">
                    <div class="flex-1">
                        <div class="text-[9px] font-bold text-blue-600 uppercase">OS #${v.os}</div>
                        <div class="font-black text-lg">${v.placa}</div>
                        <div class="text-xs text-gray-400 font-bold">${v.modelo}</div>
                    </div>
                </div>`;
            });
        }

        function buscarPlaca() {
            const termo = document.getElementById('busca-placa').value.toUpperCase();
            const res = document.getElementById('resultado-busca');
            res.innerHTML = '';
            if(termo.length < 2) return;

            db.filter(v => v.placa.includes(termo)).forEach(v => {
                res.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-lg border-l-8 border-blue-600">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-black">${v.placa}</h2>
                            <p class="text-[10px] text-gray-400">${v.modelo} - ${v.data}</p>
                        </div>
                        <div class="flex gap-1">${v.fotos.map(f => `<img src="${f}" class="w-10 h-10 rounded shadow-sm">`).join('')}</div>
                    </div>
                </div>`;
            });
        }

        document.getElementById('proxima-os').innerText = "OS: #" + config.os_counter.toString().padStart(3, '0');
    </script>
</body>
</html>
