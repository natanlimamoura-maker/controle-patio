<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Extreme Cloud</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/service.png">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #pagina-detalhes, #modal-saida, #bloqueio { display: none; position: fixed; inset: 0; z-index: 9999; }
        #bloqueio { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); align-items: center; justify-content: center; }
        #modal-saida { background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        #pagina-detalhes { background: #f3f4f6; flex-direction: column; overflow-y: auto; }
        .animate-pop { animation: pop 0.2s ease-out; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-28 text-gray-800 font-sans">

    <div id="bloqueio" class="flex">
        <div class="bg-white p-8 rounded-[40px] w-full max-w-sm m-4 shadow-2xl text-center border-t-8 border-red-600">
            <h2 class="text-2xl font-black mb-2 uppercase italic tracking-tighter">Licença Expirada</h2>
            <p class="text-gray-400 text-[10px] font-black mb-6 uppercase tracking-widest">Renove seu acesso para continuar</p>
            <input type="password" id="senha-licenca" placeholder="SENHA DE ATIVAÇÃO" class="border-2 p-5 rounded-3xl w-full mb-4 text-center font-black outline-none focus:border-red-600 text-lg">
            <button onclick="verificarLicenca()" class="bg-red-600 text-white w-full py-5 rounded-3xl font-black uppercase shadow-lg active:scale-95 transition-all">Ativar 30 Dias</button>
        </div>
    </div>

    <header class="bg-blue-700 text-white p-6 shadow-xl sticky top-0 z-50 rounded-b-[40px] flex justify-between items-end h-32">
        <div>
            <h1 id="app-nome-display" class="text-2xl font-black italic uppercase tracking-tighter">PÁTIO PRO</h1>
            <span id="status-drive" class="text-[9px] font-bold opacity-60 uppercase tracking-widest italic">Local (Sem Nuvem)</span>
        </div>
        <div class="text-right">
            <span id="contador" class="bg-blue-900/50 px-4 py-2 rounded-2xl text-[10px] font-black uppercase italic tracking-widest">0 NO PÁTIO</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <section id="aba-relatorio" class="tab-content">
            <div class="bg-white p-4 rounded-3xl shadow-sm border-2 border-blue-50 mb-4">
                <input type="text" id="busca-historico" onkeyup="renderizarRelatorio()" placeholder="🔍 PESQUISAR PLACA NO HISTÓRICO" class="w-full p-4 rounded-2xl bg-gray-50 border-2 font-black uppercase text-center outline-none focus:border-blue-500 transition-all">
            </div>
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>

        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-[35px] shadow-xl border border-gray-100 animate-pop">
                <form id="form-entrada" class="space-y-4">
                    <div class="flex justify-between items-center text-[10px] font-black uppercase text-blue-600">
                        <span>Novo Check-in</span>
                        <span id="proxima-os" class="bg-blue-50 px-3 py-1 rounded-full italic tracking-tighter"></span>
                    </div>
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-5 rounded-3xl font-black text-2xl text-center uppercase outline-none focus:border-blue-500">
                    <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full bg-gray-50 border-2 border-transparent p-5 rounded-2xl font-bold uppercase outline-none focus:border-blue-200">
                    <input type="text" id="cliente" placeholder="NOME DO CLIENTE" required class="w-full bg-gray-50 border-2 border-transparent p-5 rounded-2xl font-bold uppercase outline-none focus:border-blue-200">
                    <div id="container-previa" class="hidden grid grid-cols-3 gap-2 py-2"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex flex-col items-center justify-center border-2 border-dashed border-blue-200 p-5 rounded-3xl text-blue-600 bg-blue-50 cursor-pointer active:scale-95 transition-all">
                            <span class="text-2xl">📸</span>
                            <span class="font-black text-[9px] uppercase mt-1">Foto</span>
                            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(this)">
                        </label>
                        <button type="submit" class="bg-blue-600 text-white font-black rounded-3xl uppercase shadow-lg active:scale-95 transition-all">Registrar</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-agendamento" class="tab-content">
            <div class="bg-white p-6 rounded-[35px] shadow-lg border-2 border-orange-50 mb-6 text-center">
                <h3 class="text-[10px] font-black text-orange-600 uppercase mb-4 italic tracking-widest">Reserva de Oficina</h3>
                <form id="form-agendamento" class="space-y-3">
                    <input type="date" id="agend-data" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold outline-none focus:border-orange-200">
                    <input type="text" id="agend-veiculo" placeholder="VEÍCULO / CLIENTE" required class="w-full bg-gray-50 border-2 p-5 rounded-2xl font-bold uppercase outline-none focus:border-orange-200">
                    <button type="submit" class="w-full bg-orange-500 text-white font-black p-5 rounded-3xl uppercase shadow-lg active:scale-95 transition-all text-xs">Salvar Data</button>
                </form>
            </div>
            <div id="lista-agendamentos" class="space-y-2"></div>
        </section>

        <section id="aba-config" class="tab-content">
            <div class="bg-white p-6 rounded-[35px] shadow-xl space-y-6">
                <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-800 rounded-[30px] text-white text-center shadow-lg">
                    <p class="text-[10px] font-black opacity-80 mb-4 uppercase">Backup em Nuvem</p>
                    <button id="btn-login-drive" onclick="loginGoogle()" class="w-full bg-white text-blue-700 p-4 rounded-2xl font-black text-xs uppercase shadow-sm active:scale-95 transition-all">Conectar meu Google Drive</button>
                    <p class="text-[8px] mt-3 opacity-60 italic leading-tight uppercase">Os dados ficam salvos na sua conta do Google.</p>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Identidade Visual</label>
                    <input type="text" id="config-nome" placeholder="NOME DA OFICINA" class="w-full bg-gray-50 border-2 p-5 rounded-2xl font-black uppercase outline-none focus:border-blue-500">
                </div>
                <button onclick="salvarConfig()" class="w-full bg-gray-800 text-white font-black p-5 rounded-3xl uppercase text-[10px] active:scale-95 transition-all">Atualizar Nome</button>
            </div>
        </section>
    </main>

    <div id="modal-saida" class="flex">
        <div class="bg-white p-8 rounded-[40px] w-full max-w-sm m-4 shadow-2xl animate-pop text-center">
            <h3 class="font-black text-blue-700 uppercase italic mb-6 text-xl tracking-tighter">Relatório de Saída</h3>
            <input type="hidden" id="saida-id-temp">
            <textarea id="input-servico-final" placeholder="RELATÓRIO TÉCNICO DO SERVIÇO..." class="w-full bg-gray-50 border-2 p-5 rounded-3xl mb-6 font-bold uppercase outline-none h-32 text-sm resize-none"></textarea>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="fecharModalSaida()" class="bg-gray-100 p-5 rounded-2xl font-black uppercase text-[10px] text-gray-400">Voltar</button>
                <button onclick="confirmarSaidaFinal()" class="bg-green-600 text-white p-5 rounded-2xl font-black uppercase text-[10px] shadow-lg shadow-green-100">Concluir</button>
            </div>
        </div>
    </div>

    <div id="pagina-detalhes">
        <header class="bg-blue-700 text-white p-6 flex justify-between items-center shadow-lg sticky top-0 z-50">
            <button onclick="fecharDetalhes()" class="font-black text-sm tracking-widest">← VOLTAR</button>
            <button onclick="gerarPDF()" class="bg-green-500 px-6 py-2 rounded-2xl font-black text-[10px] uppercase shadow-md">Exportar PDF</button>
        </header>
        <div class="p-4 flex flex-col items-center pb-20">
            <div id="conteudo-pdf" class="bg-white p-8 rounded-3xl shadow-sm w-full max-w-[500px] border">
                <div class="border-b-4 border-blue-700 pb-2 mb-4 flex justify-between items-end">
                    <h2 id="pdf-nome-oficina" class="text-2xl font-black text-blue-700 italic uppercase">OFICINA</h2>
                    <span id="detalhe-os" class="font-black text-xs text-gray-300"></span>
                </div>
                <div class="space-y-4 mb-6">
                    <div><span class="text-[9px] font-black text-gray-400 uppercase">Placa do Veículo</span><p id="detalhe-placa" class="text-3xl font-black text-blue-600 uppercase italic tracking-tighter leading-none"></p></div>
                    <div class="grid grid-cols-2 gap-2 border-t pt-2">
                        <div><span class="text-[9px] font-black text-gray-400 uppercase">Modelo</span><p id="detalhe-modelo" class="font-black text-[11px] uppercase"></p></div>
                        <div><span class="text-[9px] font-black text-gray-400 uppercase">Cliente</span><p id="detalhe-cliente" class="font-black text-[11px] uppercase"></p></div>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                        <span class="text-[8px] font-black text-blue-400 uppercase italic">Serviço Realizado</span>
                        <p id="detalhe-servico" class="font-bold italic uppercase text-blue-900 text-xs mt-1 leading-relaxed"></p>
                    </div>
                </div>
                <div id="detalhe-fotos-pdf" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t flex justify-around items-center h-24 z-50 rounded-t-[40px] shadow-2xl">
        <button onclick="mudarAba('entrada')" id="btn-nav-entrada" class="nav-button active flex-1 flex flex-col items-center py-2"><span>➕</span><span class="text-[9px] font-black mt-1">CHECK-IN</span></button>
        <button onclick="mudarAba('patio')" id="btn-nav-patio" class="nav-button flex-1 flex flex-col items-center py-2"><span>🚗</span><span class="text-[9px] font-black mt-1">PÁTIO</span></button>
        <button onclick="mudarAba('agendamento')" id="btn-nav-agendamento" class="nav-button flex-1 flex flex-col items-center py-2"><span>📅</span><span class="text-[9px] font-black mt-1">AGENDA</span></button>
        <button onclick="mudarAba('relatorio')" id="btn-nav-relatorio" class="nav-button flex-1 flex flex-col items-center py-2"><span>📋</span><span class="text-[9px] font-black mt-1">HISTÓRICO</span></button>
        <button onclick="mudarAba('config')" id="btn-nav-config" class="nav-button flex-1 flex flex-col items-center py-2"><span>⚙️</span><span class="text-[9px] font-black mt-1">AJUSTES</span></button>
    </nav>

    <script>
        // SERVICE WORKER PARA INSTALAÇÃO
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        const CLIENT_ID = "210762586963-8kjn81npdglg8g3j1maram9odh8iud26.apps.googleusercontent.com";
        const SENHA_MESTRA = "0907";

        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];
        let agendamentos = JSON.parse(localStorage.getItem('patio_agendamentos')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO", os_counter: 1 };
        let fotosTemp = [], googleToken = null, fileIdDrive = null;

        // --- LICENÇA 30 DIAS ---
        function verificarLicenca() {
            if (document.getElementById('senha-licenca').value === SENHA_MESTRA) {
                localStorage.setItem('data_ativacao', Date.now());
                document.getElementById('bloqueio').style.display = 'none';
                location.reload();
            } else { alert("Chave inválida!"); }
        }

        function checarPrazo() {
            const dataAtivacao = localStorage.getItem('data_ativacao');
            if (!dataAtivacao) { document.getElementById('bloqueio').style.display = 'flex'; return; }
            if (Date.now() - dataAtivacao > (30 * 24 * 60 * 60 * 1000)) {
                document.getElementById('bloqueio').style.display = 'flex';
            } else { document.getElementById('bloqueio').style.display = 'none'; }
        }

        // --- DRIVE SYNC ---
        function loginGoogle() {
            google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
                callback: async (resp) => { 
                    googleToken = resp.access_token; 
                    document.getElementById('btn-login-drive').innerText = "✓ CONECTADO AO DRIVE"; 
                    document.getElementById('status-drive').innerText = "Backup Nuvem Ativo"; 
                    await sincronizarDadosDrive(); 
                }
            }).requestAccessToken();
        }

        async function sincronizarDadosDrive() {
            try {
                const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='patio_pro_db.json' and trashed=false`, { headers: { 'Authorization': `Bearer ${googleToken}` } });
                const d = await r.json(); 
                if (d.files && d.files.length > 0) {
                    fileIdDrive = d.files[0].id;
                    const content = await fetch(`https://www.googleapis.com/drive/v3/files/${fileIdDrive}?alt=media`, { headers: { 'Authorization': `Bearer ${googleToken}` } });
                    const driveData = await content.json();
                    if(driveData.historico) { 
                        patio = driveData.patio; historico = driveData.historico; agendamentos = driveData.agendamentos; 
                        atualizarStorage(); renderizarPatio(); 
                    }
                } else { await salvarNoDrive(); }
            } catch(e) {}
        }

        async function salvarNoDrive() {
            if(!googleToken) return;
            const metadata = { name: 'patio_pro_db.json', mimeType: 'application/json' };
            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', new Blob([JSON.stringify({patio, historico, agendamentos})], { type: 'application/json' }));
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';
            if (fileIdDrive) { url = `https://www.googleapis.com/upload/drive/v3/files/${fileIdDrive}?uploadType=multipart`; method = 'PATCH'; }
            await fetch(url, { method: method, headers: { 'Authorization': `Bearer ${googleToken}` }, body: formData });
        }

        // --- FOTOS ---
        function processarFoto(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 400; canvas.height = img.height * (400 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        fotosTemp.push(canvas.toDataURL('image/jpeg', 0.3));
                        renderizarPrevias();
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function renderizarPrevias() {
            const c = document.getElementById('container-previa'); c.innerHTML = '';
            fotosTemp.forEach((f, i) => { c.innerHTML += `<div class="relative h-20 rounded-2xl overflow-hidden shadow-sm border"><img src="${f}" class="w-full h-full object-cover"><button type="button" onclick="fotosTemp.splice(${i},1);renderizarPrevias()" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full font-black text-xs">✕</button></div>`; });
            c.classList.toggle('hidden', fotosTemp.length === 0);
        }

        // --- PÁTIO E HISTÓRICO ---
        document.getElementById('form-entrada').onsubmit = async function(e) {
            e.preventDefault();
            const novo = { id: Date.now(), os: config.os_counter.toString().padStart(3, '0'), placa: document.getElementById('placa').value.toUpperCase(), modelo: document.getElementById('modelo').value.toUpperCase(), cliente: document.getElementById('cliente').value.toUpperCase(), fotos: [...fotosTemp], entrada: new Date().toLocaleDateString('pt-BR') };
            patio.unshift(novo); config.os_counter++;
            atualizarStorage(); await salvarNoDrive(); location.reload();
        };

        function renderizarPatio() {
            const container = document.getElementById('lista-veiculos'); container.innerHTML = '';
            document.getElementById('contador').innerText = patio.length + " NO PÁTIO";
            patio.forEach(v => {
                container.innerHTML += `<div class="bg-white p-5 rounded-[30px] shadow-md border flex gap-4 items-center animate-pop"><img src="${v.fotos[0] || ''}" class="w-20 h-20 rounded-3xl object-cover bg-gray-50"><div class="flex-1"><span class="text-[9px] font-black text-blue-600">OS #${v.os}</span><div class="font-black text-xl uppercase italic tracking-tighter leading-none">${v.placa}</div><button onclick="abrirModalSaida(${v.id})" class="mt-3 w-full bg-green-600 text-white p-3 rounded-2xl text-[9px] font-black uppercase shadow-lg">Dar Saída</button></div></div>`;
            });
        }

        window.abrirModalSaida = (id) => { document.getElementById('saida-id-temp').value = id; document.getElementById('modal-saida').style.display = 'flex'; };
        window.fecharModalSaida = () => document.getElementById('modal-saida').style.display = 'none';

        window.confirmarSaidaFinal = async () => {
            const id = document.getElementById('saida-id-temp').value;
            const v = patio.find(x => x.id == id);
            const servico = document.getElementById('input-servico-final').value.toUpperCase() || "CONCLUÍDO";
            historico.unshift({...v, saida: new Date().toLocaleDateString('pt-BR'), servico});
            patio = patio.filter(x => x.id != id);
            atualizarStorage(); await salvarNoDrive(); location.reload();
        };

        function renderizarRelatorio() {
            const busca = document.getElementById('busca-historico').value.toUpperCase();
            const container = document.getElementById('lista-relatorio'); container.innerHTML = '';
            historico.filter(v => v.placa.includes(busca)).forEach(v => {
                container.innerHTML += `<div onclick="abrirDetalhes(${v.id})" class="bg-white p-4 rounded-3xl border border-gray-100 flex gap-4 items-center shadow-sm active:bg-blue-50"><img src="${v.fotos[0] || ''}" class="w-14 h-14 rounded-2xl object-cover bg-gray-50"><div class="flex-1 text-left"><span class="text-[8px] text-gray-400 font-black">Saída: ${v.saida}</span><div class="font-black text-lg uppercase italic">${v.placa}</div><div class="text-[9px] text-blue-600 font-black uppercase truncate italic mt-1">${v.servico}</div></div></div>`;
            });
        }

        window.abrirDetalhes = (id) => {
            const v = historico.find(x => x.id == id);
            document.getElementById('detalhe-placa').innerText = v.placa;
            document.getElementById('detalhe-cliente').innerText = v.cliente;
            document.getElementById('detalhe-modelo').innerText = v.modelo;
            document.getElementById('detalhe-servico').innerText = v.servico;
            document.getElementById('pdf-nome-oficina').innerText = config.nome;
            const grid = document.getElementById('detalhe-fotos-pdf'); grid.innerHTML = '';
            v.fotos.forEach(f => { grid.innerHTML += `<img src="${f}" class="w-full rounded-[30px] shadow-lg border-4 border-white my-2">`; });
            document.getElementById('pagina-detalhes').style.display = 'flex';
        };

        window.gerarPDF = async () => {
            const canvas = await html2canvas(document.getElementById('conteudo-pdf'), { scale: 3 });
            const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, (canvas.height * 210) / canvas.width);
            pdf.save(`Relatorio_${document.getElementById('detalhe-placa').innerText}.pdf`);
        };

        // --- AGENDA ---
        document.getElementById('form-agendamento').onsubmit = async (e) => {
            e.preventDefault();
            agendamentos.push({ id: Date.now(), data: document.getElementById('agend-data').value, veiculo: document.getElementById('agend-veiculo').value.toUpperCase() });
            atualizarStorage(); await salvarNoDrive(); location.reload();
        };

        function atualizarStorage() { localStorage.setItem('patio_data', JSON.stringify(patio)); localStorage.setItem('patio_historico', JSON.stringify(historico)); localStorage.setItem('patio_agendamentos', JSON.stringify(agendamentos)); localStorage.setItem('patio_config', JSON.stringify(config)); }
        
        window.mudarAba = (aba) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            document.getElementById('btn-nav-' + aba).classList.add('active');
            if(aba === 'patio') renderizarPatio();
            if(aba === 'relatorio') renderizarRelatorio();
            if(aba === 'agendamento') {
                const container = document.getElementById('lista-agendamentos'); container.innerHTML = '';
                agendamentos.sort((a,b) => new Date(a.data) - new Date(b.data)).forEach(a => { container.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between border uppercase text-[10px] font-black tracking-tighter shadow-sm mb-2"><span>📅 ${a.data.split('-').reverse().join('/')} - ${a.veiculo}</span><button onclick="agendamentos=agendamentos.filter(x=>x.id!==${a.id});atualizarStorage();mudarAba('agendamento');" class="text-red-400 font-bold px-2">✕</button></div>`; });
            }
        };

        window.fecharDetalhes = () => document.getElementById('pagina-detalhes').style.display = 'none';
        window.salvarConfig = () => { config.nome = document.getElementById('config-nome').value.toUpperCase(); atualizarStorage(); location.reload(); };
        
        document.getElementById('app-nome-display').innerText = config.nome;
        document.getElementById('config-nome').value = config.nome;
        document.getElementById('proxima-os').innerText = "OS: #" + config.os_counter.toString().padStart(3, '0');
        checarPrazo();
        renderizarPatio();
    </script>
</body>
</html>
