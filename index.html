<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pátio Pro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3524/3524659.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">

    <title>PÁTIO PRO v16.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #dc2626; }
        body { 
            background:#050505; 
            color:#e5e7eb; 
            font-family: 'Geist', sans-serif;
            -webkit-tap-highlight-color:transparent;
            letter-spacing: -0.02em;
        }
        .glass { 
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        input, textarea { 
            background:#0f0f0f !important; 
            border:1px solid #222 !important; 
            color:#fff !important; 
            outline:none; 
            width:100%; 
            padding:1rem; 
            border-radius:0.75rem; 
            font-size:0.9rem;
            transition: border 0.3s ease;
        }
        input:focus { border-color: var(--accent) !important; }
        .btn-red { 
            background: var(--accent); 
            color:white; 
            font-weight:700; 
            padding:1.1rem; 
            border-radius:0.75rem; 
            width:100%; 
            text-transform:uppercase; 
            font-size:0.8rem; 
            letter-spacing:0.05em;
            box-shadow: 0 10px 15px -3px rgba(220, 38, 38, 0.3);
        }
        .btn-back { font-size: 0.75rem; font-weight: 600; color: #71717a; text-transform: uppercase; margin-bottom: 1.5rem; display: inline-flex; align-items: center; }
        .hidden { display: none; }
        #bloqueio { position:fixed; inset:0; background:#000; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
        
        /* Estilo para os botões de mídia */
        .media-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #111;
            border: 1px solid #222;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 100%;
        }
    </style>
</head>
<body class="pb-10">

    <div id="bloqueio">
        <h2 class="text-white font-black text-2xl italic mb-2 tracking-tighter">LICENÇA EXPIRADA</h2>
        <p class="text-zinc-500 text-xs mb-8 text-center uppercase tracking-widest">Contate o administrador para renovar seu acesso.</p>
        <input id="chave-ativacao" type="password" placeholder="Senha de Acesso" class="text-center mb-4">
        <button onclick="verificarChave()" class="btn-red w-full max-w-xs">Ativar Sistema</button>
    </div>

    <header class="p-6 sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/5 flex justify-between items-center">
        <div>
            <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest leading-none mb-1">Gerenciamento</p>
            <h1 onclick="show('menu')" class="font-black text-xl uppercase tracking-tighter" id="header-nome">PÁTIO<span class="text-red-600">PRO</span></h1>
        </div>
        <button onclick="show('ajustes')" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-lg">⚙️</button>
    </header>

    <main class="p-5 max-w-xl mx-auto space-y-6">

        <section id="menu" class="grid grid-cols-2 gap-4">
            <button onclick="show('entrada')" class="glass p-8 rounded-[2rem] flex flex-col items-center justify-center active:scale-95 transition-all">
                <span class="text-3xl mb-3">➕</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Entrada</span>
            </button>
            <button onclick="show('patio')" class="glass p-8 rounded-[2rem] flex flex-col items-center justify-center relative border-b-2 border-red-600 active:scale-95 transition-all">
                <span class="text-3xl mb-3">🚗</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Pátio</span>
                <div id="mini-contador" class="absolute top-4 right-4 bg-red-600 text-[10px] font-black w-6 h-6 flex items-center justify-center rounded-full shadow-xl">0</div>
            </button>
            <button onclick="show('orcamento')" class="glass p-8 rounded-[2rem] flex flex-col items-center justify-center active:scale-95 transition-all">
                <span class="text-3xl mb-3">📄</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Orçamento</span>
            </button>
            <button onclick="show('historico')" class="glass p-8 rounded-[2rem] flex flex-col items-center justify-center active:scale-95 transition-all">
                <span class="text-3xl mb-3">📜</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Histórico</span>
            </button>
            <button onclick="show('balanco')" class="glass p-8 rounded-[2rem] flex flex-col items-center justify-center bg-green-600/5 border border-green-600/20 col-span-2 active:scale-95 transition-all">
                <span class="text-3xl mb-2">💰</span>
                <span class="text-[10px] font-black uppercase tracking-widest text-green-500">Financeiro Mensal</span>
            </button>
        </section>

        <section id="entrada" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao painel</button>
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <h2 class="text-sm font-black uppercase tracking-widest text-red-600 mb-4">Novo Registro</h2>
                <input id="placa" placeholder="PLACA" class="text-center text-2xl font-black text-red-600 placeholder:text-zinc-800 uppercase">
                <input id="cliente" placeholder="Nome do Cliente">
                <input id="modelo" placeholder="Modelo do Veículo">
                <textarea id="obs" placeholder="Observações e Avarias" rows="3"></textarea>
                
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Adicionar Fotos</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('f-cam').click()" class="media-btn">
                        <span class="text-2xl">📸</span>
                        <span class="text-[9px] font-black uppercase">Câmera</span>
                    </button>
                    <button onclick="document.getElementById('f-gal').click()" class="media-btn">
                        <span class="text-2xl">🖼️</span>
                        <span class="text-[9px] font-black uppercase">Galeria</span>
                    </button>
                </div>
                <input type="file" id="f-cam" accept="image/*" capture="camera" class="hidden" multiple onchange="atualizarLabelFotos()">
                <input type="file" id="f-gal" accept="image/*" class="hidden" multiple onchange="atualizarLabelFotos()">
                <p id="label-fotos" class="text-[10px] text-center text-zinc-600 font-bold uppercase"></p>

                <button onclick="salvarEntrada()" class="btn-red mt-4">Concluir Entrada</button>
            </div>
        </section>

        <section id="orcamento" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-6 rounded-[2rem] space-y-4 mb-4">
                <h2 class="text-sm font-black uppercase tracking-widest text-red-600 mb-2">Dados do Orçamento</h2>
                <input id="orc-cliente" placeholder="Nome Completo do Cliente">
                <div class="grid grid-cols-2 gap-2">
                    <input id="orc-fone" placeholder="WhatsApp">
                    <input id="orc-doc" placeholder="CPF ou CNPJ">
                </div>
                <input id="orc-modelo" placeholder="Veículo">
                <input id="orc-placa" placeholder="Placa" class="uppercase">
            </div>

            <div class="glass p-6 rounded-[2rem] space-y-4">
                <h2 class="text-sm font-black uppercase tracking-widest text-red-600 mb-2">Serviços e Peças</h2>
                <div id="itens-servico" class="space-y-3">
                    <div class="flex gap-2 item-linha">
                        <input class="flex-1 s-nome" placeholder="Descrição do Serviço">
                        <input class="w-28 s-valor" type="number" placeholder="Valor R$" oninput="calcularTotalOrc()">
                    </div>
                </div>
                <button onclick="addLinhaServico()" class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">+ Adicionar outro item</button>
                
                <div class="pt-4 border-t border-white/5 flex justify-between items-center">
                    <span class="text-xs font-bold text-zinc-400">TOTAL ESTIMADO</span>
                    <span id="orc-total-display" class="text-2xl font-black text-green-500">R$ 0,00</span>
                </div>
                <button onclick="gerarPDF()" class="btn-red">Gerar e Salvar PDF</button>
            </div>
        </section>

        <section id="patio" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar</button>
            <div id="renderPatio" class="space-y-4"></div>
        </section>

        <section id="historico" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar</button>
            <div id="renderHistorico" class="space-y-3"></div>
        </section>

        <section id="balanco" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-10 rounded-[2.5rem] border-t-4 border-green-600 text-center mb-6">
                <p class="text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em] mb-2">Faturamento do Mês</p>
                <h2 id="totalMes" class="text-4xl font-black text-white">R$ 0,00</h2>
            </div>
            <div id="listaFaturamento" class="space-y-2"></div>
        </section>

        <section id="ajustes" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar</button>
            <div class="glass p-8 rounded-[2.5rem] space-y-6">
                <div>
                    <label class="text-[10px] font-black text-zinc-600 uppercase tracking-widest block mb-2">Nome da sua Oficina</label>
                    <input id="input-nome-oficina" placeholder="Ex: Oficina Mecânica">
                </div>
                <button onclick="salvarConfig()" class="btn-red">Salvar Alterações</button>
                <div class="pt-6 space-y-3">
                    <button onclick="baixarBackup()" class="w-full bg-white/5 border border-white/10 py-4 rounded-xl text-[10px] font-black uppercase tracking-widest">Fazer Backup dos Dados</button>
                    <button onclick="limparTudo()" class="w-full text-zinc-800 text-[9px] font-black uppercase">Resetar Sistema</button>
                </div>
            </div>
        </section>

    </main>

    <script>
        const { jsPDF } = window.jspdf;
        const KEY = 'patio_pro_master_v13';
        let db = JSON.parse(localStorage.getItem(KEY)) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO", expiracao: new Date().getTime() + (30*24*60*60*1000) };

        function salvarNoBanco() { localStorage.setItem(KEY, JSON.stringify(db)); }
        function show(id) { document.querySelectorAll("section").forEach(s => s.classList.add("hidden")); document.getElementById(id).classList.remove("hidden"); window.scrollTo(0,0); }

        function atualizarLabelFotos() {
            const cam = document.getElementById('f-cam').files.length;
            const gal = document.getElementById('f-gal').files.length;
            document.getElementById('label-fotos').innerText = (cam + gal) + " Foto(s) selecionada(s)";
        }

        async function salvarEntrada() {
            const placa = document.getElementById('placa').value.toUpperCase();
            if(!placa) return alert("A Placa é obrigatória!");
            
            const inputs = [document.getElementById('f-cam'), document.getElementById('f-gal')];
            const fotos = [];
            
            for(let input of inputs) {
                const files = Array.from(input.files);
                for(let file of files) {
                    const base64 = await toBase64(file);
                    fotos.push(base64);
                }
            }

            db.push({
                id: Date.now(),
                placa,
                cliente: document.getElementById('cliente').value.toUpperCase(),
                modelo: document.getElementById('modelo').value.toUpperCase(),
                obs: document.getElementById('obs').value,
                entrada: new Date().toISOString(),
                fotos,
                ativo: true,
                valor: 0
            });

            salvarNoBanco();
            location.reload();
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function darSaida(id) {
            const v = db.find(x => x.id === id);
            const val = Number(prompt("Valor Final do Serviço R$:", 0));
            if(val) { v.valor = val; v.ativo = false; v.saida = new Date().toISOString(); salvarNoBanco(); location.reload(); }
        }

        function addLinhaServico() {
            const div = document.createElement('div');
            div.className = "flex gap-2 item-linha";
            div.innerHTML = `<input class="flex-1 s-nome" placeholder="Descrição do Serviço"><input class="
