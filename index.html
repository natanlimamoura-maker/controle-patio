<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PÁTIO PRO v13.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background:#050505; color:#fff; font-family:'Inter', sans-serif; -webkit-tap-highlight-color:transparent; }
        .glass { background:rgba(18,18,18,.9); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.05); }
        input, textarea, select { background:#0a0a0a !important; border:1px solid #222 !important; color:#fff !important; outline:none; width:100%; padding:0.8rem; border-radius:0.8rem; font-size:0.8rem; }
        .btn-red { background:#dc2626; color:white; font-weight:900; padding:1rem; border-radius:1rem; width:100%; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px; }
        .btn-back { font-size: 10px; font-weight: 900; color: #52525b; text-transform: uppercase; margin-bottom: 1rem; display: block; }
        #bloqueio { display:none; position:fixed; inset:0; background:#000; z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20">

    <div id="bloqueio">
        <h2 class="text-red-600 font-black text-3xl italic mb-4 text-center">LICENÇA EXPIRADA</h2>
        <input id="chave-ativacao" type="password" placeholder="SENHA MESTRA" class="mb-4 text-center">
        <button onclick="verificarChave()" class="btn-red">Ativar</button>
    </div>

    <header class="p-5 sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-white/5 flex justify-between items-center">
        <h1 onclick="show('menu')" class="font-black italic cursor-pointer text-lg uppercase tracking-tighter" id="header-nome">PÁTIO<span class="text-red-600">PRO</span></h1>
        <button onclick="show('ajustes')" class="text-[9px] font-black text-zinc-400 bg-white/5 px-4 py-2 rounded-full border border-white/10 uppercase italic">⚙️ Ajustes</button>
    </header>

    <main class="p-4 max-w-lg mx-auto space-y-4">

        <section id="menu" class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="show('entrada')" class="glass p-6 rounded-3xl text-center">
                <span class="text-2xl">➕</span>
                <p class="text-[9px] font-black mt-2 text-zinc-400 uppercase">Entrada</p>
            </button>
            <button onclick="show('patio')" class="glass p-6 rounded-3xl text-center border-b-2 border-red-600 relative">
                <span class="text-2xl">🚗</span>
                <p class="text-[9px] font-black mt-2 text-zinc-400 uppercase">Pátio</p>
                <div id="mini-contador" class="absolute -top-2 -right-2 bg-red-600 text-white text-[8px] font-black px-2 py-1 rounded-full shadow-lg">0</div>
            </button>
            <button onclick="show('orcamento')" class="glass p-6 rounded-3xl text-center">
                <span class="text-2xl">📄</span>
                <p class="text-[9px] font-black mt-2 text-zinc-400 uppercase">Orçamento</p>
            </button>
            <button onclick="show('historico')" class="glass p-6 rounded-3xl text-center">
                <span class="text-2xl">📜</span>
                <p class="text-[9px] font-black mt-2 text-zinc-400 uppercase">Histórico</p>
            </button>
            <button onclick="show('balanco')" class="glass p-6 rounded-3xl text-center bg-green-900/5 col-span-2 border border-green-900/20">
                <span class="text-2xl">💰</span>
                <p class="text-[9px] font-black mt-2 text-green-500 italic uppercase">Balanço Financeiro</p>
            </button>
        </section>

        <section id="entrada" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao Menu</button>
            <div class="glass p-5 rounded-3xl space-y-3">
                <input id="placa" placeholder="PLACA" class="text-center text-xl font-black text-red-600 uppercase">
                <input id="cliente" placeholder="NOME DO CLIENTE">
                <input id="modelo" placeholder="MODELO DO VEÍCULO">
                <textarea id="obs" placeholder="OBSERVAÇÕES (AVARIAS)"></textarea>
                <input type="file" id="fotos" accept="image/*" capture="camera" multiple class="text-[10px]">
                <button onclick="salvarEntrada()" class="btn-red">Registrar no Pátio</button>
            </div>
        </section>

        <section id="orcamento" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao Menu</button>
            <div class="glass p-5 rounded-3xl space-y-3 mb-3">
                <p class="text-[10px] font-black text-red-600 italic uppercase">Dados do Cliente</p>
                <input id="orc-cliente" placeholder="NOME COMPLETO">
                <div class="grid grid-cols-2 gap-2">
                    <input id="orc-fone" placeholder="WHATSAPP">
                    <input id="orc-doc" placeholder="CPF/CNPJ">
                </div>
                <input id="orc-endereco" placeholder="ENDEREÇO">
                <div class="grid grid-cols-2 gap-2">
                    <input id="orc-modelo" placeholder="VEÍCULO">
                    <input id="orc-placa" placeholder="PLACA" class="uppercase">
                </div>
            </div>
            <div class="glass p-5 rounded-3xl space-y-3">
                <p class="text-[10px] font-black text-red-600 italic uppercase">Serviços e Valores</p>
                <div id="itens-servico" class="space-y-2">
                    <div class="flex gap-2 item-linha">
                        <input class="flex-1 s-nome" placeholder="Serviço">
                        <input class="w-24 s-valor" type="number" placeholder="R$" oninput="calcularTotalOrc()">
                    </div>
                </div>
                <button onclick="addLinhaServico()" class="text-[9px] font-black text-zinc-500 uppercase">+ Adicionar Item</button>
                <div class="border-t border-white/5 pt-3 flex justify-between items-center">
                    <span class="text-xs font-black">TOTAL:</span>
                    <span id="orc-total-display" class="text-xl font-black text-green-500">R$ 0,00</span>
                </div>
                <button onclick="gerarPDF()" class="btn-red">Gerar PDF e Salvar</button>
            </div>
        </section>

        <section id="patio" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao Menu</button>
            <div id="renderPatio" class="space-y-3"></div>
        </section>

        <section id="historico" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao Menu</button>
            <div id="renderHistorico" class="space-y-2"></div>
        </section>

        <section id="balanco" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao Menu</button>
            <div class="glass p-10 rounded-[2.5rem] border-t-4 border-green-600 mb-4 text-center">
                <p class="text-[10px] font-black text-zinc-500 uppercase">Faturamento Mensal</p>
                <h2 id="totalMes" class="text-4xl font-black italic text-white">R$ 0,00</h2>
            </div>
            <div id="listaFaturamento" class="space-y-2"></div>
        </section>

        <section id="ajustes" class="hidden">
            <button onclick="show('menu')" class="btn-back">← Voltar ao Menu</button>
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <h3 class="text-[10px] font-black text-red-600 uppercase">Configuração do App</h3>
                <input id="input-nome-oficina" placeholder="NOME DA OFICINA">
                <button onclick="salvarConfig()" class="btn-red">Salvar Nome</button>
                <p id="info-licenca" class="text-[9px] font-black text-zinc-600 uppercase italic text-center"></p>
                <button onclick="baixarBackup()" class="w-full bg-zinc-900 border border-white/5 py-4 rounded-xl text-xs font-black uppercase italic">Exportar Backup .JSON</button>
                <button onclick="limparTudo()" class="text-[8px] text-zinc-800 font-black uppercase w-full">Zerar Banco de Dados</button>
            </div>
        </section>

    </main>

    <script>
        const { jsPDF } = window.jspdf;
        const KEY = 'patio_pro_master_v13'; // Nova chave mestre
        
        let db = [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { 
            nome: "PÁTIO PRO", expiracao: new Date().getTime() + (30*24*60*60*1000) 
        };

        // --- FUNÇÃO DE RECUPERAÇÃO DE DADOS ANTIGOS ---
        function recuperarDadosAntigos() {
            const chavesAntigas = ['patio_pro_v102', 'patio_pro_v11', 'patio_pro_v12', 'patio_pro_v125', 'patio_pro_db', 'patio_pro_v115_db'];
            let dadosRecuperados = JSON.parse(localStorage.getItem(KEY)) || [];

            if (dadosRecuperados.length === 0) {
                chavesAntigas.forEach(c => {
                    const antigo = localStorage.getItem(c);
                    if (antigo) {
                        const parsing = JSON.parse(antigo);
                        if (Array.isArray(parsing)) {
                            dadosRecuperados = [...dadosRecuperados, ...parsing];
                        }
                    }
                });
                // Remove duplicatas por ID
                db = dadosRecuperados.filter((v, i, a) => a.findIndex(t => t.id === v.id) === i);
                salvarNoBanco();
            } else {
                db = dadosRecuperados;
            }
        }

        function salvarNoBanco() { localStorage.setItem(KEY, JSON.stringify(db)); }

        function init() {
            recuperarDadosAntigos();
            if (new Date().getTime() > config.expiracao) document.getElementById('bloqueio').style.display='flex';
            document.getElementById('header-nome').innerText = config.nome;
            document.getElementById('input-nome-oficina').value = config.nome;
            const dias = Math.max(0, Math.ceil((config.expiracao - new Date().getTime()) / (1000 * 60 * 60 * 24)));
            document.getElementById('info-licenca').innerText = `LICENÇA: ${dias} DIAS RESTANTES`;
            render();
        }

        function verificarChave() {
            if(document.getElementById('chave-ativacao').value === "meuapp") {
                config.expiracao = new Date().getTime() + (30*24*60*60*1000);
                localStorage.setItem('patio_config', JSON.stringify(config));
                location.reload();
            }
        }

        function show(id) {
            document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
            document.getElementById(id).classList.remove("hidden");
            window.scrollTo(0,0);
        }

        function salvarConfig() {
            config.nome = document.getElementById('input-nome-oficina').value.toUpperCase();
            localStorage.setItem('patio_config', JSON.stringify(config));
            location.reload();
        }

        function salvarEntrada() {
            const placa = document.getElementById('placa').value.toUpperCase();
            if(!placa) return alert("INSIRA A PLACA");
            const fotosInput = document.getElementById('fotos').files;
            const fotos = [];
            const finalizar = () => {
                db.push({
                    id: Date.now(), placa, 
                    cliente: document.getElementById('cliente').value.toUpperCase(),
                    modelo: document.getElementById('modelo').value.toUpperCase(),
                    obs: document.getElementById('obs').value,
                    entrada: new Date().toISOString(),
                    fotos, ativo: true, valor: 0
                });
                salvarNoBanco(); location.reload();
            };
            if(fotosInput.length === 0) return finalizar();
            let lidos = 0;
            [...fotosInput].forEach(f => {
                const r = new FileReader();
                r.onload = e => { fotos.push(e.target.result); lidos++; if(lidos === fotosInput.length) finalizar(); };
                r.readAsDataURL(f);
            });
        }

        function addLinhaServico() {
            const div = document.createElement('div');
            div.className = "flex gap-2 item-linha";
            div.innerHTML = `<input class="flex-1 s-nome" placeholder="Serviço"><input class="w-24 s-valor" type="number" placeholder="R$" oninput="calcularTotalOrc()">`;
            document.getElementById('itens-servico').appendChild(div);
        }

        function calcularTotalOrc() {
            let total = 0;
            document.querySelectorAll('.s-valor').forEach(i => total += (Number(i.value) || 0));
            document.getElementById('orc-total-display').innerText = total.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
            return total;
        }

        async function gerarPDF() {
            const doc = new jsPDF();
            const cliente = document.getElementById('orc-cliente').value;
            const total = calcularTotalOrc();
            doc.setFont("helvetica", "bold"); doc.text(config.nome, 105, 20, { align: "center" });
            doc.setFontSize(10); doc.text("ORÇAMENTO DE SERVIÇOS", 105, 28, { align: "center" });
            doc.line(10, 35, 200, 35);
            doc.text(`CLIENTE: ${cliente.toUpperCase()}`, 10, 45);
            doc.text(`FONE: ${document.getElementById('orc-fone').value} | DOC: ${document.getElementById('orc-doc').value}`, 10, 52);
            doc.text(`VEÍCULO: ${document.getElementById('orc-modelo').value.toUpperCase()} | PLACA: ${document.getElementById('orc-placa').value.toUpperCase()}`, 10, 59);
            doc.line(10, 65, 200, 65);
            let y = 75;
            document.querySelectorAll('.item-linha').forEach(linha => {
                const n = linha.querySelector('.s-nome').value;
                const v = Number(linha.querySelector('.s-valor').value);
                if(n) { doc.setFont("helvetica", "normal"); doc.text(n.toUpperCase(), 10, y); doc.text(`R$ ${v.toFixed(2)}`, 190, y, { align: "right" }); y += 7; }
            });
            doc.setFont("helvetica", "bold"); doc.text(`TOTAL GERAL: R$ ${total.toFixed(2)}`, 190, y + 10, { align: "right" });
            db.push({ id: Date.now(), cliente, valor: total, saida: new Date().toISOString(), ativo: false });
            salvarNoBanco(); doc.save(`Orcamento_${cliente}.pdf`); location.reload();
        }

        function darSaida(id) {
            const v = db.find(x => x.id === id);
            const valor = Number(prompt("Valor Final R$:", 0));
            if(valor) { v.valor = valor; v.ativo = false; v.saida = new Date().toISOString(); salvarNoBanco(); location.reload(); }
        }

        function render() {
            const lp = document.getElementById('renderPatio');
            const lh = document.getElementById('renderHistorico');
            const lb = document.getElementById('listaFaturamento');
            let ativos = 0, faturado = 0, mes = new Date().getMonth();
            lp.innerHTML = ""; lh.innerHTML = ""; lb.innerHTML = "";

            db.slice().reverse().forEach(v => {
                if(v.ativo) {
                    ativos++;
                    lp.innerHTML += `<div class="glass p-5 rounded-3xl"><h3 class="text-xl font-black text-red-600 italic uppercase">${v.placa}</h3><p class="text-[10px] font-black opacity-50 uppercase">${v.cliente} • ${v.modelo}</p><div class="flex gap-2 mt-3 overflow-x-auto">${v.fotos.map(f => `<img src="${f}" class="w-20 h-20 rounded-xl object-cover">`).join("")}</div><button onclick="darSaida(${v.id})" class="btn-red mt-4 shadow-lg shadow-red-600/20">DAR SAÍDA</button></div>`;
                } else {
                    const htm = `<div class="glass p-4 rounded-2xl flex justify-between items-center opacity-70"><div><p class="font-black text-xs uppercase">${v.placa || v.cliente}</p><p class="text-[8px] uppercase">${new Date(v.saida).toLocaleDateString()}</p></div><p class="font-black text-green-500 text-xs">R$ ${v.valor.toFixed(2)}</p></div>`;
                    lh.innerHTML += htm;
                    if(new Date(v.saida).getMonth() === mes) { faturado += v.valor; lb.innerHTML += htm; }
                }
            });
            document.getElementById('mini-contador').innerText = ativos;
            document.getElementById('totalMes').innerText = faturado.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
        }

        function baixarBackup() {
            const a = document.createElement('a');
            a.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db)));
            a.setAttribute("download", "BACKUP_PÁTIO_MESTRE.json"); a.click();
        }

        function limparTudo() { if(confirm("Deseja apagar TODOS os dados?")) { localStorage.clear(); location.reload(); } }

        init();
    </script>
</body>
</html>
