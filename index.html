<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Extreme Cloud</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/741/741407.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #modal-saida, #pagina-detalhes { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        #pagina-detalhes { background: #f3f4f6; flex-direction: column; justify-content: flex-start; overflow-y: auto; padding: 0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800 font-sans">

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-3xl flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic">PÁTIO PRO</h1>
            <span id="status-drive" class="text-[9px] font-bold text-blue-200 uppercase">Aguardando Drive</span>
        </div>
        <button id="btn-login" onclick="loginGoogle()" class="bg-white text-blue-700 text-[10px] px-3 py-2 rounded-xl font-black uppercase">Conectar Drive</button>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <div class="mb-6">
            <input type="text" id="busca-placa" onkeyup="buscarPlaca()" placeholder="🔍 BUSCAR PLACA" class="w-full p-5 rounded-3xl border-none shadow-md font-black uppercase text-center focus:ring-4 ring-blue-300 outline-none">
        </div>

        <section id="aba-entrada" class="tab-content active">
            <form id="form-patio" class="bg-white p-6 rounded-3xl shadow-xl space-y-4">
                <input type="hidden" id="edit-id" value="">
                <div class="flex justify-between items-center text-[10px] font-black text-gray-400">
                    <span id="label-os">NOVO REGISTRO</span>
                    <span id="proxima-os" class="text-blue-600 bg-blue-50 px-2 py-1 rounded">OS: #001</span>
                </div>
                
                <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl text-2xl text-center font-black uppercase outline-none focus:border-blue-500">
                <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                <input type="text" id="cliente" placeholder="CLIENTE" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                
                <div id="previa" class="grid grid-cols-4 gap-2 hidden"></div>

                <div class="grid grid-cols-2 gap-3">
                    <label class="flex flex-col items-center justify-center border-2 border-dashed border-blue-200 p-4 rounded-2xl text-blue-600 bg-blue-50 cursor-pointer">
                        <span class="text-[10px] font-black">📸 FOTO</span>
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="compactarFoto(this)">
                    </label>
                    <button type="submit" class="bg-blue-600 text-white font-black rounded-2xl shadow-lg uppercase text-xs">Salvar</button>
                </div>
            </form>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="resultado-busca" class="mt-4 space-y-4"></section>
    </main>

    <div id="modal-saida">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm m-4 shadow-2xl">
            <h3 class="font-black text-blue-700 uppercase mb-4">Finalizar Saída</h3>
            <input type="hidden" id="saida-id-temp">
            <input type="text" id="input-servico-final" placeholder="SERVIÇO REALIZADO" class="w-full bg-gray-50 border-2 p-4 rounded-2xl mb-6 font-bold uppercase">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="fecharModalSaida()" class="bg-gray-100 p-4 rounded-2xl font-bold uppercase text-xs">Voltar</button>
                <button onclick="confirmarSaidaFinal()" class="bg-green-600 text-white p-4 rounded-2xl font-black uppercase text-xs">Concluir</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-20 z-50">
        <button onclick="mudarAba('entrada')" id="btn-nav-entrada" class="nav-button active flex-1 flex flex-col items-center"><span>➕</span><span class="text-[8px] font-bold">ENTRADA</span></button>
        <button onclick="mudarAba('patio')" id="btn-nav-patio" class="nav-button flex-1 flex flex-col items-center"><span>🚗</span><span class="text-[8px] font-bold">PÁTIO</span></button>
        <button onclick="mudarAba('busca')" id="btn-nav-busca" class="nav-button flex-1 flex flex-col items-center"><span>📋</span><span class="text-[8px] font-bold">HISTÓRICO</span></button>
    </nav>

    <script>
        const CLIENT_ID = "317001427708-1rglariag6m8l4vi4a19noduuuk2dg6b.apps.googleusercontent.com";
        let db = JSON.parse(localStorage.getItem('patio_db')) || []; // Dados persistentes
        let patio = JSON.parse(localStorage.getItem('patio_data')) || []; // Dados no pátio agora
        let config = JSON.parse(localStorage.getItem('patio_config')) || { os_counter: 1 };
        let fotosTemp = [];
        let googleToken = null;
        let fileIdDrive = null;

        // Login Google Independente
        function loginGoogle() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file',
                callback: async (response) => {
                    googleToken = response.access_token;
                    document.getElementById('btn-login').innerText = "☁️ CONECTADO";
                    document.getElementById('btn-login').className = "bg-green-100 text-green-700 text-[10px] px-3 py-2 rounded-xl font-bold uppercase";
                    document.getElementById('status-drive').innerText = "Backup Drive Ativo";
                    await buscarArquivoNoDrive();
                },
            });
            client.requestAccessToken();
        }

        // Compactação Extrema (Foco em Quantidade)
        function compactarFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const max_w = 300; 
                        canvas.width = max_w;
                        canvas.height = img.height * (max_w / img.width);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.2);
                        fotosTemp.push(base64);
                        document.getElementById('previa').classList.remove('hidden');
                        document.getElementById('previa').innerHTML += `<img src="${base64}" class="h-12 w-full object-cover rounded">`;
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Salvar Registro
        document.getElementById('form-patio').onsubmit = async function(e) {
            e.preventDefault();
            const idEdit = document.getElementById('edit-id').value;
            const dados = {
                placa: document.getElementById('placa').value.toUpperCase(),
                modelo: document.getElementById('modelo').value.toUpperCase(),
                cliente: document.getElementById('cliente').value.toUpperCase(),
                fotos: [...fotosTemp],
                data: new Date().toLocaleDateString('pt-BR')
            };

            if (idEdit) {
                const idx = patio.findIndex(v => v.id == idEdit);
                patio[idx] = { ...patio[idx], ...dados };
                document.getElementById('edit-id').value = "";
            } else {
                const novo = { id: Date.now(), os: config.os_counter.toString().padStart(3, '0'), ...dados };
                patio.unshift(novo);
                db.unshift(novo); // Salva no histórico também
                config.os_counter++;
            }

            atualizarStorage();
            if(googleToken) await salvarNoDrive();
            
            alert("Veículo no Pátio!");
            this.reset();
            fotosTemp = [];
            document.getElementById('previa').innerHTML = '';
            document.getElementById('previa').classList.add('hidden');
            mudarAba('patio');
        };

        // Funções de Pátio e Histórico
        function mudarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            if(aba === 'busca') {
                document.getElementById('btn-nav-busca').classList.add('active');
                // A busca fica visível por padrão, mas podemos focar nela
                document.getElementById('busca-placa').focus();
            } else {
                document.getElementById('aba-' + aba).classList.add('active');
                document.getElementById('btn-nav-' + aba).classList.add('active');
            }
            if(aba === 'patio') renderizarPatio();
        }

        function renderizarPatio() {
            const lista = document.getElementById('lista-veiculos');
            lista.innerHTML = '';
            patio.forEach(v => {
                lista.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">
                    <img src="${v.fotos[0] || ''}" class="w-16 h-16 rounded-2xl object-cover bg-gray-100">
                    <div class="flex-1">
                        <div class="text-[9px] font-bold text-blue-600">OS #${v.os}</div>
                        <div class="font-black text-lg">${v.placa}</div>
                        <div class="flex gap-2 mt-2">
                            <button onclick="prepararEdicao(${v.id})" class="flex-1 bg-gray-100 p-2 rounded-xl text-[8px] font-bold">EDITAR</button>
                            <button onclick="abrirModalSaida(${v.id})" class="flex-1 bg-green-600 text-white p-2 rounded-xl text-[8px] font-bold">SAÍDA</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        window.abrirModalSaida = (id) => {
            document.getElementById('saida-id-temp').value = id;
            document.getElementById('modal-saida').style.display = 'flex';
        };

        window.confirmarSaidaFinal = () => {
            const id = document.getElementById('saida-id-temp').value;
            const v = patio.find(x => x.id == id);
            // Ao sair do pátio, atualizamos o histórico com o serviço
            const servico = document.getElementById('input-servico-final').value.toUpperCase();
            const idxDb = db.findIndex(x => x.id == id);
            if(idxDb !== -1) db[idxDb].servico = servico;
            
            patio = patio.filter(x => x.id != id);
            atualizarStorage();
            document.getElementById('modal-saida').style.display = 'none';
            mudarAba('patio');
        };

        function buscarPlaca() {
            const termo = document.getElementById('busca-placa').value.toUpperCase();
            const res = document.getElementById('resultado-busca');
            res.innerHTML = '';
            if(termo.length < 2) return;

            db.filter(v => v.placa.includes(termo)).forEach(v => {
                res.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-md border-l-8 border-blue-600">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-black">${v.placa}</h2>
                            <p class="text-[10px] text-gray-400">OS #${v.os} - ${v.data}</p>
                            <p class="text-[10px] font-bold text-blue-600">${v.servico || 'PÁTIO'}</p>
                        </div>
                        <div class="flex gap-1">${v.fotos.map(f => `<img src="${f}" class="w-12 h-12 rounded-lg object-cover">`).join('')}</div>
                    </div>
                </div>`;
            });
        }

        function atualizarStorage() {
            localStorage.setItem('patio_data', JSON.stringify(patio));
            localStorage.setItem('patio_db', JSON.stringify(db));
            localStorage.setItem('patio_config', JSON.stringify(config));
        }

        // Lógica Google Drive (File Create/Update)
        async function buscarArquivoNoDrive() {
            const resp = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='patio_pro_db.json'`, {
                headers: { 'Authorization': `Bearer ${googleToken}` }
            });
            const data = await resp.json();
            if (data.files && data.files.length > 0) fileIdDrive = data.files[0].id;
        }

        async function salvarNoDrive() {
            const metadata = { name: 'patio_pro_db.json', mimeType: 'application/json' };
            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', new Blob([JSON.stringify(db)], { type: 'application/json' }));
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';
            if (fileIdDrive) {
                url = `https://www.googleapis.com/upload/drive/v3/files/${fileIdDrive}?uploadType=multipart`;
                method = 'PATCH';
            }
            await fetch(url, { method: method, headers: { 'Authorization': `Bearer ${googleToken}` }, body: formData });
        }

        function fecharModalSaida() { document.getElementById('modal-saida').style.display = 'none'; }
        document.getElementById('proxima-os').innerText = "OS: #" + config.os_counter.toString().padStart(3, '0');
    </script>
</body>
</html>
