<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e40af">
    <title>Pátio Pro Elite v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; border-top: 3px solid #2563eb; background: #f8fafc; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24 font-sans text-gray-800">

    <header class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic tracking-tighter">PÁTIO PRO</h1>
            <span id="contador" class="bg-blue-900 px-3 py-1 rounded-lg text-[10px] font-bold uppercase">0 No Pátio</span>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-xl">
        
        <section id="aba-entrada" class="tab-content active animate-in fade-in">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2 text-blue-700">📝 Registrar Entrada</h2>
                <form id="form-entrada" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="placa" placeholder="PLACA DO VEÍCULO" required class="w-full border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none uppercase font-black text-xl bg-gray-50">
                    <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none bg-gray-50 font-medium">
                    <input type="text" id="cliente" placeholder="NOME DO CLIENTE" required class="w-full border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none bg-gray-50 font-medium">
                    <label class="flex flex-col items-center justify-center gap-2 w-full bg-blue-50 border-2 border-dashed border-blue-200 p-4 rounded-2xl text-blue-600 cursor-pointer active:bg-blue-100 transition-colors">
                        <span id="label-foto" class="font-bold text-sm text-center">📸 Tirar/Alterar Foto</span>
                        <input type="file" id="foto" accept="image/*" capture="environment" class="hidden" onchange="document.getElementById('label-foto').innerText = '✅ Foto Selecionada'">
                    </label>
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl shadow-xl shadow-blue-100 active:scale-95 transition-all uppercase">Confirmar Entrada</button>
                    <button type="button" id="btn-cancelar" onclick="cancelarEdicao()" class="hidden w-full bg-gray-200 text-gray-600 font-bold p-3 rounded-2xl uppercase text-sm mt-2">Cancelar Edição</button>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content animate-in fade-in">
            <div class="mb-4">
                <input type="text" id="busca" oninput="filtrarVeiculos()" placeholder="🔍 Buscar no pátio..." class="w-full p-4 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
            </div>
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-relatorio" class="tab-content animate-in fade-in">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700 uppercase italic">Histórico de Hoje</h2>
                <button onclick="limparHistorico()" class="text-[10px] bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold">LIMPAR TUDO</button>
            </div>
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-20 z-50">
        <button onclick="mudarAba('entrada')" id="btn-nav-entrada" class="nav-button active flex flex-col items-center justify-center w-full h-full gap-1">
            <span class="text-xl">➕</span><span class="text-[9px] font-bold uppercase">Entrada</span>
        </button>
        <button onclick="mudarAba('patio')" id="btn-nav-patio" class="nav-button flex flex-col items-center justify-center w-full h-full gap-1">
            <span class="text-xl">🚗</span><span class="text-[9px] font-bold uppercase">Pátio</span>
        </button>
        <button onclick="mudarAba('relatorio')" id="btn-nav-relatorio" class="nav-button flex flex-col items-center justify-center w-full h-full gap-1">
            <span class="text-xl">📋</span><span class="text-[9px] font-bold uppercase">Relatório</span>
        </button>
    </nav>

    <script>
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];

        function mudarAba(nomeAba) {
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('aba-' + nomeAba).classList.add('active');
            document.getElementById('btn-nav-' + nomeAba).classList.add('active');
            if(nomeAba === 'relatorio') renderizarRelatorio();
        }

        const redimensionarImagem = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        document.getElementById('form-entrada').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const placa = document.getElementById('placa').value.toUpperCase();
            const modelo = document.getElementById('modelo').value;
            const cliente = document.getElementById('cliente').value;
            const fotoFile = document.getElementById('foto').files[0];
            
            let fotoBase64 = null;
            if(fotoFile) fotoBase64 = await redimensionarImagem(fotoFile);

            if (id) {
                const index = patio.findIndex(v => v.id == id);
                patio[index].placa = placa;
                patio[index].modelo = modelo;
                patio[index].cliente = cliente;
                if(fotoBase64) patio[index].foto = fotoBase64;
            } else {
                patio.unshift({
                    id: Date.now(),
                    placa, modelo, cliente, foto: fotoBase64,
                    entrada: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
                    timestampEntrada: new Date().getTime()
                });
            }

            localStorage.setItem('patio_data', JSON.stringify(patio));
            cancelarEdicao();
            renderizar(patio);
            mudarAba('patio');
        });

        window.removerVeiculo = (id) => {
            if(confirm("Deseja confirmar a SAÍDA definitiva?")) {
                const veiculo = patio.find(v => v.id === id);
                const saidaHora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
                
                // Adiciona ao histórico com detalhes
                historico.unshift({ ...veiculo, saida: saidaHora });
                localStorage.setItem('patio_historico', JSON.stringify(historico));

                patio = patio.filter(v => v.id !== id);
                localStorage.setItem('patio_data', JSON.stringify(patio));
                renderizar(patio);
            }
        };

        window.editarVeiculo = (id) => {
            const v = patio.find(v => v.id == id);
            document.getElementById('edit-id').value = v.id;
            document.getElementById('placa').value = v.placa;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('cliente').value = v.cliente;
            document.getElementById('btn-submit').innerText = "SALVAR ALTERAÇÕES";
            document.getElementById('btn-cancelar').classList.remove('hidden');
            mudarAba('entrada');
        };

        window.cancelarEdicao = () => {
            document.getElementById('form-entrada').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('btn-submit').innerText = "CONFIRMAR ENTRADA";
            document.getElementById('btn-cancelar').classList.add('hidden');
            document.getElementById('label-foto').innerText = '📸 Tirar/Alterar Foto';
        };

        function renderizar(dados) {
            const lista = document.getElementById('lista-veiculos');
            lista.innerHTML = '';
            document.getElementById('contador').innerText = `${patio.length} NO PÁTIO`;
            dados.forEach(v => {
                lista.innerHTML += `
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col p-4 gap-3">
                        <div class="flex items-center gap-4">
                            <div class="w-20 h-20 rounded-2xl bg-gray-50 overflow-hidden border border-gray-100 flex-shrink-0">
                                ${v.foto ? `<img src="${v.foto}" class="w-full h-full object-cover">` : `<div class="flex items-center justify-center h-full text-[8px] text-gray-300 font-bold uppercase">Sem Foto</div>`}
                            </div>
                            <div class="flex-1">
                                <h3 class="font-black text-gray-900 text-xl tracking-tighter">${v.placa}</h3>
                                <p class="text-xs font-bold text-blue-600 uppercase mb-1">${v.cliente}</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase italic">Entrada: ${v.entrada}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 border-t pt-3 border-gray-50">
                            <button onclick="editarVeiculo(${v.id})" class="flex-1 bg-gray-50 text-gray-500 font-bold p-3 rounded-xl text-[10px] uppercase">Editar</button>
                            <button onclick="removerVeiculo(${v.id})" class="flex-1 bg-green-600 text-white font-bold p-3 rounded-xl text-[10px] uppercase shadow-md active:bg-green-700">Dar Saída</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderizarRelatorio() {
            const lista = document.getElementById('lista-relatorio');
            lista.innerHTML = '';
            if(historico.length === 0) {
                lista.innerHTML = '<p class="text-center py-10 text-gray-400 text-sm">Nenhuma saída registrada hoje.</p>';
                return;
            }
            historico.forEach(v => {
                lista.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl flex items-center gap-3 border border-gray-200 shadow-sm opacity-80">
                        <img src="${v.foto || ''}" class="w-12 h-12 rounded-lg object-cover bg-gray-100">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="font-black text-sm">${v.placa}</span>
                                <span class="text-[9px] text-gray-400 font-bold">${v.entrada} » ${v.saida}</span>
                            </div>
                            <p class="text-[10px] text-gray-500 uppercase">${v.cliente} • ${v.modelo}</p>
                        </div>
                    </div>
                `;
            });
        }

        window.limparHistorico = () => { if(confirm("Limpar todo o relatório?")) { historico = []; localStorage.setItem('patio_historico', JSON.stringify(historico)); renderizarRelatorio(); } };
        function filtrarVeiculos() {
            const t = document.getElementById('busca').value.toUpperCase();
            const f = patio.filter(v => v.placa.includes(t) || v.modelo.toUpperCase().includes(t) || v.cliente.toUpperCase().includes(t));
            renderizar(f);
        }
        renderizar(patio);
    </script>
</body>
</html>
