<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PÁTIO PRO v6.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #f4f4f5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input { background: #111 !important; border: 1px solid #222 !important; color: white !important; outline: none; }
        .btn-red { background-color: #ef4444; color: white; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 sticky top-0 z-40 bg-[#050505]/90 backdrop-blur-lg border-b border-white/5 flex justify-between items-center">
        <h1 id="nome-oficina-display" class="text-xl font-black italic uppercase">PÁTIO<span class="text-red-500">PRO</span></h1>
        <div id="contador" class="bg-red-600/10 border border-red-500/20 text-red-500 text-[10px] font-black px-4 py-2 rounded-full uppercase italic">0 VEÍCULOS</div>
    </header>

    <main class="p-5 max-w-lg mx-auto">
        <div id="menu-inicial" class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="mostrarAba('entrada')" class="glass p-6 rounded-3xl flex flex-col items-center border-b-2 border-red-500">
                <span class="text-3xl mb-2">📸</span>
                <span class="text-[10px] font-black uppercase tracking-widest">Entrada</span>
            </button>
            <button onclick="mostrarAba('ajustes')" class="glass p-6 rounded-3xl flex flex-col items-center border-b-2 border-zinc-800">
                <span class="text-3xl mb-2">⚙️</span>
                <span class="text-[10px] font-black uppercase tracking-widest">Ajustes</span>
            </button>
        </div>

        <section id="aba-entrada" class="space-y-4">
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <input id="placa" type="text" placeholder="PLACA" class="w-full p-4 rounded-2xl font-black text-2xl text-red-500 text-center uppercase">
                
                <div class="relative">
                    <input id="fotoInput" type="file" accept="image/*" capture="camera" class="hidden">
                    
                    <label id="label-foto" for="fotoInput" class="flex flex-col items-center justify-center p-10 border-2 border-dashed border-zinc-800 rounded-3xl bg-black/40 cursor-pointer">
                        <span id="status-icon" class="text-4xl mb-2">📷</span>
                        <span id="status-text" class="text-[9px] font-black uppercase text-zinc-500 text-center">Tocar para abrir câmera</span>
                    </label>

                    <div id="container-preview" class="hidden relative">
                        <img id="img-preview" src="" class="w-full rounded-2xl border border-white/10">
                        <button onclick="removerFoto()" class="absolute top-2 right-2 bg-red-600 text-white w-8 h-8 rounded-full font-bold">✕</button>
                    </div>
                </div>

                <input id="modelo" type="text" placeholder="MODELO / COR" class="w-full p-4 rounded-xl text-xs font-bold uppercase">
                <button id="btn-salvar" onclick="salvarRegistro()" class="w-full btn-red py-5 rounded-2xl text-xs tracking-widest">Salvar no Pátio</button>
            </div>
        </section>

        <section id="aba-patio" class="mt-8 space-y-4">
            <h2 class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Veículos no Pátio</h2>
            <div id="lista-patio" class="space-y-4"></div>
        </section>

        <section id="aba-ajustes" class="hidden mt-8 space-y-4">
            <div class="glass p-6 rounded-3xl text-center">
                <p id="texto-validade" class="text-xs font-black text-white uppercase mb-4 italic"></p>
                <input id="chave-renovacao" type="password" placeholder="CHAVE" class="w-full p-3 rounded-lg text-center mb-2">
                <button onclick="renovarAssinatura()" class="w-full bg-white/10 py-3 rounded-lg text-[10px] font-black uppercase">Renovar +30 Dias</button>
            </div>
            <button onclick="limparTudo()" class="w-full text-[8px] text-zinc-800 font-black uppercase">Limpar Tudo</button>
        </section>
    </main>

    <div id="tela-bloqueio" class="hidden fixed inset-0 bg-black flex flex-col items-center justify-center p-10 text-center z-[999]">
        <h1 class="text-2xl font-black text-red-500 italic mb-4 uppercase">Acesso Expirado</h1>
        <input id="chave-bloqueio" type="password" placeholder="CHAVE DE ACESSO" class="w-full p-5 bg-zinc-900 rounded-2xl text-center text-white font-black mb-4">
        <button onclick="ativarPeloBloqueio()" class="w-full btn-red p-5 rounded-2xl text-xs mb-6">Liberar</button>
        <a href="https://wa.me/5511953795473" class="text-green-500 text-[10px] font-black uppercase tracking-widest">Suporte: (11) 95379-5473</a>
    </div>

    <script>
        const MASTER_KEY = "PATIO2026";
        let db = JSON.parse(localStorage.getItem('controle_patio_db')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { 
            nomeOficina: "PÁTIO PRO", 
            validade: new Date().getTime() + (30 * 24 * 60 * 60 * 1000) 
        };
        let fotoFinal = "";

        // --- MOTOR DE FOTO REFORÇADO ---
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status-icon').innerText = "⌛";
            document.getElementById('status-text').innerText = "PROCESSANDO...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Comprime para 600px (tamanho ideal para não travar nada)
                    const scale = 600 / img.width;
                    canvas.width = 600;
                    canvas.height = img.height * scale;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Converte para string leve
                    fotoFinal = canvas.toDataURL('image/jpeg', 0.5);

                    // Mostra o preview
                    document.getElementById('img-preview').src = fotoFinal;
                    document.getElementById('container-preview').classList.remove('hidden');
                    document.getElementById('label-foto').classList.add('hidden');
                    
                    document.getElementById('status-icon').innerText = "📷";
                    document.getElementById('status-text').innerText = "Tocar para abrir câmera";
                };
            };
        });

        function removerFoto() {
            fotoFinal = "";
            document.getElementById('container-preview').classList.add('hidden');
            document.getElementById('label-foto').classList.remove('hidden');
            document.getElementById('fotoInput').value = "";
        }

        // --- FUNÇÕES DE LICENÇA ---
        function verificarLicenca() {
            const hoje = new Date().getTime();
            const faltam = Math.ceil((config.validade - hoje) / (1000 * 60 * 60 * 24));
            document.getElementById('texto-validade').innerText = faltam > 0 ? `Vence em ${faltam} dias` : "Assinatura Expirada";

            if (hoje > config.validade) {
                document.getElementById('tela-bloqueio').classList.remove('hidden');
            }
        }

        function renovarAssinatura() {
            if (document.getElementById('chave-renovacao').value.toUpperCase() === MASTER_KEY) {
                config.validade = Math.max(new Date().getTime(), config.validade) + (30 * 24 * 60 * 60 * 1000);
                localStorage.setItem('patio_config', JSON.stringify(config));
                alert("RENOVADO!"); location.reload();
            } else { alert("CHAVE ERRADA!"); }
        }

        function ativarPeloBloqueio() {
            if (document.getElementById('chave-bloqueio').value.toUpperCase() === MASTER_KEY) {
                config.validade = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);
                localStorage.setItem('patio_config', JSON.stringify(config));
                location.reload();
            } else { alert("CHAVE INVÁLIDA!"); }
        }

        // --- CORE ---
        function salvarRegistro() {
            const placa = document.getElementById('placa').value.toUpperCase();
            if(!placa || !fotoFinal) return alert("Coloque a PLACA e a FOTO!");
            
            db.push({
                id: Date.now(),
                placa: placa,
                modelo: document.getElementById('modelo').value.toUpperCase(),
                foto: fotoFinal,
                data: new Date().toLocaleDateString('pt-BR'),
                ativo: true
            });
            localStorage.setItem('controle_patio_db', JSON.stringify(db));
            location.reload();
        }

        function mostrarAba(aba) {
            document.getElementById('aba-entrada').classList.add('hidden');
            document.getElementById('aba-ajustes').classList.add('hidden');
            document.getElementById('aba-' + aba).classList.remove('hidden');
        }

        function renderizar() {
            const container = document.getElementById('lista-patio');
            container.innerHTML = "";
            let ativos = 0;
            db.slice().reverse().forEach(v => {
                if(v.ativo) {
                    ativos++;
                    container.innerHTML += `
                        <div class="glass p-4 rounded-3xl flex items-center gap-4">
                            <img src="${v.foto}" class="w-16 h-16 object-cover rounded-xl shadow-lg">
                            <div class="flex-1">
                                <h3 class="text-xl font-black italic text-white uppercase">${v.placa}</h3>
                                <p class="text-[9px] text-zinc-600 font-bold uppercase">${v.modelo || 'VEÍCULO'}</p>
                            </div>
                            <button onclick="darSaida(${v.id})" class="bg-red-600/20 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase">SAÍDA</button>
                        </div>`;
                }
            });
            document.getElementById('contador').innerText = `${ativos} VEÍCULOS`;
        }

        function darSaida(id) {
            if(confirm("Confirmar saída do veículo?")) {
                const i = db.findIndex(x => x.id === id);
                db[i].ativo = false;
                localStorage.setItem('controle_patio_db', JSON.stringify(db));
                renderizar();
            }
        }

        function limparTudo() { if(confirm("Apagar todos os dados?")) { localStorage.clear(); location.reload(); } }

        verificarLicenca();
        renderizar();
    </script>
</body>
</html>
