<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="manifest.json">
    <title>Pátio Pro Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #bloqueio { display: none; position: fixed; inset: 0; background: white; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800">

    <div id="bloqueio">
        <h2 class="text-xl font-bold mb-4">Licença Expirada</h2>
        <input type="password" id="senha-licenca" placeholder="Senha 0907" class="border-2 p-4 rounded-xl w-full max-w-xs mb-4 text-center">
        <button onclick="verificarSenha()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">Ativar App</button>
    </div>

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-2xl">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="app-nome-display" class="text-xl font-black italic tracking-tighter uppercase leading-none">PÁTIO PRO</h1>
                <span id="dias-restantes" class="text-[9px] font-bold opacity-70 italic tracking-tight">Verificando...</span>
            </div>
            <span id="contador" class="bg-blue-900 px-3 py-1 rounded-full text-[10px] font-bold uppercase">0 NO PÁTIO</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-100">
                <form id="form-entrada" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-black text-xl uppercase">
                    <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold">
                    <input type="text" id="cliente" placeholder="NOME DO CLIENTE" required class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold">
                    
                    <div id="container-previa" class="hidden w-full h-44 rounded-2xl overflow-hidden border-2 border-blue-100">
                        <img id="img-previa" class="w-full h-full object-cover">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex flex-col items-center justify-center border-2 border-blue-200 p-4 rounded-2xl text-blue-600 cursor-pointer bg-blue-50 active:bg-blue-100">
                            <span class="font-bold text-xs uppercase italic">📸 Câmera</span>
                            <input type="file" id="foto-camera" accept="image/*" capture="environment" class="hidden" onchange="mostrarPrevia(this)">
                        </label>
                        <label class="flex flex-col items-center justify-center border-2 border-gray-200 p-4 rounded-2xl text-gray-600 cursor-pointer bg-gray-50 active:bg-gray-100">
                            <span class="font-bold text-xs uppercase italic">🖼️ Galeria</span>
                            <input type="file" id="foto-galeria" accept="image/*" class="hidden" onchange="mostrarPrevia(this)">
                        </label>
                    </div>
                    
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-black p-4 rounded-2xl shadow-lg uppercase tracking-wider active:scale-95 transition-all">Confirmar Entrada</button>
                    <button type="button" id="btn-cancelar" onclick="cancelarEdicao()" class="hidden w-full bg-gray-100 text-gray-500 font-bold p-3 rounded-2xl mt-2 uppercase text-[10px]">Cancelar Edição</button>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-relatorio" class="tab-content">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 ml-2">Histórico Detalhado</h2>
            <div id="lista-relatorio" class="space-y-3"></div>
            <button onclick="limparHistorico()" class="w-full mt-8 text-red-500 font-bold text-[10px] p-4 bg-red-50 rounded-2xl uppercase tracking-[0.2em] border border-red-100">Limpar Relatório</button>
        </section>

        <section id="aba-config" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-md space-y-6">
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 text-blue-600 text-[11px] font-bold uppercase">
                    <p id="status-assinatura-detalhe"></p>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-2">Título do Estabelecimento</label>
                    <input type="text" id="config-nome" class="w-full bg-gray-50 border-2 p-4 rounded-2xl mt-1 outline-none font-bold text-blue-900 uppercase">
                    <button onclick="salvarConfig()" class="w-full bg-blue-700 text-white font-bold p-3 rounded-xl mt-3 shadow-md uppercase text-xs">Salvar Nome</button>
                </div>
                <div class="grid grid-cols-2 gap-3 border-t pt-4">
                    <button onclick="exportarBackup()" class="bg-gray-800 text-white p-3 rounded-xl text-[10px] font-bold uppercase italic">Exportar Backup</button>
                    <button onclick="importarBackup()" class="bg-gray-200 text-gray-600 p-3 rounded-xl text-[10px] font-bold uppercase italic">Importar Backup</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-20 z-50 px-2 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button onclick="mudarAba('entrada')" id="btn-nav-entrada" class="nav-button active flex flex-col items-center flex-1 p-2"><span class="text-lg">➕</span><span class="text-[8px] font-black uppercase mt-1">Entrada</span></button>
        <button onclick="mudarAba('patio')" id="btn-nav-patio" class="nav-button flex flex-col items-center flex-1 p-2"><span class="text-lg">🚗</span><span class="text-[8px] font-black uppercase mt-1">Pátio</span></button>
        <button onclick="mudarAba('relatorio')" id="btn-nav-relatorio" class="nav-button flex flex-col items-center flex-1 p-2"><span class="text-lg">📋</span><span class="text-[8px] font-black uppercase mt-1">Relatório</span></button>
        <button onclick="mudarAba('config')" id="btn-nav-config" class="nav-button flex flex-col items-center flex-1 p-2"><span class="text-lg">⚙️</span><span class="text-[8px] font-black uppercase mt-1">Ajustes</span></button>
    </nav>

    <script>
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO" };
        let ultimaFotoBase64 = null;
        const SENHA_MESTRA = "0907";

        const processarImagem = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 400; 
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.4));
                    }
                }
            });
        };

        async function mostrarPrevia(input) {
            if (input.files && input.files[0]) {
                ultimaFotoBase64 = await processarImagem(input.files[0]);
                document.getElementById('img-previa').src = ultimaFotoBase64;
                document.getElementById('container-previa').classList.remove('hidden');
            }
        }

        function verificarLicenca() {
            let dataAtivacao = localStorage.getItem('data_ativacao');
            if (!dataAtivacao) { dataAtivacao = Date.now(); localStorage.setItem('data_ativacao', dataAtivacao); }
            const trintaDias = 30 * 24 * 60 * 60 * 1000;
            const decorrido = Date.now() - dataAtivacao;
            const diasFaltando = Math.max(0, Math.ceil((trintaDias - decorrido) / (1000 * 60 * 60 * 24)));
            document.getElementById('dias-restantes').innerText = diasFaltando + " dias restantes";
            document.getElementById('status-assinatura-detalhe').innerText = "Licença expira em " + diasFaltando + " dias";
            if (decorrido > trintaDias) document.getElementById('bloqueio').style.display = 'flex';
        }

        function verificarSenha() {
            if (document.getElementById('senha-licenca').value === SENHA_MESTRA) {
                localStorage.setItem('data_ativacao', Date.now());
                document.getElementById('bloqueio').style.display = 'none';
                verificarLicenca();
            } else { alert("Senha incorreta!"); }
        }

        document.getElementById('form-entrada').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const agora = new Date();
            // APENAS A DATA (DIA/MÊS)
            const dataSomente = agora.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});

            const dados = {
                id: id ? Number(id) : Date.now(),
                placa: document.getElementById('placa').value.toUpperCase(),
                modelo: document.getElementById('modelo').value.toUpperCase(),
                cliente: document.getElementById('cliente').value.toUpperCase(),
                foto: ultimaFotoBase64,
                entrada: id ? patio.find(v => v.id == id).entrada : dataSomente
            };

            if(id) { 
                const index = patio.findIndex(v => v.id == id);
                if (!dados.foto) dados.foto = patio[index].foto;
                patio[index] = dados; 
            } else { patio.unshift(dados); }
            
            localStorage.setItem('patio_data', JSON.stringify(patio));
            cancelarEdicao(); renderizarPátio(); mudarAba('patio');
        });

        function renderizarPátio() {
            const container = document.getElementById('lista-veiculos'); container.innerHTML = '';
            document.getElementById('contador').innerText = patio.length + " NO PÁTIO";
            if (patio.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-gray-300 font-bold uppercase italic text-sm">Pátio Vazio</div>';
                return;
            }
            patio.forEach(v => {
                container.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex gap-4 items-center">
                    <img src="${v.foto || ''}" class="w-20 h-20 rounded-2xl object-cover bg-gray-50 border border-gray-100 flex-shrink-0">
                    <div class="flex-1 overflow-hidden">
                        <div class="font-black text-xl leading-none mb-1 tracking-tighter">${v.placa}</div>
                        <div class="text-[10px] text-blue-600 font-black uppercase truncate">${v.modelo}</div>
                        <div class="text-[9px] text-gray-400 font-bold uppercase truncate">${v.cliente} • ${v.entrada}</div>
                        <div class="flex gap-2 mt-3">
                            <button onclick="editarVeiculo(${v.id})" class="text-[9px] font-black bg-gray-100 text-gray-500 px-4 py-2 rounded-xl uppercase tracking-widest">Editar</button>
                            <button onclick="darSaida(${v.id})" class="text-[9px] font-black bg-green-600 text-white px-4 py-2 rounded-xl shadow-md shadow-green-100 uppercase italic tracking-widest">Saída</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function renderizarRelatorio() {
            const container = document.getElementById('lista-relatorio'); container.innerHTML = '';
            if (historico.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-gray-300 font-bold uppercase italic text-sm">Nenhum registro</div>';
                return;
            }
            historico.forEach(v => {
                container.innerHTML += `
                <div class="bg-white p-4 rounded-3xl border border-gray-100 flex gap-4 items-center shadow-sm">
                    <img src="${v.foto || ''}" class="w-16 h-16 rounded-2xl object-cover border border-gray-100 flex-shrink-0">
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-start">
                            <span class="font-black text-lg tracking-tighter leading-none text-gray-800">${v.placa}</span>
                            <span class="text-[8px] bg-blue-50 text-blue-500 font-black px-2 py-1 rounded-md uppercase">Finalizado</span>
                        </div>
                        <p class="text-[10px] text-blue-600 font-black uppercase truncate mt-0.5">${v.modelo} | ${v.cliente}</p>
                        <p class="text-[9px] text-green-600 font-black italic uppercase mt-1">✓ ${v.servico || 'Finalizado'}</p>
                        <div class="mt-2 pt-2 border-t border-gray-50 flex justify-between text-[8px] font-bold text-gray-400 uppercase">
                            <span>E: ${v.entrada}</span>
                            <span>S: ${v.saida}</span>
                        </div>
                    </div>
                </div>`;
            });
        }

        window.darSaida = (id) => {
            const servicoRealizado = prompt("Qual serviço foi realizado neste veículo?");
            if (servicoRealizado !== null) {
                const v = patio.find(v => v.id === id);
                const agora = new Date();
                // APENAS A DATA (DIA/MÊS)
                const dataSomenteSaida = agora.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
                
                historico.unshift({
                    ...v, 
                    saida: dataSomenteSaida,
                    servico: servicoRealizado || "Serviço Finalizado"
                });
                
                localStorage.setItem('patio_historico', JSON.stringify(historico));
                patio = patio.filter(v => v.id !== id);
                localStorage.setItem('patio_data', JSON.stringify(patio));
                renderizarPátio();
            }
        };

        window.editarVeiculo = (id) => {
            const v = patio.find(v => v.id == id);
            document.getElementById('edit-id').value = v.id;
            document.getElementById('placa').value = v.placa;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('cliente').value = v.cliente;
            if(v.foto) {
                ultimaFotoBase64 = v.foto;
                document.getElementById('img-previa').src = v.foto;
                document.getElementById('container-previa').classList.remove('hidden');
            }
            document.getElementById('btn-submit').innerText = "ATUALIZAR DADOS";
            document.getElementById('btn-cancelar').classList.remove('hidden');
            mudarAba('entrada');
        };

        window.cancelarEdicao = () => {
            document.getElementById('form-entrada').reset();
            document.getElementById('edit-id').value = '';
            ultimaFotoBase64 = null;
            document.getElementById('container-previa').classList.add('hidden');
            document.getElementById('btn-submit').innerText = "CONFIRMAR ENTRADA";
            document.getElementById('btn-cancelar').classList.add('hidden');
        };

        function mudarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            document.getElementById('btn-nav-' + aba).classList.add('active');
            if(aba === 'relatorio') renderizarRelatorio();
            window.scrollTo(0,0);
        }

        function salvarConfig() {
            const novoNome = document.getElementById('config-nome').value.toUpperCase();
            if (novoNome) {
                config.nome = novoNome;
                localStorage.setItem('patio_config', JSON.stringify(config));
                document.getElementById('app-nome-display').innerText = config.nome;
                alert("Configuração salva!");
            }
        }

        function exportarBackup() {
            const blob = new Blob([JSON.stringify({ patio, historico, config })], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup_patio.json`; a.click();
        }

        function importarBackup() {
            const input = document.createElement('input'); input.type = 'file';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = () => {
                    const data = JSON.parse(reader.result);
                    localStorage.setItem('patio_data', JSON.stringify(data.patio || []));
                    localStorage.setItem('patio_historico', JSON.stringify(data.historico || []));
                    localStorage.setItem('patio_config', JSON.stringify(data.config || {nome: "PÁTIO PRO"}));
                    location.reload();
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        window.limparHistorico = () => { if(confirm("Deseja apagar o histórico permanentemente?")) { historico = []; localStorage.setItem('patio_historico', JSON.stringify(historico)); renderizarRelatorio(); }};
        
        document.getElementById('app-nome-display').innerText = config.nome;
        document.getElementById('config-nome').value = config.nome;
        verificarLicenca();
        renderizarPátio();
    </script>
</body>
</html>
