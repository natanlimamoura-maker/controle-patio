<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Elite V3</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/741/741407.png">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #modal-saida, #pagina-detalhes, #bloqueio { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        #pagina-detalhes { background: #f3f4f6; flex-direction: column; justify-content: flex-start; overflow-y: auto; }
        .pdf-card { border: 1px solid #e2e8f0; border-radius: 15px; padding: 15px; background: white; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800 font-sans">

    <header class="bg-blue-700 text-white p-5 shadow-lg sticky top-0 z-50 rounded-b-2xl flex justify-between items-center">
        <div>
            <h1 id="app-nome-display" class="text-xl font-black italic uppercase">PÁTIO PRO</h1>
            <span id="status-drive" class="text-[9px] font-bold opacity-70 uppercase">Local</span>
        </div>
        <span id="contador" class="bg-blue-900 px-3 py-1 rounded-full text-[10px] font-bold uppercase"></span>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <div class="mb-4">
            <input type="text" id="busca-geral" onkeyup="filtrarTudo()" placeholder="🔍 BUSCAR PLACA" class="w-full p-4 rounded-2xl bg-white border-2 font-bold uppercase text-center outline-none focus:border-blue-500 shadow-sm">
        </div>

        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-100">
                <form id="form-entrada" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <div class="flex justify-between items-center text-[10px] font-bold">
                        <span id="titulo-form" class="text-gray-400 uppercase">Novo Registro</span>
                        <span id="proxima-os" class="text-blue-600 bg-blue-50 px-2 py-1 rounded">OS: #000</span>
                    </div>
                    <input type="text" id="input-data-entrada" required class="w-full bg-gray-50 border-2 p-3 rounded-2xl font-bold text-center outline-none">
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-black text-xl text-center uppercase outline-none">
                    <input type="text" id="modelo" placeholder="MODELO / MARCA" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                    <input type="text" id="cliente" placeholder="CLIENTE" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                    
                    <div id="container-previa" class="hidden grid grid-cols-3 gap-2"></div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex flex-col items-center justify-center border-2 border-blue-200 p-4 rounded-2xl text-blue-600 bg-blue-50 cursor-pointer">
                            <span class="font-bold text-[10px] uppercase">📸 Foto</span>
                            <input type="file" id="foto-camera" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(this)">
                        </label>
                        <button type="submit" class="bg-blue-600 text-white font-black rounded-2xl shadow-lg uppercase text-xs">Registrar</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-config" class="tab-content">
            <div class="bg-white p-6 rounded-3xl shadow-md space-y-4">
                <h3 class="text-xs font-black uppercase text-blue-700 italic border-b pb-2">Configurações & Cloud</h3>
                
                <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <p class="text-[10px] font-black text-blue-700 mb-2 uppercase">Independência Google Drive</p>
                    <button id="btn-login-drive" onclick="loginGoogle()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold text-[10px] uppercase">Conectar meu Drive</button>
                    <p class="text-[8px] text-gray-400 mt-2">*Cada usuário usa seu próprio Drive pessoal.</p>
                </div>

                <input type="text" id="config-nome" placeholder="NOME DA OFICINA" class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold uppercase outline-none">
                <button onclick="salvarConfig()" class="w-full bg-blue-700 text-white font-bold p-3 rounded-xl uppercase text-[10px]">Salvar Nome</button>
                
                <div class="grid grid-cols-2 gap-3 pt-4 border-t">
                    <button onclick="exportarBackup()" class="bg-gray-800 text-white p-4 rounded-2xl text-[9px] font-bold uppercase">Backup Celular</button>
                    <button onclick="document.getElementById('input-import').click()" class="bg-gray-200 text-gray-600 p-4 rounded-2xl text-[9px] font-bold uppercase">Restaurar</button>
                    <input type="file" id="input-import" class="hidden" onchange="importarBackup(this)">
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-20 z-50">
        <button onclick="mudarAba('entrada')" class="nav-button active flex-1 flex flex-col items-center"><span>➕</span><span class="text-[8px] font-bold mt-1">ENTRADA</span></button>
        <button onclick="mudarAba('patio')" class="nav-button flex-1 flex flex-col items-center"><span>🚗</span><span class="text-[8px] font-bold mt-1">PÁTIO</span></button>
        <button onclick="mudarAba('config')" class="nav-button flex-1 flex flex-col items-center"><span>⚙️</span><span class="text-[8px] font-bold mt-1">AJUSTES</span></button>
    </nav>

    <script>
        const CLIENT_ID = "317001427708-1rglariag6m8l4vi4a19noduuuk2dg6b.apps.googleusercontent.com";
        
        // VOLTANDO PARA OS NOMES DE GAVETA ORIGINAIS (PARA NÃO PERDER DADOS)
        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];
        let agendamentos = JSON.parse(localStorage.getItem('patio_agendamentos')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { nome: "PÁTIO PRO", os_counter: 1 };
        
        let fotosTemporarias = [];
        let googleToken = null;
        let fileIdDrive = null;

        document.getElementById('input-data-entrada').value = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});

        function mudarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-' + aba).classList.add('active');
            event.currentTarget.classList.add('active');
            if(aba === 'patio') renderizarPatio();
        }

        // GOOGLE DRIVE
        function loginGoogle() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
                callback: async (resp) => {
                    googleToken = resp.access_token;
                    document.getElementById('btn-login-drive').innerText = "✓ DRIVE CONECTADO";
                    document.getElementById('btn-login-drive').className = "w-full bg-green-500 text-white p-3 rounded-xl font-bold text-[10px] uppercase shadow-md";
                    document.getElementById('status-drive').innerText = "Nuvem Ativa";
                    await buscarArquivoNoDrive();
                },
            });
            client.requestAccessToken();
        }

        async function buscarArquivoNoDrive() {
            try {
                const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='patio_pro_db.json'`, { headers: { 'Authorization': `Bearer ${googleToken}` } });
                const d = await r.json(); if (d.files && d.files.length > 0) fileIdDrive = d.files[0].id;
            } catch(e) {}
        }

        async function salvarNoDrive() {
            if(!googleToken) return;
            const metadata = { name: 'patio_pro_db.json', mimeType: 'application/json' };
            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', new Blob([JSON.stringify({patio, historico, agendamentos})], { type: 'application/json' }));
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';
            if (fileIdDrive) { url = `https://www.googleapis.com/upload/drive/v3/files/${fileIdDrive}?uploadType=multipart`; method = 'PATCH'; }
            await fetch(url, { method: method, headers: { 'Authorization': `Bearer ${googleToken}` }, body: formData });
        }

        // PROCESSAR FOTO (COMPRESSÃO MÁXIMA PARA QUANTIDADE)
        async function processarFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        const max_w = 350;
                        canvas.width = max_w; canvas.height = img.height * (max_w / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        fotosTemporarias.push(canvas.toDataURL('image/jpeg', 0.3));
                        renderizarPrevias();
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function renderizarPrevias() {
            const container = document.getElementById('container-previa'); container.innerHTML = '';
            fotosTemporarias.forEach((f, i) => { 
                container.innerHTML += `<div class="relative h-16 rounded-xl overflow-hidden border"><img src="${f}" class="w-full h-full object-cover"><button type="button" onclick="fotosTemporarias.splice(${i},1);renderizarPrevias()" class="absolute top-0 right-0 bg-red-600 text-white px-1">✕</button></div>`; 
            });
            container.classList.toggle('hidden', fotosTemporarias.length === 0);
        }

        document.getElementById('form-entrada').onsubmit = async function(e) {
            e.preventDefault();
            const dados = {
                id: Date.now(),
                os: config.os_counter.toString().padStart(3, '0'),
                placa: document.getElementById('placa').value.toUpperCase(),
                modelo: document.getElementById('modelo').value.toUpperCase(),
                cliente: document.getElementById('cliente').value.toUpperCase(),
                entrada: document.getElementById('input-data-entrada').value,
                fotos: [...fotosTemporarias]
            };
            
            patio.unshift(dados);
            config.os_counter++;
            
            localStorage.setItem('patio_data', JSON.stringify(patio));
            localStorage.setItem('patio_config', JSON.stringify(config));
            
            if(googleToken) await salvarNoDrive();
            
            alert("Veículo Registrado!");
            location.reload();
        };

        function renderizarPatio() {
            const lista = document.getElementById('lista-veiculos');
            lista.innerHTML = '';
            document.getElementById('contador').innerText = patio.length + " NO PÁTIO";
            patio.forEach(v => {
                lista.innerHTML += `
                <div class="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">
                    <img src="${v.fotos[0] || ''}" class="w-16 h-16 rounded-2xl object-cover bg-gray-100">
                    <div class="flex-1">
                        <div class="text-[9px] font-bold text-blue-600">OS #${v.os}</div>
                        <div class="font-black text-lg">${v.placa}</div>
                        <div class="text-[10px] text-gray-400 font-bold">${v.modelo}</div>
                    </div>
                </div>`;
            });
        }

        function salvarConfig() { config.nome = document.getElementById('config-nome').value.toUpperCase(); localStorage.setItem('patio_config', JSON.stringify(config)); location.reload(); }
        
        // Inicialização
        document.getElementById('app-nome-display').innerText = config.nome;
        document.getElementById('proxima-os').innerText = "OS: #" + config.os_counter.toString().padStart(3, '0');
        renderizarPatio();
    </script>
</body>
</html>
