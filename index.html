<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pátio Pro Extreme Cloud</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-button.active { color: #2563eb; background: #eff6ff; border-radius: 15px; }
        #bloqueio { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); align-items: center; justify-content: center; }
        #toast-container { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 10000; pointer-events: none; }
        .toast { background: #333; color: white; padding: 12px 25px; border-radius: 50px; margin-top: 10px; font-weight: 800; font-size: 11px; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        #modal-edicao { display: none; position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-28 text-gray-800 font-sans">

    <div id="toast-container"></div>

    <div id="bloqueio" class="flex">
        <div class="bg-white p-8 rounded-[40px] w-full max-w-sm m-4 text-center border-t-8 border-red-600">
            <h2 class="text-2xl font-black mb-2 text-red-600 italic uppercase">Acesso Expirado</h2>
            <p class="text-gray-400 text-[10px] font-black mb-6 uppercase">Insira a chave de ativação para continuar</p>
            <input type="password" id="senha-licenca" placeholder="CHAVE DO SISTEMA" class="border-2 p-5 rounded-3xl w-full mb-4 text-center font-black outline-none focus:border-red-600">
            <button onclick="ativarSistema()" class="bg-red-600 text-white w-full py-5 rounded-3xl font-black uppercase shadow-lg">Reativar</button>
        </div>
    </div>

    <div id="modal-edicao" class="p-4">
        <div class="bg-white w-full max-w-md rounded-[40px] p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 class="font-black text-blue-700 uppercase italic mb-4">Editar Veículo</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <input type="text" id="edit-placa" class="w-full p-4 bg-gray-100 rounded-2xl font-black uppercase outline-none border-2 focus:border-blue-500">
                <input type="text" id="edit-modelo" class="w-full p-4 bg-gray-100 rounded-2xl font-bold uppercase">
                <input type="text" id="edit-cliente" class="w-full p-4 bg-gray-100 rounded-2xl font-bold uppercase">
                <div id="edit-fotos-grid" class="grid grid-cols-3 gap-2"></div>
                <label class="block w-full bg-blue-100 text-blue-700 p-4 rounded-2xl text-center font-black text-xs cursor-pointer">
                    + ADICIONAR MAIS FOTOS
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="adicionarFotoEdicao(this)">
                </label>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="fecharEdicao()" class="bg-gray-200 p-4 rounded-2xl font-black uppercase text-[10px]">Cancelar</button>
                <button onclick="salvarEdicao()" class="bg-blue-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Atualizar</button>
            </div>
        </div>
    </div>

    <header class="bg-blue-700 text-white p-6 shadow-xl sticky top-0 z-50 rounded-b-[40px] flex justify-between items-end h-32">
        <div>
            <h1 class="text-2xl font-black italic uppercase tracking-tighter leading-none">PÁTIO PRO</h1>
            <span id="status-drive" class="text-[9px] font-bold opacity-60 uppercase tracking-widest italic leading-none">Verificando Cloud...</span>
        </div>
        <div class="text-right">
            <span id="contador" class="bg-blue-900/50 px-4 py-2 rounded-2xl text-[10px] font-black uppercase italic">0 NO PÁTIO</span>
        </div>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        <section id="aba-entrada" class="tab-content active">
            <div class="bg-white p-6 rounded-[35px] shadow-xl border border-gray-100">
                <form id="form-entrada" class="space-y-4">
                    <input type="text" id="placa" placeholder="PLACA" required class="w-full bg-gray-50 border-2 p-5 rounded-3xl font-black text-2xl text-center uppercase focus:border-blue-500 outline-none">
                    <input type="text" id="modelo" placeholder="MODELO" required class="w-full bg-gray-50 border-2 border-transparent p-5 rounded-2xl font-bold uppercase outline-none">
                    <input type="text" id="cliente" placeholder="NOME CLIENTE" required class="w-full bg-gray-50 border-2 border-transparent p-5 rounded-2xl font-bold uppercase outline-none">
                    <div id="container-previa" class="hidden grid grid-cols-3 gap-2 py-2"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex flex-col items-center justify-center border-2 border-dashed border-blue-200 p-5 rounded-3xl text-blue-600 bg-blue-50 cursor-pointer">
                            <span class="text-2xl">📸</span>
                            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(this)">
                        </label>
                        <button type="submit" class="bg-blue-600 text-white font-black rounded-3xl uppercase shadow-lg">Salvar</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="aba-patio" class="tab-content">
            <div id="lista-veiculos" class="space-y-4"></div>
        </section>

        <section id="aba-agendamento" class="tab-content">
            <div class="bg-white p-6 rounded-[35px] shadow-lg mb-6">
                <form id="form-agendamento" class="space-y-3">
                    <input type="date" id="agend-data" required class="w-full bg-gray-50 border-2 p-4 rounded-2xl font-bold">
                    <input type="text" id="agend-veiculo" placeholder="QUAL VEÍCULO?" required class="w-full bg-gray-50 border-2 p-5 rounded-2xl font-bold uppercase">
                    <button type="submit" class="w-full bg-orange-500 text-white font-black p-5 rounded-3xl uppercase text-xs">Agendar</button>
                </form>
            </div>
            <div id="lista-agendamentos" class="space-y-2"></div>
        </section>

        <section id="aba-relatorio" class="tab-content">
            <div class="bg-white p-4 rounded-3xl shadow-sm border-2 mb-4">
                <input type="text" id="busca-historico" onkeyup="renderizarRelatorio()" placeholder="🔍 BUSCAR PLACA" class="w-full p-4 rounded-2xl bg-gray-50 font-black uppercase text-center outline-none">
            </div>
            <div id="lista-relatorio" class="space-y-3"></div>
        </section>

        <section id="aba-config" class="tab-content">
            <div class="bg-white p-6 rounded-[35px] shadow-xl space-y-4">
                <div class="p-6 bg-blue-700 rounded-[30px] text-white text-center">
                    <button id="btn-login-drive" onclick="loginGoogle()" class="w-full bg-white text-blue-700 p-4 rounded-2xl font-black text-xs uppercase">Conectar Google Drive</button>
                </div>
                <div class="p-4 bg-gray-50 rounded-2xl border text-center">
                    <span id="dias-restantes" class="text-xs font-black text-gray-500">Verificando Licença...</span>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around items-center h-24 z-50 rounded-t-[40px] shadow-2xl">
        <button onclick="mudarAba('entrada')" class="nav-button active flex flex-col items-center flex-1"><span>➕</span><span class="text-[9px] font-black mt-1 uppercase">Entrada</span></button>
        <button onclick="mudarAba('patio')" class="nav-button flex flex-col items-center flex-1"><span>🚗</span><span class="text-[9px] font-black mt-1 uppercase">Pátio</span></button>
        <button onclick="mudarAba('agendamento')" class="nav-button flex flex-col items-center flex-1"><span>📅</span><span class="text-[9px] font-black mt-1 uppercase">Agenda</span></button>
        <button onclick="mudarAba('relatorio')" class="nav-button flex flex-col items-center flex-1"><span>📋</span><span class="text-[9px] font-black mt-1 uppercase">Histórico</span></button>
        <button onclick="mudarAba('config')" class="nav-button flex flex-col items-center flex-1"><span>⚙️</span><span class="text-[9px] font-black mt-1 uppercase">Ajustes</span></button>
    </nav>

    <script>
        const CLIENT_ID = "210762586963-8kjn81npdglg8g3j1maram9odh8iud26.apps.googleusercontent.com";
        const SENHA_MESTRA = "0907";

        let patio = JSON.parse(localStorage.getItem('patio_data')) || [];
        let historico = JSON.parse(localStorage.getItem('patio_historico')) || [];
        let agendamentos = JSON.parse(localStorage.getItem('patio_agendamentos')) || [];
        let config = JSON.parse(localStorage.getItem('patio_config')) || { os_counter: 1 };
        let fotosTemp = [], googleToken = null, fileIdDrive = null;

        function notificar(msg, cor = "#333") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast'; toast.style.background = cor;
            toast.innerHTML = msg; container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        // --- LICENÇA E BLOQUEIO ---
        function inicializarSistema() {
            if (!localStorage.getItem('data_ativacao')) localStorage.setItem('data_ativacao', Date.now());
            const dataAtivacao = parseInt(localStorage.getItem('data_ativacao'));
            const expirou = (Date.now() - dataAtivacao) > (30 * 24 * 60 * 60 * 1000);
            const licenciado = localStorage.getItem('app_licenciado') === 'true';

            if (expirou && !licenciado) {
                document.getElementById('bloqueio').style.display = 'flex';
            } else {
                const dias = Math.ceil(((30 * 24 * 60 * 60 * 1000) - (Date.now() - dataAtivacao)) / (1000 * 60 * 60 * 24));
                document.getElementById('dias-restantes').innerText = licenciado ? "SISTEMA LICENCIADO" : `${dias} DIAS DE TESTE RESTANTES`;
            }
            renderizarPatio();
            renderizarAgendamentos();
        }

        function ativarSistema() {
            if (document.getElementById('senha-licenca').value === SENHA_MESTRA) {
                localStorage.setItem('app_licenciado', 'true');
                location.reload();
            } else { notificar("CHAVE INCORRETA", "#dc2626"); }
        }

        // --- GOOGLE DRIVE ---
        function loginGoogle() {
            google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
                callback: (resp) => { 
                    googleToken = resp.access_token; 
                    document.getElementById('status-drive').innerText = "CLOUD CONECTADA";
                    notificar("CLOUD ATIVA", "#16a34a");
                    sincronizarDadosDrive(); 
                }
            }).requestAccessToken();
        }

        async function salvarNoDrive() {
            if(!googleToken) return;
            try {
                const metadata = { name: 'patio_pro_db.json', mimeType: 'application/json' };
                const formData = new FormData();
                formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                formData.append('file', new Blob([JSON.stringify({patio, historico, agendamentos})], { type: 'application/json' }));
                
                let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                let method = 'POST';
                if (fileIdDrive) { url = `https://www.googleapis.com/upload/drive/v3/files/${fileIdDrive}?uploadType=multipart`; method = 'PATCH'; }
                
                const resp = await fetch(url, { method, headers: { 'Authorization': `Bearer ${googleToken}` }, body: formData });
                if(resp.ok) notificar("✓ NUVEM ATUALIZADA", "#16a34a");
            } catch(e) { console.error(e); }
        }

        async function sincronizarDadosDrive() {
            try {
                const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='patio_pro_db.json' and trashed=false`, { headers: { 'Authorization': `Bearer ${googleToken}` } });
                const d = await r.json(); 
                if (d.files && d.files.length > 0) {
                    fileIdDrive = d.files[0].id;
                    const content = await fetch(`https://www.googleapis.com/drive/v3/files/${fileIdDrive}?alt=media`, { headers: { 'Authorization': `Bearer ${googleToken}` } });
                    const driveData = await content.json();
                    if(driveData.patio) { patio = driveData.patio; historico = driveData.historico; agendamentos = driveData.agendamentos; atualizarStorage(); renderizarPatio(); }
                }
            } catch(e) { console.error(e); }
        }

        // --- EDIÇÃO NO PÁTIO ---
        window.abrirEdicao = (id) => {
            const v = patio.find(x => x.id == id);
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-placa').value = v.placa;
            document.getElementById('edit-modelo').value = v.modelo;
            document.getElementById('edit-cliente').value = v.cliente;
            renderizarFotosEdicao(v.fotos);
            document.getElementById('modal-edicao').style.display = 'flex';
        };

        function renderizarFotosEdicao(fotos) {
            const grid = document.getElementById('edit-fotos-grid'); grid.innerHTML = '';
            fotos.forEach((f, i) => {
                grid.innerHTML += `<div class="relative h-20 rounded-xl overflow-hidden"><img src="${f}" class="w-full h-full object-cover"><button onclick="removerFotoEdicao(${i})" class="absolute top-0 right-0 bg-red-600 text-white w-5 h-5 text-[10px]">✕</button></div>`;
            });
        }

        window.removerFotoEdicao = (index) => {
            const id = document.getElementById('edit-id').value;
            const v = patio.find(x => x.id == id);
            v.fotos.splice(index, 1);
            renderizarFotosEdicao(v.fotos);
        };

        window.adicionarFotoEdicao = (input) => {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 400; canvas.height = img.height * (400 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.5);
                        const id = document.getElementById('edit-id').value;
                        patio.find(x => x.id == id).fotos.push(base64);
                        renderizarFotosEdicao(patio.find(x => x.id == id).fotos);
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.salvarEdicao = () => {
            const id = document.getElementById('edit-id').value;
            const v = patio.find(x => x.id == id);
            v.placa = document.getElementById('edit-placa').value.toUpperCase();
            v.modelo = document.getElementById('edit-modelo').value.toUpperCase();
            v.cliente = document.getElementById('edit-cliente').value.toUpperCase();
            atualizarStorage(); salvarNoDrive(); fecharEdicao(); renderizarPatio();
            notificar("DADOS ATUALIZADOS");
        };

        window.fecharEdicao = () => document.getElementById('modal-edicao').style.display = 'none';

        // --- ENTRADA E PÁTIO ---
        document.getElementById('form-entrada').onsubmit = function(e) {
            e.preventDefault();
            const novo = { id: Date.now(), placa: document.getElementById('placa').value.toUpperCase(), modelo: document.getElementById('modelo').value.toUpperCase(), cliente: document.getElementById('cliente').value.toUpperCase(), fotos: [...fotosTemp], entrada: new Date().toLocaleDateString('pt-BR') };
            patio.unshift(novo); atualizarStorage(); salvarNoDrive(); location.reload();
        };

        function renderizarPatio() {
            const container = document.getElementById('lista-veiculos'); container.innerHTML = '';
            document.getElementById('contador').innerText = patio.length + " NO PÁTIO";
            patio.forEach(v => {
                container.innerHTML += `
                <div class="bg-white p-5 rounded-[30px] shadow-md border flex gap-4 items-center animate-pop">
                    <img src="${v.fotos[0] || ''}" class="w-20 h-20 rounded-3xl object-cover bg-gray-100">
                    <div class="flex-1">
                        <div class="font-black text-xl uppercase italic leading-none">${v.placa}</div>
                        <div class="text-[10px] text-gray-400 font-bold mb-2">${v.modelo}</div>
                        <div class="flex gap-2">
                            <button onclick="abrirEdicao(${v.id})" class="flex-1 bg-blue-100 text-blue-700 p-3 rounded-2xl text-[9px] font-black uppercase">Editar</button>
                            <button onclick="abrirModalSaida(${v.id})" class="flex-1 bg-green-600 text-white p-3 rounded-2xl text-[9px] font-black uppercase">Saída</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        // --- PDF COM TODAS AS FOTOS ---
        window.gerarPDF = async () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const id = document.getElementById('saida-id-temp') ? document.getElementById('saida-id-temp').value : null; 
            // Lógica simplificada: usa o conteúdo visível da página de detalhes
            const element = document.getElementById('conteudo-pdf');
            
            // Renderiza o PDF incluindo todas as fotos do elemento detalhe-fotos-pdf
            await html2canvas(element, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const imgProps = doc.getImageProperties(imgData);
                const pdfWidth = doc.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                doc.save(`os_${Date.now()}.pdf`);
            });
        };

        // --- OUTRAS FUNÇÕES ---
        function mudarAba(id) {
            document.querySelectorAll('.tab-content').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById(`aba-${id}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function atualizarStorage() {
            localStorage.setItem('patio_data', JSON.stringify(patio));
            localStorage.setItem('patio_historico', JSON.stringify(historico));
            localStorage.setItem('patio_agendamentos', JSON.stringify(agendamentos));
        }

        function processarFoto(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 400; canvas.height = img.height * (400 / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        fotosTemp.push(canvas.toDataURL('image/jpeg', 0.5));
                        renderizarPrevias();
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function renderizarPrevias() {
            const c = document.getElementById('container-previa'); c.innerHTML = '';
            fotosTemp.forEach((f, i) => { c.innerHTML += `<div class="relative h-20 rounded-2xl overflow-hidden border"><img src="${f}" class="w-full h-full object-cover"></div>`; });
            c.classList.toggle('hidden', fotosTemp.length === 0);
        }

        window.onload = inicializarSistema;

    </script>
</body>
</html>
