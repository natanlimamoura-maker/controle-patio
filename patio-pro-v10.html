<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PÁTIO PRO v10.0</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{background:#050505;color:#fff;font-family:Inter}
.glass{background:rgba(18,18,18,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.05)}
input,textarea,select{background:#0a0a0a;border:1px solid #222;color:#fff}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:999}
img{object-fit:cover}
</style>
</head>

<body class="pb-20">

<header class="p-5 sticky top-0 bg-black/80 backdrop-blur border-b border-white/5 flex justify-between">
<h1 class="font-black italic uppercase">PÁTIO<span class="text-red-600">PRO</span></h1>
<div id="contador" class="text-xs font-black text-red-500">0 NO PÁTIO</div>
</header>

<main class="p-4 max-w-lg mx-auto space-y-4">

<section id="menu" class="grid grid-cols-2 gap-4">
<button onclick="show('entrada')" class="glass p-6 rounded-3xl text-center">➕<p class="text-xs font-black mt-2">ENTRADA</p></button>
<button onclick="show('patio')" class="glass p-6 rounded-3xl text-center">🚗<p class="text-xs font-black mt-2">PÁTIO</p></button>
<button onclick="show('historico')" class="glass p-6 rounded-3xl text-center">📜<p class="text-xs font-black mt-2">HISTÓRICO</p></button>
<button onclick="show('balanco')" class="glass p-6 rounded-3xl text-center">💰<p class="text-xs font-black mt-2">BALANÇO</p></button>
</section>

<section id="entrada" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>

<input id="eCliente" placeholder="CLIENTE">
<input id="ePlaca" placeholder="PLACA">
<input id="eModelo" placeholder="MODELO DO VEÍCULO">

<select id="eStatus">
<option value="Aguardando">AGUARDANDO</option>
<option value="Em Serviço">EM SERVIÇO</option>
<option value="Pronto">PRONTO</option>
</select>

<textarea id="eObs" placeholder="OBSERVAÇÕES"></textarea>
<input type="file" id="eFotos" accept="image/*" multiple capture="environment">

<button onclick="salvarEntrada()" class="bg-red-600 w-full py-4 rounded-xl font-black">REGISTRAR ENTRADA</button>
</section>

<section id="patio" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>
<div id="listaPatio" class="space-y-3"></div>
</section>

<section id="historico" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>
<div id="listaHistorico" class="space-y-2"></div>
</section>

<section id="balanco" class="hidden space-y-3">
<button onclick="show('menu')" class="text-xs">← Voltar</button>
<h2 id="totalMes" class="text-3xl font-black text-center">R$ 0,00</h2>
</section>

</main>

<div id="modal" class="modal">
<div class="glass p-6 rounded-3xl max-w-sm w-full space-y-3">
<h3 class="font-black">EDITAR VEÍCULO</h3>

<input id="mCliente">
<input id="mPlaca">
<input id="mModelo">

<select id="mStatus">
<option>Aguardando</option>
<option>Em Serviço</option>
<option>Pronto</option>
</select>

<textarea id="mObs"></textarea>
<input type="number" id="mValor" placeholder="VALOR R$">

<button onclick="salvarEdicao()" class="bg-green-600 w-full py-3 rounded-xl font-black">SALVAR</button>
<button onclick="darSaida()" class="bg-red-600 w-full py-3 rounded-xl font-black">DAR SAÍDA</button>
<button onclick="fecharModal()" class="text-xs">Cancelar</button>
</div>
</div>

<script>
const KEY="patio_pro_v10";
let db=JSON.parse(localStorage.getItem(KEY))||[];
let editId=null;

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function show(id){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}

function salvarEntrada(){
const fotos=[];
[...eFotos.files].forEach(f=>{
const r=new FileReader();
r.onload=e=>{fotos.push(e.target.result);if(fotos.length===eFotos.files.length)push()}
r.readAsDataURL(f);
});
if(eFotos.files.length===0)push();
function push(){
db.push({
id:Date.now(),
cliente:eCliente.value.toUpperCase(),
placa:ePlaca.value.toUpperCase(),
modelo:eModelo.value.toUpperCase(),
status:eStatus.value,
obs:eObs.value,
entrada:new Date().toISOString(),
saida:null,
valor:0,
fotos,
ativo:true
});
save();render();show("menu");
}
}

function render(){
listaPatio.innerHTML="";listaHistorico.innerHTML="";
let ativos=0,total=0,mes=new Date().getMonth();

db.slice().reverse().forEach(v=>{
if(v.ativo){
ativos++;
listaPatio.innerHTML+=`
<div class="glass p-4 rounded-2xl">
<p class="font-black">${v.placa} • ${v.status}</p>
<p class="text-xs">${v.cliente} • ${v.modelo}</p>
<div class="flex gap-2 mt-2 overflow-x-auto">
${v.fotos.map(f=>`<img src="${f}" class="w-20 h-20 rounded-xl">`).join("")}
</div>
<button onclick="abrirModal(${v.id})" class="mt-3 w-full bg-zinc-800 py-2 rounded-xl text-xs font-black">EDITAR</button>
</div>`;
}else{
listaHistorico.innerHTML+=`
<div class="glass p-3 rounded-xl flex justify-between">
<div>
<p class="font-black">${v.placa}</p>
<p class="text-xs">${new Date(v.saida).toLocaleDateString()}</p>
</div>
<p class="font-black text-green-500">R$ ${v.valor.toFixed(2)}</p>
</div>`;
if(new Date(v.saida).getMonth()===mes)total+=v.valor;
}
});
contador.innerText=ativos+" NO PÁTIO";
totalMes.innerText=total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function abrirModal(id){
editId=id;
const v=db.find(x=>x.id===id);
mCliente.value=v.cliente;
mPlaca.value=v.placa;
mModelo.value=v.modelo;
mStatus.value=v.status;
mObs.value=v.obs;
mValor.value=v.valor;
modal.style.display="flex";
}

function salvarEdicao(){
const v=db.find(x=>x.id===editId);
Object.assign(v,{
cliente:mCliente.value,
placa:mPlaca.value,
modelo:mModelo.value,
status:mStatus.value,
obs:mObs.value,
valor:parseFloat(mValor.value)||0
});
save();render();fecharModal();
}

function darSaida(){
const v=db.find(x=>x.id===editId);
v.ativo=false;
v.saida=new Date().toISOString();
save();render();fecharModal();
}

function fecharModal(){modal.style.display="none"}

render();
</script>
</body>
</html>
